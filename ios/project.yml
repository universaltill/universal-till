# XcodeGen spec for the iOS/iPadOS till shell (ut-docs#3068, ADR-0023 §1).
# The .xcodeproj is generated from this file (`xcodegen generate`) and is
# never committed — a hand-kept .pbxproj is unreviewable in a PR.
#
# build/Mobile.xcframework is the Go till server, produced by
#   gomobile bind -target=ios,iossimulator -o ios/build/Mobile.xcframework ./mobile
# (see README.md and .github/workflows/ios-ci.yml).
#
# UniversalTill/Assets.xcassets (the app icon) is generated too, by
#   ios/scripts/make-app-icon.sh
# from the canonical brand mark; run it before `xcodegen generate` so the
# catalog is picked up with the rest of the UniversalTill/ sources.
name: UniversalTill
options:
  bundleIdPrefix: com.universaltill
  developmentLanguage: en
  deploymentTarget:
    # 16.0 (owner, 2026-11-16, ut-docs#3049): Stripe Terminal iOS SDK 6.x
    # needs iOS 16. This drops iPhone 6s/SE (1st gen)/7 and iPad Air 2/mini 4
    # for the whole app; none of them can take Tap to Pay (iPhone XS+).
    iOS: "16.0"
settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
# Stripe Terminal iOS SDK for Tap to Pay on iPhone (ut-docs#3049). Pinned to
# an exact version, and Package.resolved is committed (see .gitignore): no
# floating dependency in a public repo whose TestFlight job holds the App
# Store Connect key. 6.0.0 needs iOS 16 and Xcode 16+.
packages:
  StripeTerminal:
    url: https://github.com/stripe/stripe-terminal-ios-spm
    exactVersion: 6.0.0
targets:
  UniversalTill:
    type: application
    platform: iOS
    sources:
      # Includes the generated Assets.xcassets (app icon) — see above.
      - path: UniversalTill
    dependencies:
      # gomobile builds a static framework: link it, never embed it.
      - framework: build/Mobile.xcframework
        embed: false
      # Linked in every build, used only when the Tap to Pay flag is on: the
      # code is always compiled (CI builds every line); only its
      # registration is gated (TapToPayFeature.isEnabled).
      - package: StripeTerminal
    # Explicit, because the test target below declares its own scheme and
    # Xcode then stops auto-creating this one (ios-ci.yml builds -scheme
    # UniversalTill).
    scheme: {}
    settings:
      base:
        # Tap to Pay on iPhone (ut-docs#3049) — default OFF. YES only on a
        # local dev-signed device build (ios/README.md); never in CI or
        # TestFlight. scripts/ci/guard-ios-tap-to-pay-default-off.sh pins it.
        UT_TAP_TO_PAY: "NO"
        # What Info.plist's UTTapToPayEnabled (the switch the app reads)
        # gets. Its own setting so Release can pin it: a flag passed on the
        # xcodebuild command line beats a config's UT_TAP_TO_PAY, but not
        # this.
        UT_TAP_TO_PAY_INFO: $(UT_TAP_TO_PAY)
        # YES = Stripe's simulated Tap to Pay reader (no card, no entitlement).
        UT_TAP_TO_PAY_SIMULATED: "NO"
        # Phone card-reader mode (ut-docs#6538, ADR-0198 §6) — default OFF, Debug
        # dev-signed builds only, and it needs Tap to Pay switched on as well (same
        # entitlement). Pinned like UT_TAP_TO_PAY by
        # scripts/ci/guard-ios-tap-to-pay-default-off.sh.
        UT_READER_MODE: "NO"
        UT_READER_MODE_INFO: $(UT_READER_MODE)
        # CODE_SIGN_ENTITLEMENTS picks one of these by the flag's value.
        # Not XcodeGen's `entitlements:` key: that sets it for every
        # configuration, Release included.
        UT_TTP_ENTITLEMENTS_YES: UniversalTill/UniversalTill.dev.entitlements
        UT_TTP_ENTITLEMENTS_NO: ""
        PRODUCT_BUNDLE_IDENTIFIER: com.universaltill.pos
        PRODUCT_NAME: UniversalTill
        TARGETED_DEVICE_FAMILY: "1,2" # iPhone and iPad
        # Go's net package resolves DNS through libresolv on Apple
        # platforms; the static Go archive references it but can't link it.
        OTHER_LDFLAGS: ["-lresolv"]
        ENABLE_BITCODE: NO
        GENERATE_INFOPLIST_FILE: NO
        # Assets.xcassets/AppIcon.appiconset (ios/scripts/make-app-icon.sh).
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: $(UT_TTP_ENTITLEMENTS_$(UT_TAP_TO_PAY))
        Release:
          # Apple's Tap to Pay grant is development-only (ut-docs#3047):
          # Release (TestFlight) never carries the entitlement and never
          # switches the bridge on, whatever is passed on the command line.
          # Moves to Release only in #6460.
          UT_TAP_TO_PAY: "NO"
          UT_TAP_TO_PAY_INFO: "NO"
          UT_READER_MODE: "NO"
          UT_READER_MODE_INFO: "NO"
          CODE_SIGN_ENTITLEMENTS: ""
    info:
      path: UniversalTill/Info.plist
      properties:
        CFBundleDisplayName: Universal Till
        # From the build settings, so ios-testflight.yml's MARKETING_VERSION /
        # CURRENT_PROJECT_VERSION overrides reach the bundle (XcodeGen would
        # otherwise write a literal 1.0 / 1 — ut-docs#3069).
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: en
        CFBundleAllowMixedLocalizations: true
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        # A till is used in whichever orientation its stand holds it
        # (ut-docs#3050); iPad multitasking also requires all four.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # The WebView loads the in-process server over plain http on
        # 127.0.0.1; this allows ONLY local-network/loopback http, not
        # arbitrary cleartext.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # The server binds every interface so other tills can pair and sync
        # with this one (ADR-0033, ut-docs#1256) and advertises over mDNS.
        # Texts are translated in <lang>.lproj/InfoPlist.strings.
        NSLocalNetworkUsageDescription: Universal Till finds and syncs with the other tills in your shop over the local network.
        # Discovery goes through Bonjour (BonjourBridge.swift, ut-docs#3218),
        # which may browse and advertise only the types declared here.
        NSBonjourServices:
          - _unitill-sync._tcp
          - _pdl-datastream._tcp
        # Barcode scanning with the camera from the web UI.
        NSCameraUsageDescription: Universal Till uses the camera to scan barcodes and pairing QR codes, and to take item photos.
        # The bug-report panel's voice note (getUserMedia audio). Without it
        # iOS terminates the app on the first Record tap (ut-docs#3354);
        # scripts/ci/guard-ios-usage-descriptions.sh ties web capture calls
        # to these keys.
        NSMicrophoneUsageDescription: Universal Till uses the microphone to record a voice note for a problem report.
        # Stripe Terminal (Tap to Pay on iPhone, ut-docs#3049): card
        # payments are disabled without location, and the SDK's discovery
        # asserts without the Bluetooth key even for Tap to Pay. No
        # UIBackgroundModes/bluetooth-central (Bluetooth readers only).
        NSLocationWhenInUseUsageDescription: Universal Till uses your location to accept card payments, as card networks require.
        NSBluetoothAlwaysUsageDescription: Universal Till uses Bluetooth to connect to supported card readers.
        # The build's Tap to Pay switch, read by TapToPayFeature ("YES"/"NO").
        UTTapToPayEnabled: $(UT_TAP_TO_PAY_INFO)
        UTTapToPaySimulated: $(UT_TAP_TO_PAY_SIMULATED)
        # The build's phone-reader switch, read by ReaderFeature ("YES"/"NO").
        UTReaderModeEnabled: $(UT_READER_MODE_INFO)
        # Export compliance, answered once here so App Store Connect doesn't
        # hold every TestFlight build on the questionnaire (ut-docs#3069).
        # The till uses only standard, published algorithms from Go's
        # standard library — TLS, AES-256-GCM sealing of plugin secrets
        # (internal/secrets), RFC 9180 HPKE for PIN directives
        # (internal/hpke) — no proprietary crypto. Adding proprietary or
        # non-standard encryption means revisiting this answer.
        ITSAppUsesNonExemptEncryption: false
  # Unit tests for the Tap to Pay state machine (ut-docs#3049): the pure
  # Swift Core/ sources compiled straight into the bundle — no host app, no
  # Mobile.xcframework, no StripeTerminal — so they run before gomobile bind
  # in ios-ci.yml.
  UniversalTillTapToPayTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: UniversalTillTests
      - path: UniversalTill/TapToPay/Core
      # Reader mode (ut-docs#6538): pure Swift, no Stripe, no Mobile.
      - path: UniversalTill/Reader/Core
      # The reader frame goldens the Go and Kotlin tests share (Go owns them;
      # read-only here), bundled as testdata/reader_*.json.
      - path: ../internal/fleetlink/testdata
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.universaltill.pos.taptopaytests
        GENERATE_INFOPLIST_FILE: YES
    scheme:
      testTargets:
        - UniversalTillTapToPayTests
