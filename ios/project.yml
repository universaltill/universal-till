# XcodeGen spec for the iOS/iPadOS till shell (ut-docs#3068, ADR-0023 §1).
# The .xcodeproj is generated from this file (`xcodegen generate`) and is
# never committed — a hand-kept .pbxproj is unreviewable in a PR.
#
# build/Mobile.xcframework is the Go till server, produced by
#   gomobile bind -target=ios,iossimulator -o ios/build/Mobile.xcframework ./mobile
# (see README.md and .github/workflows/ios-ci.yml).
#
# UniversalTill/Assets.xcassets (the app icon) is generated too, by
#   ios/scripts/make-app-icon.sh
# from the canonical brand mark; run it before `xcodegen generate` so the
# catalog is picked up with the rest of the UniversalTill/ sources.
name: UniversalTill
options:
  bundleIdPrefix: com.universaltill
  developmentLanguage: en
  deploymentTarget:
    iOS: "15.0"
settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
targets:
  UniversalTill:
    type: application
    platform: iOS
    sources:
      # Includes the generated Assets.xcassets (app icon) — see above.
      - path: UniversalTill
    dependencies:
      # gomobile builds a static framework: link it, never embed it.
      - framework: build/Mobile.xcframework
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.universaltill.pos
        PRODUCT_NAME: UniversalTill
        TARGETED_DEVICE_FAMILY: "1,2" # iPhone and iPad
        # Go's net package resolves DNS through libresolv on Apple
        # platforms; the static Go archive references it but can't link it.
        OTHER_LDFLAGS: ["-lresolv"]
        ENABLE_BITCODE: NO
        GENERATE_INFOPLIST_FILE: NO
        # Assets.xcassets/AppIcon.appiconset (ios/scripts/make-app-icon.sh).
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: UniversalTill/Info.plist
      properties:
        CFBundleDisplayName: Universal Till
        # From the build settings, so ios-testflight.yml's MARKETING_VERSION /
        # CURRENT_PROJECT_VERSION overrides reach the bundle (XcodeGen would
        # otherwise write a literal 1.0 / 1 — ut-docs#3069).
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: en
        CFBundleAllowMixedLocalizations: true
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        # A till is used in whichever orientation its stand holds it
        # (ut-docs#3050); iPad multitasking also requires all four.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # The WebView loads the in-process server over plain http on
        # 127.0.0.1; this allows ONLY local-network/loopback http, not
        # arbitrary cleartext.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # The server binds every interface so other tills can pair and sync
        # with this one (ADR-0033, ut-docs#1256) and advertises over mDNS.
        # Texts are translated in <lang>.lproj/InfoPlist.strings.
        NSLocalNetworkUsageDescription: Universal Till finds and syncs with the other tills in your shop over the local network.
        # Discovery goes through Bonjour (BonjourBridge.swift, ut-docs#3218),
        # which may browse and advertise only the types declared here.
        NSBonjourServices:
          - _unitill-sync._tcp
          - _pdl-datastream._tcp
        # Barcode scanning with the camera from the web UI.
        NSCameraUsageDescription: Universal Till uses the camera to scan barcodes.
        # The bug-report panel's voice note (getUserMedia audio). Without it
        # iOS terminates the app on the first Record tap (ut-docs#3354);
        # scripts/ci/guard-ios-usage-descriptions.sh ties web capture calls
        # to these keys.
        NSMicrophoneUsageDescription: Universal Till uses the microphone to record a voice note for a problem report.
        # Export compliance, answered once here so App Store Connect doesn't
        # hold every TestFlight build on the questionnaire (ut-docs#3069).
        # The till uses only standard, published algorithms from Go's
        # standard library — TLS, AES-256-GCM sealing of plugin secrets
        # (internal/secrets), RFC 9180 HPKE for PIN directives
        # (internal/hpke) — no proprietary crypto. Adding proprietary or
        # non-standard encryption means revisiting this answer.
        ITSAppUsesNonExemptEncryption: false
