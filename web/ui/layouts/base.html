{{ define "base" -}}
<!DOCTYPE html>
<html lang="{{ locale }}" dir="{{ dir }}" style="font-size: {{ uiscalepx }}px">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ .title }}</title>
    <link rel="icon" type="image/x-icon" href="/public/assets/logo/ut-logo.ico">
    <link rel="stylesheet" href="/public/app.css?v={{ assetv "public/app.css" }}" />
    {{ if and .theme (ne .theme "default") }}
    <link rel="stylesheet" href="/themes/{{ .theme }}.css?v={{ assetv "public/app.css" }}" />
    {{ end }}
    <!-- Vendored locally: the till must work fully offline. -->
    <script defer src="/public/vendor/htmx.min.js?v={{ assetv "public/vendor/htmx.min.js" }}"></script>
    <script defer src="/public/vendor/alpine.min.js?v={{ assetv "public/vendor/alpine.min.js" }}"></script>
    <script defer src="/public/app.js?v={{ assetv "public/app.js" }}"></script>
  </head>
  <body class="{{ if kiosk }}kiosk{{ end }}{{ if .saleScreen }} sale-screen{{ end }}{{ if .menuScreen }} menu-screen{{ end }}"
        data-currency="{{ currency.Code }}" data-currency-decimals="{{ currency.Decimals }}"
        data-currency-display="{{ currency.Display }}" data-currency-suffix="{{ if currency.Suffix }}1{{ end }}"
        {{ if idlelocksecs }}data-idle-lock="{{ idlelocksecs }}"{{ end }}>
    {{ template "nav" . }}
    <main class="container">{{ template "content" . }}</main>
    <footer class="statusbar" aria-label="Status">
      <span class="sb-item sb-conn" id="sb-conn"
            data-online="{{ T "status.online" }}" data-offline="{{ T "status.offline" }}">
        <span class="sb-dot"></span>
        <span class="sb-conn-text">{{ T "status.online" }}</span>
      </span>
      {{ if updateavailable }}
      <a class="sb-item sb-update" href="https://www.universaltill.com/download"
         target="_blank" rel="noopener">⬆&nbsp;{{ T "status.update_available" }}&nbsp;v{{ latestversion }}</a>
      {{ end }}
      <span class="sb-item sb-ver" title="Universal Till">Universal&nbsp;Till&nbsp;v{{ appversion }}</span>
    </footer>
    <script>
      (function () {
        var el = document.getElementById('sb-conn');
        if (!el) return;
        var txt = el.querySelector('.sb-conn-text');
        var on = el.getAttribute('data-online'), off = el.getAttribute('data-offline');
        function update() {
          var online = navigator.onLine;
          el.classList.toggle('is-offline', !online);
          txt.textContent = online ? on : off;
        }
        window.addEventListener('online', update);
        window.addEventListener('offline', update);
        update();
      })();
    </script>
  </body>
</html>
{{- end }}
