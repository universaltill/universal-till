{{ define "base" -}}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ .title }}</title>
    <link rel="icon" type="image/x-icon" href="/public/assets/logo/ut-logo.ico">
    <link rel="stylesheet" href="/public/app.css" />
    {{ if and .theme (ne .theme "default") }}
    <link rel="stylesheet" href="/themes/{{ .theme }}.css" />
    {{ end }}
    <script defer src="https://unpkg.com/htmx.org@1.9.12"></script>
    <script
      defer
      src="https://unpkg.com/alpinejs@3.14.1/dist/cdn.min.js"
    ></script>
    <script defer src="/public/app.js"></script>
  </head>
  <body>
    {{ template "nav" . }}
    <main class="container">{{ template "content" . }}</main>
  </body>
</html>
{{- end }}
