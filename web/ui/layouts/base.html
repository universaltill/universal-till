{{ define "base" -}}
<!DOCTYPE html>
<html lang="en" style="font-size: {{ uiscalepx }}px">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ .title }}</title>
    <link rel="icon" type="image/x-icon" href="/public/assets/logo/ut-logo.ico">
    <link rel="stylesheet" href="/public/app.css?v={{ assetv "public/app.css" }}" />
    {{ if and .theme (ne .theme "default") }}
    <link rel="stylesheet" href="/themes/{{ .theme }}.css?v={{ assetv "public/app.css" }}" />
    {{ end }}
    <!-- Vendored locally: the till must work fully offline. -->
    <script defer src="/public/vendor/htmx.min.js?v={{ assetv "public/vendor/htmx.min.js" }}"></script>
    <script defer src="/public/vendor/alpine.min.js?v={{ assetv "public/vendor/alpine.min.js" }}"></script>
    <script defer src="/public/app.js?v={{ assetv "public/app.js" }}"></script>
  </head>
  <body class="{{ if kiosk }}kiosk{{ end }}{{ if .saleScreen }} sale-screen{{ end }}">
    {{ template "nav" . }}
    <main class="container">{{ template "content" . }}</main>
  </body>
</html>
{{- end }}
