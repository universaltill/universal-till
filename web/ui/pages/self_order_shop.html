<!DOCTYPE html>
<html lang="{{ locale }}" dir="{{ dir }}" style="font-size: {{ uiscalepx }}px">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- ut-docs#239: see web/ui/layouts/base.html for why. -->
    <meta name="htmx-config" content='{"defaultSettleDelay":0}'>
    <title>{{ T "selforder.title" }}</title>
    <link rel="icon" type="image/x-icon" href="/public/assets/logo/ut-logo.ico">
    <link rel="stylesheet" href="/public/app.css?v={{ assetv "public/app.css" }}" />
    <script defer src="/public/vendor/htmx.min.js?v={{ assetv "public/vendor/htmx.min.js" }}"></script>
    <!-- ut-docs#400: see web/public/autofill.js's own comment for why this
         can't be app.js. Customer-facing kiosk surface — covered here too. -->
    <script defer src="/public/autofill.js?v={{ assetv "public/autofill.js" }}"></script>
    <style>
      body.selforder-shop { padding: 1rem; }
      .selforder-shop-header { display:flex; align-items:center; gap:1rem; margin-block-end:.75rem; }
      .selforder-cats { display:flex; flex-wrap:wrap; gap:.5rem; margin-block-end:1rem; }
      .selforder-shop-main { display:grid; grid-template-columns:1fr 22rem; gap:1.25rem; align-items:start; }
      .selforder-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(150px, 1fr));
        gap:1rem; }
      .selforder-tile { display:flex; flex-direction:column; align-items:stretch; gap:.4rem;
        padding:.75rem; min-height:120px; border:1px solid var(--border, #d1d5db);
        border-radius:12px; background:var(--surface, #fff); font:inherit; cursor:pointer;
        text-align:start; }
      /* ut-docs#419: the category-chip filter toggles the `hidden` IDL
         property on tiles it wants to hide (see the page script below).
         Without this rule, the tile's own author-stylesheet `display:flex`
         above overrides the UA stylesheet's `[hidden] { display:none }` —
         author rules beat UA rules regardless of specificity — so a
         "hidden" tile stayed visually onscreen even though `.hidden` was
         true in the DOM. This rule is itself an author rule with higher
         specificity than `.selforder-tile` alone, so it wins the tile back.
         Found driving the kiosk for real, not just asserting on rendered
         HTML: the server-rendered markup looks identical either way, only
         a browser actually shows the bug. */
      .selforder-tile[hidden] { display:none; }
      .selforder-tile-img { width:100%; height:72px; object-fit:contain; border-radius:8px; }
      .selforder-tile-name { font-weight:700; font-size:1rem; }
      .selforder-tile-price { color:var(--accent, #4f46e5); font-weight:700; }
      .selforder-cart { border:1px solid var(--border, #d1d5db); border-radius:12px;
        padding:1rem; position:sticky; top:1rem; }
      .selforder-cart-lines { list-style:none; margin:0 0 .75rem; padding:0; }
      .selforder-cart-line { display:grid; grid-template-columns:1fr auto auto auto;
        align-items:center; gap:.5rem; padding:.5rem 0; border-block-end:1px solid var(--border, #e5e7eb); }
      .selforder-cart-line-qty { display:flex; align-items:center; gap:.4rem; }
      .selforder-qty-btn { min-width:36px; min-height:36px; padding:0; }
      .selforder-qty-value { min-inline-size:1.5rem; text-align:center; font-variant-numeric:tabular-nums; }
      .selforder-cart-totals { margin-block-start:.5rem; }
      .selforder-cart-total { font-weight:800; font-size:1.1rem; }
      .selforder-checkout { width:100%; min-height:52px; margin-block-start:.75rem; }
      .selforder-cart-empty { text-align:center; }
      @media (max-width: 720px) {
        .selforder-shop-main { grid-template-columns:1fr; }
        .selforder-cart { position:static; }
      }
    </style>
    <script defer src="/public/cursor.js?v={{ assetv "public/cursor.js" }}"></script>
  </head>
  <body class="selforder-shop{{ if kiosk }} kiosk{{ end }}">
    <header class="selforder-shop-header">
      <a class="btn secondary" href="/self-order">← {{ T "selforder.back" }}</a>
      <a class="selforder-exit" href="/login?next=kiosk" aria-label="{{ T "selforder.exit" }}"><span aria-hidden="true">🔒</span></a>
    </header>

    {{ if .Categories }}
    <div class="selforder-cats" role="group" aria-label="{{ T "products.title" }}">
      <button type="button" class="cat-chip active" data-cat="">{{ T "selforder.all_categories" }}</button>
      {{ range .Categories }}
      <button type="button" class="cat-chip" data-cat="{{ .ID }}">{{ .Name }}</button>
      {{ end }}
    </div>
    {{ end }}

    <main class="selforder-shop-main">
      <div id="selforder-grid" class="selforder-grid" hx-get="/api/self-order/grid" hx-trigger="load" hx-swap="outerHTML"></div>
      <div id="selforder-cart" class="selforder-cart" hx-get="/api/self-order/cart" hx-trigger="load" hx-swap="outerHTML"></div>
    </main>

    <dialog id="selforder-modal" class="modifier-modal"></dialog>

    <!-- The kiosk's declared-offline signal (ut-docs#675 review, B1): the
         payment picker's checkout form hx-include's this input, and the
         checkout handler threads it into SaleInput.Offline — the same
         navigator.onLine-driven flag the cashier till's #offline-flag
         carries (web/public/app.js), minus the manual override toggle the
         kiosk deliberately doesn't surface to anonymous customers. -->
    <input type="hidden" id="selforder-offline-flag" name="offline" value="0">

    <script>
      // Every /api/self-order/* handler that answers 4xx (a rejected
      // modifier submission, a declined kiosk payment, an invalid method)
      // still sends back a full, valid re-render with an inline i18n'd
      // error message — htmx's default is to silently DROP the response
      // body on a non-2xx status instead of swapping it in. At a cashier
      // till a 4xx toast that fails to render is a minor annoyance someone
      // notices and retries; at an unattended kiosk with no cashier
      // present it would strand the customer looking at a dead button
      // with zero feedback. Force the swap for our own 4xx responses.
      document.body.addEventListener('htmx:beforeSwap', function (ev) {
        var path = ev.detail.requestConfig && ev.detail.requestConfig.path;
        if (path && path.indexOf('/api/self-order/') === 0 &&
            ev.detail.xhr.status >= 400 && ev.detail.xhr.status < 500) {
          ev.detail.shouldSwap = true;
          ev.detail.isError = false;
        }
      });

      // Category chip filter: client-side show/hide over the loaded grid.
      // This is the kiosk's sole find mechanism (ut-docs#419 removed the
      // text search box) — no round trip needed, the full catalog is
      // already on the page from the grid's own hx-trigger="load".
      (function () {
        document.addEventListener('click', function (e) {
          var chip = e.target.closest('.cat-chip');
          if (!chip) return;
          document.querySelectorAll('.cat-chip').forEach(function (c) { c.classList.remove('active'); });
          chip.classList.add('active');
          var cat = chip.getAttribute('data-cat');
          document.querySelectorAll('#selforder-grid .selforder-tile').forEach(function (tile) {
            var show = !cat || tile.getAttribute('data-cat') === cat;
            tile.hidden = !show;
          });
        });
      })();

      // Keep the offline flag current — same online/offline event wiring
      // as web/public/app.js's updateOfflineFlag for the cashier till.
      (function () {
        var input = document.getElementById('selforder-offline-flag');
        if (!input) return;
        function update() { input.value = navigator.onLine ? '0' : '1'; }
        window.addEventListener('online', update);
        window.addEventListener('offline', update);
        update();
      })();

      // Idle reset (ADR-0020, same mechanism as the /self-order landing
      // screen) — this route is also auth-exempt/no-session, so a plain
      // client-side reload after inactivity clears the screen (and the
      // shared till-level basket) for the next customer.
      (function () {
        var secs = {{ .idleResetSecs }};
        if (!secs || secs <= 0) return;
        var timer;
        function reset() {
          clearTimeout(timer);
          timer = setTimeout(function () { window.location.href = '/self-order'; }, secs * 1000);
        }
        ['pointerdown', 'keydown', 'touchstart'].forEach(function (evt) {
          document.addEventListener(evt, reset, { passive: true });
        });
        reset();
      })();
    </script>
  </body>
</html>
