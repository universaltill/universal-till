{{ define "content" }}
<div class="page-head">
  <h1>{{ T "import.title" }}</h1>
  <a class="btn secondary" href="/catalog">← {{ T "nav.catalog" }}</a>
</div>

<div class="card">
  <p class="muted">{{ T "import.help" }}</p>
  {{ if .stagedID }}
  <!-- ut-docs#1168: the operator already browsed to and previewed this exact
       file on the setup wizard's restore step — the wizard couldn't commit
       it itself (see commitStagedImportForSetup's own comment for why that
       can fail) so it sent them here with the preview's staged_id instead of
       making them re-upload and re-preview. No file input, no Preview
       button: staged_id only ever reaches this page already previewed, and
       repreviewing here isn't wired (the preview path always expects a
       fresh `file` field). Same "nothing saved until Import" contract as
       every other commit on this page — this is a convenience, not a
       bypass; the operator still presses Import for real. -->
  <p class="muted" data-setup-staged-import>{{ T "import.staged_from_setup" }}</p>
  <!-- enctype="multipart/form-data" even with no file input (review
       finding): POST /api/import's very first step is
       r.ParseMultipartForm — htmx posts a plain form urlencoded unless the
       form itself declares multipart, and ParseMultipartForm rejects a
       urlencoded body outright (ErrNotMultipart -> 400), which silently
       broke this exact "press Import" button before this fix. -->
  <form id="import-form" hx-post="/api/import" hx-target="#import-result" hx-swap="innerHTML" enctype="multipart/form-data">
    <input type="hidden" name="commit" value="1">
    <input type="hidden" name="staged_id" value="{{ .stagedID }}">
    <button class="btn primary" type="submit">{{ T "import.import" }}</button>
  </form>
  {{ else }}
  <form id="import-form" hx-post="/api/import" hx-target="#import-result" hx-swap="innerHTML" enctype="multipart/form-data">
    <input type="hidden" name="commit" id="import-commit" value="0">
    <!-- ut-docs#1247: accept is a UX hint only (the server sniffs real
         content, never trusts extension/MIME — see catimport.ParseBkp /
         zipMagic in import_page.go), so being strict here is pure downside.
         A cloud-storage provider (Google Drive, Dropbox, …) commonly reports
         an unrecognised binary like .bkp as application/octet-stream, which
         matched neither text/csv nor application/zip and made the file
         unselectable in Android's system picker. Add it alongside the
         existing hints rather than removing them, so this only ever widens
         what's selectable. -->
    <label>{{ T "import.file" }} <input type="file" name="file" accept=".csv,text/csv,.bkp,application/zip,application/octet-stream" required></label>
    <div style="display:flex; gap:.4rem; margin-top:.5rem">
      <button class="btn" type="submit" onclick="document.getElementById('import-commit').value='0'">{{ T "import.preview" }}</button>
      <button class="btn primary" type="submit" onclick="document.getElementById('import-commit').value='1'">{{ T "import.import" }}</button>
    </div>
  </form>
  {{ end }}
  <div id="import-result" style="margin-top:.8rem; overflow-x:auto"></div>
</div>

<script>
// Problem grid (ut-docs#601): a preview row's inline correction input is
// required exactly while its "Import anyway" checkbox is ticked — native
// form validation then blocks the Import submit until the correction is
// filled in. Delegated: the grid is swapped into #import-result by htmx.
// The server re-validates regardless (import.problem_grid.* statuses), so
// this is a convenience, not the enforcement.
document.getElementById('import-result').addEventListener('change', function (e) {
  var cb = e.target.closest('input[type=checkbox][data-fix-target]');
  if (!cb) return;
  var fix = document.getElementById(cb.getAttribute('data-fix-target'));
  if (fix) fix.required = cb.checked;
});
</script>

<div class="card" style="margin-top:1rem">
  <h3>{{ T "import.export_title" }}</h3>
  <p class="muted">{{ T "import.export_help" }}</p>
  <button class="btn" hx-post="/api/catalog/export-save" hx-target="#export-msg" hx-swap="innerHTML">{{ T "import.export_btn" }}</button>
  <div id="export-msg" class="muted" aria-live="polite" style="min-height:1.2rem;margin-top:.4rem"></div>
</div>
{{ end }}
