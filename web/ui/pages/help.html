{{ define "content" }}
<h1>{{ T "help.title" }}</h1>
<div class="help-shell">
  <aside class="help-nav">
    <input
      type="search"
      id="help-search"
      name="q"
      class="help-search"
      placeholder="{{ T "help.search.placeholder" }}"
      aria-label="{{ T "help.search.placeholder" }}"
      hx-get="/help/search"
      hx-trigger="keyup changed delay:300ms, search"
      hx-target="#help-tree"
      autocomplete="off"
    />
    <nav id="help-tree" class="help-tree" aria-label="{{ T "help.title" }}">
      {{ template "help_topics.html" . }}
    </nav>
    <!-- Quick hop to the installed plugins' entrypoints. Carried over from
         the old accordion Help page verbatim (same testid/href/label): it is
         a real affordance, and tests/e2e/tests/{pos_ui_mvp,plugin_install_flow}
         .spec.ts assert it is reachable from /help. -->
    <p class="help-nav-plugins">
      <a class="btn" data-testid="plugin-faq-entry" href="/plugins">{{ T "help.faq_entry" }}</a>
    </p>
  </aside>
  {{ template "help_topic.html" . }}
</div>
{{ end }}
