{{ define "content" }}
<h1>{{ T "translations.title" }}</h1>
<p class="help-intro">{{ T "translations.intro" }}</p>

{{ if .translateModeAvailable }}
<div class="card translate-mode-card" data-testid="translate-mode-card">
  <h2>{{ T "translations.mode.title" }} {{ helpLink "translate-mode" }}</h2>
  <p>{{ T "translations.mode.intro" }}</p>
  {{ if .translateModeOn }}
  <button type="button" class="btn secondary btn-touch" data-testid="translate-mode-off"
          hx-post="/api/translate-mode" hx-vals='{"on":"0"}' hx-swap="none">{{ T "translations.mode.turn_off" }}</button>
  {{ else }}
  <button type="button" class="btn btn-touch" data-testid="translate-mode-on"
          hx-post="/api/translate-mode" hx-vals='{"on":"1"}' hx-swap="none">{{ T "translations.mode.turn_on" }}</button>
  {{ end }}
</div>
{{ end }}

<div class="card">
  <form class="translations-controls" hx-get="/ui/translations-table" hx-target="#translations-table" hx-swap="outerHTML" hx-trigger="change from:select, input changed delay:300ms from:input[name='q'], submit">
    <label>{{ T "translations.locale" }}
      <select name="edit_locale">
        {{ $sel := .editLocale }}
        {{ range .locales }}
          <option value="{{ . }}" {{ if eq . $sel }}selected{{ end }}>{{ . }}</option>
        {{ end }}
      </select>
    </label>
    <label>{{ T "translations.search" }}
      <input type="search" name="q" value="" placeholder="{{ T "translations.search" }}">
    </label>
  </form>

  <div id="translations-table"
       hx-get="/ui/translations-table?edit_locale={{ .editLocale }}"
       hx-trigger="load" hx-swap="outerHTML"></div>
</div>
{{ end }}
