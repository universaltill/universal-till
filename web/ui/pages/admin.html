{{ define "content" }}
<!--
  /admin (ut-docs#2008, converted to the SAME two-pane master-detail shell
  /items uses by ut-docs#2116 -- the Architect's note on that card says to
  mirror items.html's own pattern exactly, see that file's own doc comment).
  The tree page the Menu launcher's single gated "Administration" tile
  opens. The six set-once/onboarding destinations it leads to (country
  settings, translations, the two statutory fiscal-device pages, stock
  locations/registers) are grouped into three domain clusters
  (internal/pages/admin_page.go's adminGroupOrder) down the left, and the
  selected destination's own content renders on the right -- selecting a
  row swaps ONLY #admin-panel via htmx and pushes the URL, so each
  destination stays directly linkable/bookmarkable on its own; a bare GET to
  any of them still renders its own complete standalone page, unchanged.

  Server-side gated independently of the tile that leads here
  (registerAdmin's own visibleAdminEntries check, 403 via httpx.RenderError
  when it comes back empty) -- reaching /admin directly by URL with no
  visible destination refuses the same as every other admin page in this
  product, not just a hidden tile.
-->
<div class="page-head">
  <h1>{{ T "menu.group.administration" }} {{ helpLink "menu" }}</h1>
</div>
<!-- ut-docs#2166 (product owner, on the pilot tablet): the in-content
     back-to-menu button ut-docs#2116 added here was reviewed live and
     called redundant with the nav rail's own "Menu" icon (nav.html, every
     page), which already reaches /menu — removed. The rail stays the
     single way back; see TestAdminPage_AllNonEmptyClustersRenderForFullAccessDETill
     for the "can still get back" assertion, now against the rail entry. -->

<!-- ut-docs#2183: #pos-alert now renders once, globally, from base.html
     itself — see that file's own comment. Removed from here to avoid a
     duplicate id="pos-alert". -->

<div class="items-layout">
  <aside class="items-rail-wrap" aria-label="{{ T "menu.group.administration" }}">
    {{ template "admin_tree" . }}
  </aside>
  <div class="items-panel" id="admin-panel">
    {{ if .PanelHTML }}{{ .PanelHTML }}{{ end }}
  </div>
</div>

<script>
(function () {
  // ut-docs#2116: below app.css's .items-layout breakpoint (52rem) the two
  // panes stack, and a tree tap must fall back to a plain navigation to the
  // destination's own full page instead of the wide layout's in-panel htmx
  // swap -- same reasoning and same mechanism as items.html's own identical
  // script (see that file's comment for the full "why", including why this
  // is bound on `document` rather than on #admin-tree itself: every
  // destination swap replaces the tree out-of-band, and hx-swap-oob="true"
  // is an outerHTML swap that would throw away a listener bound to the node
  // being replaced).
  document.addEventListener('click', function (evt) {
    if (!window.matchMedia('(max-width: 52rem)').matches) return;
    var t = evt.target;
    if (t && t.closest && t.closest('a.items-row, a[hx-target="#admin-panel"]')) evt.stopPropagation();
  }, true);
})();
</script>
{{ end }}
