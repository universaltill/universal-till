{{ define "content" }}
<h1>System Settings</h1>
<div class="card">
  <h2>{{ T "settings.theme.title" }}</h2>
  <form hx-post="/api/settings/theme" hx-swap="none" hx-on::after-request="window.location.reload()">
    <select name="theme">
      {{ $current := .theme }}
      {{ range .themes }}
      <option value="{{ .Key }}" {{ if eq .Key $current }}selected{{ end }}>{{ .Label }}{{ if ne .Source "built-in" }} ({{ .Source }}){{ end }}</option>
      {{ end }}
    </select>
    <button class="btn" type="submit">{{ T "settings.theme.apply" }}</button>
  </form>
</div>
<div class="card">
  <h2>All Settings</h2>
  <table class="table">
    <thead>
      <tr><th>Key</th><th>Value</th><th></th></tr>
    </thead>
    <tbody>
    {{ range $k, $v := .settingsMap }}
      <tr>
        <td><code>{{ $k }}</code></td>
        <td>
          <input type="text" name="value" value="{{ $v }}" hx-post="/api/settings/upsert" hx-include="closest tr" hx-swap="none">
          <input type="hidden" name="key" value="{{ $k }}">
        </td>
        <td><button class="btn secondary" hx-post="/api/settings/upsert" hx-include="closest tr" hx-swap="none">Update</button></td>
      </tr>
    {{ end }}
      <tr>
        <td><input type="text" name="key" placeholder="new.key" form="new-setting"></td>
        <td><input type="text" name="value" placeholder="value" form="new-setting"></td>
        <td><button class="btn" type="submit" form="new-setting">Add / Update</button></td>
      </tr>
    </tbody>
  </table>
  <form id="new-setting" hx-post="/api/settings/upsert" hx-swap="none"></form>
</div>
{{ end }}
