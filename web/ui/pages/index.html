{{ define "content" }}
<div class="kiosk-header">
  <h1>{{ T "app.name" }}</h1>
  <div class="kiosk-actions">
    <button class="btn primary" data-testid="kiosk-checkout-start"
            hx-post="/api/pos/reset" hx-target="#basket" hx-swap="outerHTML"
            onclick="setTimeout(function(){var b=document.querySelector('input[name=code]'); if(b) b.focus();}, 150)">
      {{ T "kiosk.checkout_start" }}</button>
    <a class="btn secondary" data-testid="kiosk-inventory-link" href="/inventory">{{ T "kiosk.inventory" }}</a>
    <div class="status-pill" data-testid="status-indicator">{{ T "status.online" }}</div>
  </div>
</div>

  <div class="pos-container" data-currency="{{ or .currency "GBP" }}">
    <!-- Basket loads on page load -->
    <div class="basket" hx-get="/ui/basket" hx-trigger="load" hx-swap="outerHTML"></div>

    <!-- Product buttons panel loads on page load -->
    <div class="products" hx-get="/ui/buttons" hx-trigger="load" hx-swap="outerHTML"></div>

  <!-- Tender and Scan: fixed-height panel, tabs instead of stacked cards so
       it never scrolls. Split-tender element IDs are load-bearing (app.js). -->
  <div class="tender" x-data="{ tab: 'pay' }">
    <form class="scan-row" hx-post="/api/pos/scan" hx-target="#basket" hx-swap="outerHTML">
      <input type="text" name="code" placeholder="{{ T "tender.scan.barcode" }}" autofocus required>
      <input type="number" name="qty" value="1" min="1" step="1" required title="{{ T "tender.scan.qty" }}">
      <button class="btn" type="submit">{{ T "tender.scan.add" }}</button>
    </form>

    <div id="held-sales" hx-get="/ui/held" hx-trigger="load" hx-swap="outerHTML"></div>

    <div class="tab-bar" role="tablist">
      <button type="button" class="tab" :class="tab === 'pay' && 'active'" @click="tab = 'pay'">{{ T "tender.tab.pay" }}</button>
      <button type="button" class="tab" :class="tab === 'split' && 'active'" @click="tab = 'split'">{{ T "tender.tab.split" }}</button>
    </div>

    <div class="tab-panel" x-show="tab === 'pay'">
      <input type="hidden" id="offline-flag" name="offline" value="0">
      <div class="pay-grid">
        <button class="btn pay-btn" hx-post="/api/pos/tender" hx-vals='{"amount":0,"method":"cash"}' hx-include="#offline-flag" hx-target="#basket" hx-swap="outerHTML">{{ T "tender.cash" }}</button>
        <button class="btn pay-btn" hx-post="/api/pos/tender" hx-vals='{"amount":0,"method":"card"}' hx-include="#offline-flag" hx-target="#basket" hx-swap="outerHTML">{{ T "tender.card" }}</button>
      </div>
      <label class="offline-toggle">
        <input type="checkbox" id="offline-override"> Offline mode
      </label>
    </div>

    <div class="tab-panel" x-show="tab === 'split'" x-cloak id="split-tender-card">
      <form class="split-tender-form" id="split-tender-form" autocomplete="off">
        {{ $default := .paymentMethodDefault }}
        <div class="split-grid">
          <label>Method
            <select name="method" id="split-tender-method" data-default="{{ $default }}" required>
              {{ range .paymentMethods }}
                <option value="{{ . }}" {{ if eq . $default }}selected{{ end }}>{{ . }}</option>
              {{ end }}
            </select>
          </label>
          <label>Amount
            <input type="number" name="amount" min="0.01" step="0.01" placeholder="0.00" required>
          </label>
          <label>Change
            <input type="number" name="change" min="0" step="0.01" value="0.00">
          </label>
          <label>Reference
            <input type="text" name="reference" placeholder="Last 4, auth code">
          </label>
        </div>
        <div class="split-controls">
          <button class="btn" type="button" id="split-tender-add">Add Payment</button>
          <button class="btn secondary" type="button" id="split-tender-fill">Fill Remaining</button>
        </div>
      </form>
      <div id="split-tender-payments" class="split-tender-payments empty">
        <p>No pending payments yet.</p>
      </div>
      <div id="split-tender-status" class="split-tender-status" aria-live="polite"></div>
      <div class="split-controls">
        <button class="btn primary" type="button" id="split-tender-submit">Complete Sale</button>
        <button class="btn secondary" type="button" id="split-tender-clear">Clear</button>
      </div>
    </div>

    <div class="tender-footer">
      <button class="btn secondary" hx-post="/api/pos/hold" hx-target="#basket" hx-swap="outerHTML">{{ T "hold.action" }}</button>
      <button class="btn secondary" hx-post="/api/pos/reset" hx-target="#basket" hx-swap="outerHTML">{{ T "tender.new_customer" }}</button>
    </div>
  </div>
</div>

{{ end }}
