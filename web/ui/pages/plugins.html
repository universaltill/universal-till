{{ define "content" }}
<h1>{{ T "plugins.manage.title" }}</h1>

<div class="card" style="margin-bottom:1rem; display:flex; justify-content:space-between; align-items:center; gap:1rem">
  <form method="get" action="/plugins" style="display:flex; gap:.5rem; flex:1">
    <input type="text" name="q" placeholder="{{ T "plugins.manage.search" }}" style="flex:1; max-width:320px">
    <button class="btn secondary" type="submit">{{ T "plugins.manage.search_btn" }}</button>
  </form>
  <a class="btn" href="/plugins/store">{{ T "plugins.manage.store_link" }}</a>
</div>

<div id="manage-msg" class="muted" style="min-height:1.4rem; margin-bottom:.5rem" aria-live="polite"></div>

<div id="plugin-manager"
     x-data='JSON.parse(document.getElementById("plugins-data").textContent || "{}")'>
  <script id="plugins-data" type="application/json">{{ .pluginsJSON }}</script>

  <template x-if="!items || items.length === 0">
    <div class="card"><p class="empty">{{ T "plugins.manage.empty" }}</p></div>
  </template>

  <div class="grid" style="grid-template-columns:repeat(auto-fill, minmax(280px, 1fr)); gap:1rem">
    <template x-for="p in items" :key="p.id">
      <div class="card">
        <div style="display:flex; justify-content:space-between; align-items:baseline">
          <h3 style="margin:.2rem 0" x-text="p.name"></h3>
          <span class="tag" x-text="'v' + p.version"></span>
        </div>
        <p class="muted" x-text="p.id" style="font-size:.8rem; word-break:break-all"></p>
        <div style="display:flex; gap:.4rem; align-items:center; margin-bottom:.6rem; flex-wrap:wrap">
          {{/* ut-docs#628 follow-up: reuse the same token-based tag pattern
               shifts.html/inventory.html already use (rgba tint matching
               var(--success)/var(--danger) at low opacity) instead of the
               one-off literals this chip row used to hardcode, so a theme
               retuning those tokens re-skins this page too. The disabled
               chip needs no override at all — .tag's own default styling
               (var(--surface-2)/var(--muted)/var(--border)) already IS the
               neutral look it was reinventing. */}}
          <span class="tag" x-show="p.enabled" style="background:rgba(22,163,74,.12); color:var(--success)">{{ T "plugins.manage.enabled" }}</span>
          <span class="tag" x-show="!p.enabled">{{ T "plugins.manage.disabled" }}</span>
          {{/* ut-docs#368: install_state='broken' — registered but its binary
               failed to load (e.g. a join snapshot's row with no files). Same
               ⚠-suffix warning shape as the sync chip; the tooltip explains
               how each kind of plugin recovers (store installs re-fetch
               automatically; file imports need a manual re-import). */}}
          <span class="tag" x-show="p.state === 'broken'"
                style="background:rgba(220,38,38,.12); color:var(--danger)"
                title="{{ T "plugins.status.broken_binary" }}">{{ T "plugins.manage.broken" }} ⚠</span>
          <span class="tag" x-text="p.trust"></span>
          <span class="tag warn" x-show="p.hasUpdate" x-text="'{{ T "plugins.manage.update_available" }} v' + p.latest"></span>
          {{/* ut-docs#2131: a plugin the till couldn't resolve against the
               marketplace catalog (most commonly one installed via "Import
               from file", which records no listing mapping) must never look
               like "you are current" — it looks like neither hasUpdate nor
               this tag, which is silently indistinguishable from current.
               Mutually exclusive with the warn tag above: hasUpdate is only
               ever true when a catalog match was actually found. */}}
          <span class="tag" x-show="p.versionUnknown" title="{{ T "plugins.manage.update_unknown_hint" }}">{{ T "plugins.manage.update_unknown" }}</span>
        </div>
        <div style="display:flex; gap:.5rem; flex-wrap:wrap">
          <a class="btn secondary" x-show="p.enabled" :href="'/plugins/' + encodeURIComponent(p.id) + '/settings'">{{ T "plugins.settings.title" }}</a>
          <a class="btn secondary" x-show="p.docsRoute" :href="p.docsRoute">{{ T "plugins.manage.action.docs" }}</a>
          <button class="btn secondary" x-show="p.enabled"
                  @click="act('/api/plugins/' + p.id + '/disable', 'POST')">{{ T "plugins.manage.action.disable" }}</button>
          <button class="btn" x-show="!p.enabled"
                  @click="act('/api/plugins/' + p.id + '/enable', 'POST')">{{ T "plugins.manage.action.enable" }}</button>
          <button class="btn" x-show="p.hasUpdate"
                  @click="act('/api/plugins/' + p.id + '/update', 'POST')">{{ T "plugins.manage.action.update" }}</button>
          <a class="btn secondary"
             :href="'/api/plugins/' + encodeURIComponent(p.id) + '/export?version=' + encodeURIComponent(p.version)"
             :download="p.id + '-' + p.version + '.tar.gz'">{{ T "plugins.manage.action.export" }}</a>
          <button class="btn danger"
                  @click="if (confirm('{{ T "plugins.manage.confirm_uninstall" }} ' + p.name + '?')) act('/api/plugins/' + p.id + '/uninstall', 'POST')">{{ T "plugins.manage.action.uninstall" }}</button>
        </div>
      </div>
    </template>
  </div>
</div>

<div class="card" style="margin-top:1.5rem">
  <h2>{{ T "plugins.manage.import_title" }}</h2>
  <p class="muted">{{ T "plugins.manage.import_help" }}</p>
  <form id="import-form" enctype="multipart/form-data" style="display:flex; gap:.5rem; align-items:center; flex-wrap:wrap">
    <input type="file" name="plugin_file" accept=".tar.gz,.zip" required>
    <button class="btn" type="submit">{{ T "plugins.manage.import_btn" }}</button>
  </form>
</div>

<script>
(function () {
  var msg = document.getElementById('manage-msg');
  // API errors that arrive as i18n message KEYS (not prose) map to localized
  // text here — the template-populated-lookup pattern CLAUDE.md mandates for
  // inline scripts (same as bugreport_panel.html). ut-docs#460: on a till
  // that follows a primary, install/import/uninstall are rejected with these.
  var T = {
    'plugins.install.error.replica_use_primary': '{{ T "plugins.install.error.replica_use_primary" }}',
    'plugins.uninstall.error.replica_use_primary': '{{ T "plugins.uninstall.error.replica_use_primary" }}',
    'plugins.manage.error.replica_use_primary': '{{ T "plugins.manage.error.replica_use_primary" }}'
  };
  window.act = function (url, method) {
    msg.textContent = '⏳ …';
    fetch(url, { method: method }).then(function (res) {
      // ut-docs#2157: a session-expired 401 answers with the auth
      // middleware's {code,message} error OBJECT — unlike this plugin
      // endpoint's own errors, which are always the plain string T[...]
      // above expects. Without this check, msg ends up showing the literal
      // "[object Object]" instead of a way back to sign in.
      if (res.status === 401) { window.location.href = '/login'; return; }
      return res.json().catch(function () { return {}; }).then(function (j) {
        if (res.ok && !j.error) { window.location.reload(); return; }
        msg.textContent = '✗ ' + (T[j.error] || j.error || ('HTTP ' + res.status));
      });
    }).catch(function (e) { msg.textContent = '✗ ' + e; });
  };

  document.getElementById('import-form').addEventListener('submit', function (ev) {
    ev.preventDefault();
    var fd = new FormData(ev.target);
    msg.textContent = '⏳ import…';
    fetch('/api/plugins/import-from-file', { method: 'POST', body: fd }).then(function (res) {
      // ut-docs#2157: same session-expiry shape as window.act above.
      if (res.status === 401) { window.location.href = '/login'; return; }
      return res.text().then(function (t) {
        if (res.ok) { window.location.reload(); return; }
        // The replica guard answers with the JSON envelope; legacy error
        // paths still answer plain text — show whichever arrived.
        var m = t;
        try { var j = JSON.parse(t); if (j && j.error) { m = T[j.error] || j.error; } } catch (_) {}
        msg.textContent = '✗ ' + m;
      });
    }).catch(function (e) { msg.textContent = '✗ ' + e; });
  });
})();
</script>
{{ end }}
