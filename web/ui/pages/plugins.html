{{ define "content" }}
<h1>Plugins</h1>

<!-- Tab Navigation -->
<div class="tabs mb-4" style="border-bottom: 2px solid #e5e7eb;">
  <a href="/plugins" class="tab-active" style="display: inline-block; padding: 0.75rem 1.5rem; border-bottom: 3px solid #3b82f6; color: #3b82f6; font-weight: 600; text-decoration: none;">
    Installed
  </a>
  <a href="/plugins/store" class="tab" style="display: inline-block; padding: 0.75rem 1.5rem; color: #6b7280; font-weight: 500; text-decoration: none; border-bottom: 3px solid transparent;">
    Marketplace
  </a>
</div>

<!-- Manual Import Button -->
<div style="margin-bottom: 1rem;">
  {{ template "plugin_manual_import" . }}
</div>

<!-- Toast Container -->
<div id="toast-container" style="position: fixed; top: 20px; right: 20px; z-index: 1000;"></div>

<script id="plugins-data" type="application/json">{{ .pluginsJSON }}</script>

<div class="card" x-data="{ 
    q: '', 
    data: (() => { 
      try { 
        const el = document.getElementById('plugins-data'); 
        return el ? JSON.parse(el.textContent || '{}') : {}; 
      } catch(e){ 
        return {items:[], total:0, page:1, pageSize:12, type:'', tags:[]}; 
      } 
    })(),
    get items(){ return this.data.items || []; },
    selected: new Set(), 
    bulkLoading: false,
    get page(){ return this.data.page || 1; },
    get pageSize(){ return this.data.pageSize || 12; },
    get total(){ return this.data.total || 0; },
    get type(){ return this.data.type || ''; },
    filtered() {
      const term = this.q.toLowerCase();
      return this.items.filter(i => i.name.toLowerCase().includes(term) || (i.description || '').toLowerCase().includes(term));
    },
    totalPages() {
      const count = this.total || this.filtered().length || 1;
      return Math.max(1, Math.ceil(count / this.pageSize));
    },
    paged() {
      // server-paged list; local filter limited to current page
      return this.filtered();
    },
    setPage(p) {
      const max = this.totalPages();
      if (p < 1) p = 1;
      if (p > max) p = max;
      const params = new URLSearchParams(window.location.search);
      params.set('page', p);
      params.set('size', this.pageSize);
      if (this.type) params.set('type', this.type); else params.delete('type');
      window.location.search = params.toString();
    },
    setType(t) {
      const params = new URLSearchParams(window.location.search);
      if (t) params.set('type', t); else params.delete('type');
      params.set('page', 1);
      params.set('size', this.pageSize);
      window.location.search = params.toString();
    },
    async bulkAction(action) {
      this.bulkLoading = true;
      const promises = Array.from(this.selected).map(id => {
        const plugin = this.items.find(p => p.id === id);
        if (!plugin) return Promise.resolve();
        
        const data = { id };
        if (action === 'download') data.bundleUrl = plugin.packageUrl || '';
        if (action === 'install') {
          data.route = '/plug/' + id;
          data.label = plugin.name;
        }
        
        return fetch('/api/plugins/' + action, {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: new URLSearchParams(data)
        });
      });
      
      try {
        await Promise.all(promises);
        showToast('Bulk ' + action + ' completed!', 'success');
        this.selected.clear();
        refreshAllPlugins();
      } catch (error) {
        showToast('Bulk ' + action + ' failed: ' + error.message, 'error');
      } finally {
        this.bulkLoading = false;
      }
    }
  }">
  <div style="display:flex; gap:.5rem; margin-bottom:.5rem; align-items:center; flex-wrap:wrap">
    <input type="search" placeholder="Search plugins" x-model="q" style="flex:1 1 220px;padding:.5rem;border:1px solid #ddd;border-radius:8px">
    <div class="tabs" style="display:flex; gap:.25rem; flex-wrap:wrap">
      <button class="btn secondary" :class="{'active': type === ''}" @click="setType('')">All</button>
      <template x-for="tag in (data.tags || [])" :key="tag">
        <button class="btn secondary" :class="{'active': type === tag}" @click="setType(tag)" x-text="tag"></button>
      </template>
    </div>
    <div style="display:flex; gap:.25rem; flex:1 1 auto; justify-content:flex-end">
      <button class="btn secondary" @click="selected.clear(); $nextTick(() => selected = new Set())" :disabled="selected.size === 0">Clear Selection</button>
      <button class="btn" @click="bulkAction('download')" :disabled="selected.size === 0 || bulkLoading">
        <span x-show="!bulkLoading">Bulk Download</span>
        <span x-show="bulkLoading">⏳</span>
      </button>
      <button class="btn" @click="bulkAction('install')" :disabled="selected.size === 0 || bulkLoading">
        <span x-show="!bulkLoading">Bulk Install</span>
        <span x-show="bulkLoading">⏳</span>
      </button>
    </div>
  </div>
  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:.5rem">
    <div>Page <span x-text="page"></span> / <span x-text="totalPages()"></span> (Total <span x-text="total"></span>)</div>
    <div style="display:flex; gap:.25rem">
      <button class="btn secondary" @click="setPage(page-1)" :disabled="page <= 1">Prev</button>
      <button class="btn secondary" @click="setPage(page+1)" :disabled="page >= totalPages()">Next</button>
    </div>
  </div>
  <div class="grid">
    <template x-for="p in paged()" :key="p.id">
      <div class="card" style="padding:1rem" x-data="{
            st: {downloaded:false, installed:false},
            loading: false,
            refresh(){ fetch('/api/plugins/state?id='+encodeURIComponent(p.id)).then(r=>r.ok?r.json():null).then(s=>{ if(s) this.st=s }) },
            async post(url, data, action){ 
              this.loading = true;
              try {
                const response = await fetch(url, { method:'POST', headers:{'Content-Type':'application/x-www-form-urlencoded'}, body: new URLSearchParams(data) });
                if (response.ok) {
                  showToast(`${action} successful!`, 'success');
                  this.refresh();
                } else {
                  showToast(`${action} failed!`, 'error');
                }
              } catch (error) {
                showToast(`${action} failed: ${error.message}`, 'error');
              } finally {
                this.loading = false;
              }
            }
          }" x-init="refresh()">
        <div style="display:flex; align-items:center; gap:.5rem; margin-bottom:.5rem">
          <input type="checkbox" :id="'plugin-' + p.id" @change="selected.has(p.id) ? selected.delete(p.id) : selected.add(p.id); $nextTick(() => selected = new Set(selected))">
          <h3 x-text="p.name" style="margin:0; flex:1"></h3>
          <span x-show="p.hasUpdate" style="background:#ff9800; color:white; padding:.2rem .4rem; border-radius:4px; font-size:.8rem; font-weight:bold">UPDATE AVAILABLE</span>
          <span x-show="p.version" style="background:#e9ecef; padding:.2rem .4rem; border-radius:4px; font-size:.8rem" x-text="'v' + p.version"></span>
        </div>
        </div>
        <p x-text="p.description"></p>
        <div x-show="st.installed && p.version" style="color:#28a745; font-size:.9rem; margin-bottom:.5rem">
          ✓ Installed (v<span x-text="p.version"></span>)
        </div>
        <div class="actions" style="display:flex; gap:.5rem; align-items:center; flex-wrap:wrap">
          <template x-if="!st.downloaded">
            <button class="btn" :disabled="loading" @click.prevent="post('/api/plugins/download', { id: p.id, bundleUrl: p.bundleUrl || '' }, 'Download')">
              <span x-show="!loading">Download</span>
              <span x-show="loading">⏳</span>
            </button>
          </template>
          <template x-if="st.downloaded && !st.installed">
            <button class="btn" :disabled="loading" @click.prevent="post('/api/plugins/install', { id: p.id, route: '/plug/'+p.id, label: p.name }, 'Install')">
              <span x-show="!loading">Install</span>
              <span x-show="loading">⏳</span>
            </button>
          </template>
          <template x-if="st.installed && p.hasUpdate">
            <button class="btn" style="background:#ff9800; border-color:#ff9800" :disabled="loading" @click.prevent="updatePlugin(p.id)">
              <span x-show="!loading">Update to v<span x-text="p.version"></span></span>
              <span x-show="loading">⏳</span>
            </button>
          </template>
          <template x-if="st.installed && p.enabled">
            <button class="btn secondary" :disabled="loading" @click.prevent="togglePlugin(p.id, false)">
              <span x-show="!loading">Disable</span>
              <span x-show="loading">⏳</span>
            </button>
          </template>
          <template x-if="st.installed && !p.enabled">
            <button class="btn" :disabled="loading" @click.prevent="togglePlugin(p.id, true)">
              <span x-show="!loading">Enable</span>
              <span x-show="loading">⏳</span>
            </button>
          </template>
          <template x-if="st.installed">
            <button class="btn secondary" :disabled="loading" @click.prevent="showRollbackModal(p.id)">
              <span x-show="!loading">Rollback</span>
              <span x-show="loading">⏳</span>
            </button>
          </template>
          <template x-if="st.installed">
            <button class="btn danger" :disabled="loading" @click.prevent="post('/api/plugins/uninstall', { id: p.id }, 'Uninstall')">
              <span x-show="!loading">Uninstall</span>
              <span x-show="loading">⏳</span>
            </button>
          </template>
          <template x-if="st.downloaded && !st.installed">
            <button class="btn" :disabled="loading" @click.prevent="post('/api/plugins/delete', { id: p.id }, 'Delete')">
              <span x-show="!loading">Delete Files</span>
              <span x-show="loading">⏳</span>
            </button>
          </template>
        </div>
        <div x-data="{ 
          async updatePlugin(pluginId) {
            this.loading = true;
            try {
              const response = await fetch(`/api/plugins/${pluginId}/update`, {
                method: 'POST'
              });
              if (response.ok) {
                showToast('Update successful!', 'success');
                setTimeout(() => window.location.reload(), 1500);
              } else {
                showToast('Update failed!', 'error');
              }
            } catch (error) {
              showToast(`Update failed: ${error.message}`, 'error');
            } finally {
              this.loading = false;
            }
          },
          async togglePlugin(pluginId, enable) {
            this.loading = true;
            const action = enable ? 'enable' : 'disable';
            try {
              const response = await fetch(`/api/plugins/${pluginId}/${action}`, {
                method: 'POST'
              });
              if (response.ok) {
                showToast(`Plugin ${action}d successfully!`, 'success');
                this.refresh();
              } else {
                showToast(`Failed to ${action} plugin!`, 'error');
              }
            } catch (error) {
              showToast(`Failed to ${action} plugin: ${error.message}`, 'error');
            } finally {
              this.loading = false;
            }
          },
          async showRollbackModal(pluginId) {
            // TODO: Implement rollback modal with version selection
            const version = prompt('Enter version to rollback to:');
            if (!version) return;
            
            this.loading = true;
            try {
              const response = await fetch(`/api/plugins/${pluginId}/rollback`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ version })
              });
              if (response.ok) {
                showToast('Rollback successful!', 'success');
                setTimeout(() => window.location.reload(), 1500);
              } else {
                showToast('Rollback failed!', 'error');
              }
            } catch (error) {
              showToast(`Rollback failed: ${error.message}`, 'error');
            } finally {
              this.loading = false;
            }
          }
        }"></div>
      </div>
    </template>
  </div>
</div>

<script>
function showToast(message, type = 'info') {
  const container = document.getElementById('toast-container');
  const toast = document.createElement('div');
  
  const colors = {
    success: '#28a745',
    error: '#dc3545',
    info: '#17a2b8',
    warning: '#ffc107'
  };
  
  toast.style.cssText = `
    background: ${colors[type] || colors.info};
    color: white;
    padding: 12px 20px;
    border-radius: 8px;
    margin-bottom: 10px;
    box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    transform: translateX(100%);
    transition: transform 0.3s ease;
    max-width: 300px;
    word-wrap: break-word;
  `;
  
  toast.textContent = message;
  container.appendChild(toast);
  
  // Animate in
  setTimeout(() => {
    toast.style.transform = 'translateX(0)';
  }, 10);
  
  // Auto remove after 3 seconds
  setTimeout(() => {
    toast.style.transform = 'translateX(100%)';
    setTimeout(() => {
      if (toast.parentNode) {
        toast.parentNode.removeChild(toast);
      }
    }, 300);
  }, 3000);
}

function refreshAllPlugins() {
  document.querySelectorAll('[x-data*="refresh()"]').forEach(el => {
    if (el._x_dataStack && el._x_dataStack[0] && el._x_dataStack[0].refresh) {
      el._x_dataStack[0].refresh();
    }
  });
}
</script>
{{ end }}
