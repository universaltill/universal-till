<span class="session-chip">
  {{ if .isManager }}
  <a class="session-admin-link nav-toggle" href="/users">
    <span class="nav-toggle-ico" aria-hidden="true">{{ icon "users" }}</span>
    <span class="nav-toggle-label">{{ T "users.title" }}</span>
  </a>
  <a class="session-admin-link nav-toggle" href="/promotions">
    <span class="nav-toggle-ico" aria-hidden="true">{{ icon "tag" }}</span>
    <span class="nav-toggle-label">{{ T "promotions.title" }}</span>
  </a>
  <a class="session-admin-link nav-toggle" href="/translations">
    <span class="nav-toggle-ico" aria-hidden="true">{{ icon "globe" }}</span>
    <span class="nav-toggle-label">{{ T "translations.title" }}</span>
  </a>
  {{ end }}
  <!-- Operator name has no fixed length. In the rail (>480px) the label is
       visually-hidden anyway (.nav-toggle-label, app.css), so its length
       costs no layout there.
       2026-08-31, independent review: this comment used to claim
       ".session-user's own CSS clamps it to one line with an ellipsis
       (app.css)". It does not -- `.session-user { font-weight: 600 }` is
       the whole rule. At <=480px `.nav-toggle-label` sets `white-space:
       nowrap` with no `overflow`/`text-overflow`, so a long operator name
       does not ellipsize, it overflows -- in exactly the phone-width top
       bar whose two-row wrapping budget ut-docs#413 fought to fit. Left as
       described-accurately rather than silently "fixed" here because
       clamping it is a real (if small) visual change that wants its own
       card and its own phone-width test; see the review doc. -->
  <a class="session-user nav-toggle" href="/pin" title="{{ T "auth.change_pin" }}">
    <span class="nav-toggle-ico" aria-hidden="true">{{ icon "user" }}</span>
    <span class="nav-toggle-label">{{ .name }}</span>
  </a>
  <form method="post" action="/api/auth/logout" class="session-lock">
    <button type="submit" class="nav-toggle btn-lock">
      <span class="nav-toggle-ico" aria-hidden="true">{{ icon "lock" }}</span>
      <span class="nav-toggle-label">{{ T "auth.lock" }}</span>
    </button>
  </form>
</span>
