<span class="session-chip">
  {{ if .isManager }}<a class="session-admin-link" href="/users">{{ T "users.title" }}</a> <a class="session-admin-link" href="/promotions">{{ T "promotions.title" }}</a> <a class="session-admin-link" href="/translations">{{ T "translations.title" }}</a>{{ end }}
  <a class="session-user nav-toggle" href="/pin" title="{{ T "auth.change_pin" }}">👤 {{ .name }}</a>
  <form method="post" action="/api/auth/logout" class="session-lock">
    <button type="submit" class="btn secondary btn-lock">{{ T "auth.lock" }}</button>
  </form>
</span>
