<div class="payment-picker">
  <h3>{{ T "selforder.checkout.title" }}</h3>
  <p class="payment-picker-total">{{ T "basket.total" }}: {{ money .Total }}</p>
  {{ if .ErrKey }}<div class="toast toast-error">{{ T .ErrKey }}</div>{{ end }}
  {{ if .Methods }}
  <!-- hx-include carries the shop page's hidden offline flag (driven by
       navigator.onLine) into the checkout POST, same signal shape as the
       cashier tender's #offline-flag (ut-docs#675 review, B1): a till that
       knows it's offline must not burn the fiscal.sign.ask budget per sale. -->
  <form hx-post="/api/self-order/checkout" hx-target="#selforder-modal" hx-swap="innerHTML" hx-include="#selforder-offline-flag">
    <div class="payment-picker-methods">
      {{ range .Methods }}
      <button type="submit" name="method" value="{{ .ID }}" class="btn primary payment-picker-method">
        {{ .Name }}
      </button>
      {{ end }}
    </div>
  </form>
  {{ else }}
  <p class="muted">{{ T "selforder.checkout.no_methods" }}</p>
  {{ end }}
  <button type="button" class="btn secondary"
          onclick="var m = document.getElementById('selforder-modal'); m.close(); m.innerHTML='';">
    {{ T "modifiers.cancel" }}
  </button>
  <!-- A native <dialog> in its open state makes everything OUTSIDE it
       inert, so the page-level exit control (self_order_shop.html) is
       unreachable during checkout — this is its own copy (ut-docs#208
       review finding). -->
  <a class="selforder-exit" href="/login?next=kiosk" aria-label="{{ T "selforder.exit" }}"><span aria-hidden="true">🔒</span></a>
</div>
