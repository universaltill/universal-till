{{ define "nav" -}}
<nav class="nav">
  <!-- 2026-08-30 (product owner, comparing against a competitor POS): the
       app name used to duplicate as its own large <h1> row on the sale
       screen alone (.kiosk-header, index.html) -- redundant with the nav
       bar already carrying the logo on every page, and it cost a whole
       row of vertical height nowhere else in the app needed. Moved here,
       next to the logo, once, shared by every page -- .kiosk-header no
       longer renders its own heading at all (see index.html). -->
  <div class="logo">
    <img src="/public/assets/logo/unitill-logo-light.svg" alt="" />
    <span class="app-name">{{ T "app.name" }}</span>
  </div>
  <!-- 2026-08-30 (nav rail, ut-docs#1332): the product owner asked
       repeatedly, comparing directly against a competitor POS (SumUp),
       for this bar to move off the top of the screen -- every page paid
       for a full-width horizontal row (plus, on the sale screen, a SECOND
       row for New Sale/Inventory/Deposit refund) before any actual content
       started. Restructured into a left icon rail (app.css's `.nav`):
       same items, stacked in a column instead of a row. Icon-only by
       default (product owner, live on the tablet, same session) -- each
       label stays in the DOM, just visually-hidden (app.css), so it's
       still in the accessible name for assistive tech even with no
       visible text; a touchscreen till has no hover to reveal a title
       tooltip, so this only works because the label is a REAL (if hidden)
       part of the button, not a tooltip-only affordance. Reverts to the
       previous horizontal top bar (labels visible again -- room for them
       there) at phone width (<=480px, this file's existing breakpoint) --
       a permanent side rail eats too much of a 360px screen, and that
       width class already had its own hard-fought wrapping behavior
       (ut-docs#413) not worth re-litigating here. -->
  <div class="nav-primary">
    <a href="/" class="nav-toggle" data-testid="nav-till">
      <span class="nav-toggle-ico" aria-hidden="true">🧾</span>
      <span class="nav-toggle-label">{{ T "nav.till" }}</span>
    </a>
    <a href="/menu" class="nav-toggle" data-testid="nav-menu">
      <span class="nav-toggle-ico ico-boost" aria-hidden="true">☰</span>
      <span class="nav-toggle-label">{{ T "nav.menu" }}</span>
    </a>
    <!-- Moved from index.html's own header row (was a second full-width
         row above the product grid) -- Inventory is a plain link with no
         page-specific DOM dependency, so it's safe to render on every
         page, same as Till/Menu above.
         .nav-rail-only (app.css): hidden at <=480px. ut-docs#413 already
         fought hard to fit exactly Till/Menu/help/chips in the phone-width
         top bar's two-row wrap without this class's sale-screen bleed
         overflowing the fixed-height sale screen (confirmed live: adding
         these three unconditionally clipped BASKET under a third nav row
         at 360px) -- Inventory already has its own tile on the ☰ Menu
         launcher page, so hiding it here at phone width costs nothing.
         index.html still renders its OWN small phone-only fallback row for
         Inventory, shown only at <=480px -- see index.html's own comment. -->
    <a href="/inventory" class="nav-toggle nav-rail-only" data-testid="kiosk-inventory-link">
      <span class="nav-toggle-ico" aria-hidden="true">📦</span>
      <span class="nav-toggle-label">{{ T "kiosk.inventory" }}</span>
    </a>
  </div>
  <div class="nav-right">
    <!-- Contextual help: resolves to the manual topic documenting THIS page
         (route → topic comes from the topics' own front matter), falling back
         to the manual's index when nothing claims the route yet.
         2026-09-01 (ut-docs#1348, product owner, live on the tablet): used
         to be the bare `.help-hint` markup (a small, deliberately
         low-contrast outlined circle meant to sit quietly next to a page
         heading elsewhere in the app — see its base rule in app.css). Inside
         the rail that read as visibly smaller than, and left-aligned
         against, every other icon here, because it never got the
         `.nav-toggle`/`.nav-toggle-ico` button treatment the rest of the
         rail shares (fixed rounded-square box, background, centered
         content) — a `.nav .help-hint` override tried to patch just the
         box size, but `.nav-right`'s `align-items: stretch` only stretches
         (and thus centers) an item with no fixed size of its own, so a
         fixed-size override left it pinned to flex-start instead. Now
         `.nav-toggle` like every sibling here; `.help-hint` itself is
         untouched and keeps its own small-circle look everywhere else it's
         used (`helpLink`, next to a page heading). -->
    <a class="nav-toggle" href="{{ helpHref }}" title="{{ T "help.open" }}"
       aria-label="{{ T "help.open" }}" data-testid="help-hint">
      <span class="nav-toggle-ico" aria-hidden="true">?</span>
      <span class="nav-toggle-label">{{ T "help.open" }}</span>
    </a>
    <!-- 🐞 bug-report toggle (ut-docs#346). Same trick as the sync/session
         chips: nav.html has no per-request data, so an htmx fragment loads
         after render and the /ui/bugreport-chip route does the manager
         gating — empty body when the operator can't report issues. -->
    <span id="bugreport-chip" hx-get="/ui/bugreport-chip" hx-trigger="load"></span>
    <span id="sync-chip" hx-get="/ui/sync-chip" hx-trigger="load, every 30s"></span>
    <!-- Fiscalisation status (ut-docs#685): empty body when this shop has
         no fiscalisation configured — same "nothing shown" convention as
         the other chips' zero-state. -->
    <span id="fiscal-chip" hx-get="/ui/fiscal-chip" hx-trigger="load, every 30s"></span>
    <span id="session-chip" hx-get="/ui/session-chip" hx-trigger="load"></span>
  </div>
</nav>
{{- end }}
