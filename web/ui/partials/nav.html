{{ define "nav" -}}
<nav class="nav">
  <div class="logo"><span class="brand-mark" role="img" aria-label="Universal Till"></span></div>
  <!-- One shared touch header on every page: the ☰ button opens the /menu
       launcher of big touch tiles — that page IS the navigation. -->
  <a href="/" class="nav-toggle" data-testid="nav-till">🧾 {{ T "nav.till" }}</a>
  <a href="/menu" class="nav-toggle" data-testid="nav-menu">☰ {{ T "nav.menu" }}</a>
  <div class="nav-right">
    <span id="sync-chip" hx-get="/ui/sync-chip" hx-trigger="load, every 30s"></span>
    <span id="session-chip" hx-get="/ui/session-chip" hx-trigger="load"></span>
  </div>
</nav>
{{- end }}
