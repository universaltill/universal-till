{{ define "nav" -}}
<nav class="nav">
  <div class="logo"><img src="/public/assets/logo/ut-logo-name.svg" alt="Universal Till Logo" /></div>
  <!-- Sale screen: one big touch button opens the full menu page. Other
       pages show the links inline. -->
  <a href="/menu" class="nav-toggle" data-testid="nav-menu">☰ {{ T "nav.menu" }}</a>
  <div class="nav-links">
    {{ range .menuItems }}<a href="{{ .Href }}"{{ if eq .Href "/plugins" }} data-testid="nav-plugins"{{ end }}>{{ T .Label }}</a>{{ end }}
    <a href="/help" data-testid="nav-help-support">{{ T "nav.help" }}</a>
    <span class="nav-lang">
      {{ range locales }}<a href="/?lang={{ . }}">{{ . }}</a>{{ end }}
    </span>
  </div>
  <div class="nav-right">
    <span id="sync-chip" hx-get="/ui/sync-chip" hx-trigger="load, every 30s"></span>
    <span id="session-chip" hx-get="/ui/session-chip" hx-trigger="load"></span>
  </div>
</nav>
{{- end }}
