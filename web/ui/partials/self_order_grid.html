<div id="selforder-grid" class="selforder-grid">
  {{ if .Items }}
    {{ range .Items }}
    {{ if .HasModifiers }}
    <button type="button" class="selforder-tile" data-cat="{{ .CategoryID }}"
            hx-get="/api/self-order/modifiers?item={{ .ItemID }}&code={{ .Code }}"
            hx-target="#selforder-modal" hx-swap="innerHTML"
            hx-on::after-request="document.getElementById('selforder-modal').showModal()">
      <img class="selforder-tile-img" src="{{ imgv .ImageURL }}" alt="" loading="lazy" onerror="this.style.display='none'">
      <span class="selforder-tile-name">{{ .Name }}</span>
      <span class="selforder-tile-price">{{ money .PriceMinor }}</span>
    </button>
    {{ else }}
    <button type="button" class="selforder-tile" data-cat="{{ .CategoryID }}"
            hx-post="/api/self-order/scan" hx-vals='{"code":"{{ .Code }}"}'
            hx-target="#selforder-cart" hx-swap="outerHTML">
      <img class="selforder-tile-img" src="{{ imgv .ImageURL }}" alt="" loading="lazy" onerror="this.style.display='none'">
      <span class="selforder-tile-name">{{ .Name }}</span>
      <span class="selforder-tile-price">{{ money .PriceMinor }}</span>
    </button>
    {{ end }}
    {{ end }}
  {{ else }}
    <p class="empty">{{ T "selforder.no_items" }}</p>
  {{ end }}
</div>
