{{ if .Buttons }}
<div id="plugin-buttons" class="plugin-buttons">
  <h3>{{ T "plugins.buttons.title" }}</h3>
  <div class="grid">
    {{ range .Buttons }}
    <div class="btn-tile">
      <button
        class="btn secondary"
        hx-post="/api/plugins/entries/{{ .PluginID }}/{{ .EntryKey }}/action"
        hx-trigger="click"
        hx-swap="none"
        title="{{ .PluginName }}">
        {{ if .IconPath }}<img src="/plugin-icons/{{ .PluginID }}/{{ .PluginVersion }}/{{ .IconPath }}" alt="" width="20" height="20" style="vertical-align:middle; margin-inline-end:.4rem" loading="lazy">{{ end }}
        {{/* ut-docs#2015: a button entry's label is a translator key, same
             as a page/export/report entry's — the owning plugin's own
             locales/ overlay resolves it here (ADR-0010; the entry-label
             contract itself is reference/plugin-manifest.md's entries
             table, `label` row). */}}
        {{ T .Label }}
      </button>
    </div>
    {{ end }}
  </div>
</div>
{{ else }}
<div id="plugin-buttons"></div>
{{ end }}
