<!-- web/ui/partials/buttons.html -->
{{ define "buttons" }}
<div class="products">
  <h2>{{ T "products.title" }}</h2>
  <div id="buttons-grid" class="grid">
    {{ range .Buttons }}
      {{ if .HasModifiers }}
      <button
        class="btn-tile"
        hx-get="/ui/pos/modifiers?item={{ .ItemID }}&code={{ .Code }}"
        hx-trigger="click"
        hx-target="#modifier-modal"
        hx-swap="innerHTML"
        hx-on::after-request="document.getElementById('modifier-modal').showModal()">
        {{ if .ImageURL }}<img class="thumb" src="{{ imgv .ImageURL }}" alt="" loading="lazy" />{{ end }}
        <span class="tile-name">{{ .Label }}</span>
        {{ if .Price }}<span class="tile-price">{{ money .Price }}</span>{{ end }}
      </button>
      {{ else }}
      <button
        class="btn-tile"
        hx-post="/api/pos/scan"
        hx-vals='{"code":"{{ .Code }}"}'
        hx-trigger="click"
        hx-target="#basket"
        hx-swap="outerHTML">
        {{ if .ImageURL }}<img class="thumb" src="{{ imgv .ImageURL }}" alt="" loading="lazy" />{{ end }}
        <span class="tile-name">{{ .Label }}</span>
        {{ if .Price }}<span class="tile-price">{{ money .Price }}</span>{{ end }}
      </button>
      {{ end }}
    {{ else }}
      <p class="empty">{{ T "products.empty" }}</p>
    {{ end }}
  </div>
  <!-- Action buttons contributed by installed plugins -->
  <div hx-get="/ui/plugin-buttons" hx-trigger="load" hx-swap="outerHTML"></div>
</div>
{{ end }}
