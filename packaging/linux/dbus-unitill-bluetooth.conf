<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!--
  D-Bus system-bus policy for the Universal Till service (ADR-0078,
  universaltill/ut-docs#76). Installed by the .deb as
  /etc/dbus-1/system.d/unitill-bluetooth.conf (see .goreleaser.yaml's nfpm
  contents:). dbus-daemon watches system.d/, so no reload is needed.

  WHY: unitill-pos.service runs as the dedicated system user `pos` (no login
  shell, no console session). BlueZ's own default policy
  (/etc/dbus-1/system.d/bluetooth.conf) only lets root or an at_console
  session talk to org.bluez, so without this file every call the in-POS
  Bluetooth pairing panel makes (internal/bluetooth) fails closed with
  AccessDenied — not a permission quirk, the default.

  WHAT, and why each line (smallest grant that works — Security-first):
    ObjectManager  — GetManagedObjects: enumerate the adapter and the
                     devices it knows about (the paired list, scan results).
    Properties     — Get/Set: read Paired/Trusted/Connected/Name, set
                     Adapter1.Powered=true and Device1.Trusted=true.
    Introspectable — part of ADR-0078's grant. internal/bluetooth does not
                     call it today; it lets `busctl introspect org.bluez …`
                     run AS the pos user when diagnosing a field problem,
                     which is otherwise the first thing that fails.
    Adapter1       — StartDiscovery / StopDiscovery (the bounded scan) and
                     RemoveDevice (Forget).
    Device1        — Pair / Connect.
    AgentManager1  — RegisterAgent / RequestDefaultAgent / UnregisterAgent:
                     Device1.Pair() will NOT complete for an untrusted device
                     without a registered pairing agent (ours is
                     NoInputNoOutput, "Just Works"). Found in ADR-0078's
                     review; the first draft omitted it, which would have made
                     every Pair() fail in production while looking correct.

  WHAT NOT: no send_type="method_call" wildcard, no Media*/Network*/
  GattCharacteristic1 (never called), no group-wide or root grant. A future
  card that needs another org.bluez interface extends THIS list; it does not
  get a separate mechanism.
-->
<busconfig>
  <policy user="pos">
    <allow send_destination="org.bluez" send_interface="org.freedesktop.DBus.ObjectManager"/>
    <allow send_destination="org.bluez" send_interface="org.freedesktop.DBus.Properties"/>
    <allow send_destination="org.bluez" send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="org.bluez" send_interface="org.bluez.Adapter1"/>
    <allow send_destination="org.bluez" send_interface="org.bluez.Device1"/>
    <allow send_destination="org.bluez" send_interface="org.bluez.AgentManager1"/>
  </policy>
</busconfig>
