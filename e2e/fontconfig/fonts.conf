<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- docs-shots' own fontconfig (ut-docs#4407), passed to the harness's
     Chromium as FONTCONFIG_FILE by playwright.docs.config.ts. The app ships
     no webfont, so this pins its system-font stack to Inter (fonts-inter)
     without touching the machine's /etc/fonts (and monospace to DejaVu Sans
     Mono, ut-docs#4425). The aliases come BEFORE the
     system include so they win over its later sans-serif preferences
     (60-latin, and Arial -> Liberation Sans via 30-metric-aliases, would
     otherwise pick the face). Everything else (fonts, cache, Arabic-script
     fallback to DejaVu Sans) is the system config. Inline on purpose: a
     relative <include> resolves against fontconfig's own dir, not this one. -->
<fontconfig>
  <alias><family>system-ui</family><prefer><family>Inter</family></prefer></alias>
  <alias><family>ui-sans-serif</family><prefer><family>Inter</family></prefer></alias>
  <alias><family>-apple-system</family><prefer><family>Inter</family></prefer></alias>
  <alias><family>BlinkMacSystemFont</family><prefer><family>Inter</family></prefer></alias>
  <alias><family>Segoe UI</family><prefer><family>Inter</family></prefer></alias>
  <alias><family>Roboto</family><prefer><family>Inter</family></prefer></alias>
  <alias><family>Helvetica Neue</family><prefer><family>Inter</family></prefer></alias>
  <alias><family>sans-serif</family><prefer><family>Inter</family></prefer></alias>
  <!-- ut-docs#4425: codes, chips and plugin ids use `ui-monospace, monospace`
       or plain `monospace`; pin both to DejaVu Sans Mono (fonts-dejavu-core). -->
  <alias><family>ui-monospace</family><prefer><family>DejaVu Sans Mono</family></prefer></alias>
  <alias><family>monospace</family><prefer><family>DejaVu Sans Mono</family></prefer></alias>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
</fontconfig>
