# Release pipeline (docs repo: architecture/packaging.md).
#
# Two ways to cut a release, both land the same cross-platform artifacts on the
# GitHub release (archives, .deb, Windows installer, macOS .dmg):
#   1. One-click: Actions → "Release" → Run workflow → pick patch/minor/major
#      (or type an explicit version). The `prepare` job computes + pushes the
#      tag, then the build jobs run.
#   2. Manual: `git tag vX.Y.Z && git push origin vX.Y.Z` (or scripts/release.sh).
# Either way, the commit being tagged must already be on `main` — `prepare`
# refuses otherwise (ut-docs#308).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump (ignored when 'version' is set)"
        type: choice
        options: [patch, minor, major]
        default: patch
      version:
        description: "Explicit version without the 'v' (e.g. 0.3.0). Overrides bump."
        default: ""

permissions:
  contents: write

jobs:
  # Resolve the version/tag for this release. On a tag push it just reads the
  # ref; on manual dispatch it computes the next version from the latest tag
  # (or uses the explicit input) and creates + pushes the tag.
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: v
        run: |
          set -euo pipefail

          # ut-docs#308: a release must be built from a commit that's
          # actually reachable from main — the only way that isn't true is
          # a manually pushed tag (`git tag && git push`, the "Manual" path
          # above) from a stray branch, or a workflow_dispatch run kicked
          # off from the wrong ref. Refuse it rather than let cadence counts
          # / release notes silently read a disjoint-history diff.
          #
          # Depends on the full-history checkout above (fetch-depth: 0) —
          # `git merge-base --is-ancestor` against a *shallow* clone can
          # report a real ancestor as "not found" simply because history
          # doesn't reach that far back, which looks identical to a genuine
          # broken lineage. Fail closed instead of trusting a shallow
          # result silently.
          require_ancestor() {
            local ref="$1" label="$2" hint="${3:-}"
            if [ "$(git rev-parse --is-shallow-repository)" != "false" ]; then
              echo "::error::checkout is shallow — cannot trust an ancestry check against it (this job's checkout step should always be fetch-depth: 0)"
              exit 1
            fi
            if ! git rev-parse -q --verify origin/main >/dev/null; then
              echo "::error::origin/main not found in this checkout — cannot verify ${label}"
              exit 1
            fi
            local rc=0
            git merge-base --is-ancestor "${ref}" origin/main || rc=$?
            case "$rc" in
              0) ;;
              1)
                echo "::error::${label} is not an ancestor of origin/main — refusing to release from a history line main doesn't contain (see ut-docs#308)"
                [ -n "$hint" ] && echo "::error::${hint}"
                exit 1 ;;
              *)
                echo "::error::git merge-base could not compare ${label} against origin/main (exit ${rc}) — failing closed rather than guessing"
                exit 1 ;;
            esac
          }

          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${GITHUB_REF_NAME}"
            VERSION="${TAG#v}"
            require_ancestor "refs/tags/${TAG}" "tag ${TAG}" \
              "the tag is already on the remote and will be picked up as 'latest' by the next auto-bump — delete it (git push origin :refs/tags/${TAG}) and retag from main once ready"
          else
            if [ -n "${{ inputs.version }}" ]; then
              VERSION="${{ inputs.version }}"
            else
              LATEST="$(git tag -l 'v*' | sort -V | tail -1)"; LATEST="${LATEST#v}"; LATEST="${LATEST:-0.0.0}"
              IFS=. read -r MA MI PA <<< "$LATEST"
              case "${{ inputs.bump }}" in
                major) MA=$((MA + 1)); MI=0; PA=0 ;;
                minor) MI=$((MI + 1)); PA=0 ;;
                patch) PA=$((PA + 1)) ;;
              esac
              VERSION="${MA}.${MI}.${PA}"
            fi
            TAG="v${VERSION}"
            if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
              echo "::error::tag ${TAG} already exists"; exit 1
            fi
            # An explicit "version" input bypasses the bump logic above and
            # goes straight to a human-typed string — validate it's plain
            # MAJOR.MINOR.PATCH before it reaches anything downstream that
            # assumes that shape (goreleaser's ldflags injection, the
            # android-app job's versionCode arithmetic — a non-numeric
            # component there silently computes a wrong, not failing,
            # version code via bash's "unset var = 0" arithmetic).
            if ! [[ "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::version '${VERSION}' must be plain MAJOR.MINOR.PATCH (no 'v' prefix, no suffix like -beta1)"
              exit 1
            fi
            require_ancestor "HEAD" "the checked-out commit"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -a "${TAG}" -m "Release ${TAG}"
            git push origin "${TAG}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "### Release ${TAG}" >> "$GITHUB_STEP_SUMMARY"

  # Linux desktop shells (GTK/WebKit app window): CGO against the native GTK
  # dev headers, so each arch builds on its own runner. ADR-0028: targets
  # webkit2gtk-4.1 (not upstream webview_go's hardcoded 4.0, which current
  # Raspberry Pi OS / Debian 13 trixie dropped entirely) — 4.1 is available
  # on ubuntu-22.04 too, so the runner choice itself doesn't need to change.
  linux-shells:
    needs: prepare
    strategy:
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: amd64
          - runner: ubuntu-22.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install GTK/WebKit dev headers
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Build unitill-desktop (${{ matrix.arch }})
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          CGO_ENABLED=1 go build -trimpath -tags desktop \
            -ldflags "-s -w -X github.com/universaltill/universal-till/internal/buildinfo.Version=${VERSION}" \
            -o unitill-desktop ./cmd/unitill-desktop
          file unitill-desktop
      - uses: actions/upload-artifact@v4
        with:
          name: linux-shell-${{ matrix.arch }}
          path: unitill-desktop
          if-no-files-found: error

  # The pre-release test run is its own job, not a goreleaser step
  # (ut-docs#2610): goreleaser now holds the Windows signing identity, and no
  # test or dependency code should ever execute in a job that can mint its
  # token.
  release-tests:
    needs: [prepare]
    runs-on: ubuntu-latest
    # ut-docs#2274: a "Run tests before releasing" run hung with zero step
    # movement for hours (historical baseline for that step alone is ~6.5m,
    # ut-docs#643/#753/#776) and occupied the runner silently instead of
    # failing loudly. 40m gives generous headroom over that baseline, while
    # still bounding a genuine hang to a fraction of GitHub's 360m default.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Run tests before releasing
        # internal/plugins needs a longer per-package timeout than the 600s
        # default — same margin issue as ci.yml's own split Test step
        # (ut-docs#643/#753/#776): a release build must not fail on the
        # same timeout-margin false alarm the main CI workflow was just
        # fixed for.
        run: go test $(go list ./... | grep -v '/internal/plugins$') && go test -timeout 20m ./internal/plugins

  # Code signing (ut-docs#2480, ut-docs#2610): the Windows binaries are signed
  # by .goreleaser.yaml's post-build hook (packaging/windows/sign-exe.sh)
  # BEFORE they are archived, so the portable zip and checksums.txt carry the
  # signed files. Re-zipping in a later job would race macos-app's
  # read-modify-write of checksums.txt. Hence this job runs in the
  # `release-signing` environment with job-scoped OIDC, and every action it
  # uses is SHA-pinned.
  goreleaser:
    needs: [prepare, linux-shells, release-tests]
    runs-on: ubuntu-latest
    environment: release-signing
    permissions:
      contents: write
      id-token: write # OIDC for azure/login; job-scoped, so this job's actions are SHA-pinned
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      # The Linux archives/.deb carry the prebuilt desktop shells.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: linux-shell-amd64
          path: dist-shells/linux-amd64
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: linux-shell-arm64
          path: dist-shells/linux-arm64
      # The Windows desktop shell (webview_go → Edge WebView2) is a CGO build
      # cross-compiled with mingw-w64.
      - name: Install mingw-w64 (Windows desktop shell)
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64
          # mingw ships the Windows headers lowercase; WebView2.h includes
          # <EventToken.h>, which never resolves on Linux's case-sensitive
          # filesystem (works on macOS only because HFS+/APFS ignore case).
          INC=/usr/x86_64-w64-mingw32/include
          test -f "$INC/eventtoken.h" || { echo "::error::mingw eventtoken.h missing"; exit 1; }
          sudo ln -sf "$INC/eventtoken.h" "$INC/EventToken.h"
      - name: Azure login (OIDC, signing identity)
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ vars.AZURE_SIGNER_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - name: Prepare Windows code signing
        run: packaging/windows/setup-signing.sh
      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        with:
          # Exact version, not "~> v2": this job can mint the signing token,
          # so no unreviewed tool release runs in it (ut-docs#2610). Bump
          # deliberately.
          version: "v2.18.2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UT_WINDOWS_SIGN: "1" # .goreleaser.yaml's windows post-build hooks
      # Fail closed: the draft release is only published (publish-release) if
      # this job succeeds, so an unsigned .exe in the portable zip blocks it.
      - name: Every .exe in the portable Windows zip is signed
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          zip="dist/unitill-pos_${VERSION}_windows_amd64.zip"
          test -f "$zip"
          x="$(mktemp -d)"
          unzip -q "$zip" -d "$x"
          mapfile -t exes < <(find "$x" -iname '*.exe')
          test "${#exes[@]}" -ge 2 # unitill-pos.exe + unitill-desktop.exe
          for f in "${exes[@]}"; do packaging/windows/sign-exe.sh --verify-only "$f"; done
      # Limits the on-disk copy only; `az` itself stays logged in until
      # azure/login's post step at job end.
      - name: Drop the signing token
        if: always()
        run: rm -f "$RUNNER_TEMP/win-signing/token"
      # No website notification needed: universaltill.com/download reads the
      # public Releases API (/releases/latest) at page load, so it picks up
      # this release automatically. The site's staged mirror is only a
      # fallback for when the API is unreachable.

  # Windows installer (NSIS): a guided Setup.exe wizard is friendlier than
  # unzip-and-run for shop owners. Its own job so a goreleaser JOB failure
  # doesn't skip it (v0.2.9/v0.2.10: a GitHub API outage made goreleaser 503 →
  # retry → double-upload → 422 → job failed AFTER the release + archives were
  # already published, and every downstream job was skipped). It only needs
  # the release and the windows zip to exist, so it downloads the archive from
  # the release rather than sharing goreleaser's workspace.
  #
  # Code signing (ut-docs#2480, ut-docs#2610): signed as TASK RUNNER
  # TECHNOLOGY LTD with Azure Artifact Signing, via jsign on Linux (no Windows
  # runner). CI signs in with GitHub OIDC as `unitill-release-signer` — no
  # secret; that identity can only sign with this one certificate profile, and
  # only from a job in the `release-signing` environment (main + v* tags).
  # Identity: ut-infra unitill-infra/release-signing/. The .exe files it
  # installs arrive already signed in the portable zip (goreleaser job); this
  # job verifies them, signs uninstall.exe (installer.nsi `!uninstfinalize`)
  # and the Setup.exe itself.
  windows-installer:
    needs: [prepare, goreleaser]
    if: ${{ !cancelled() && needs.prepare.result == 'success' }}
    runs-on: ubuntu-latest
    environment: release-signing
    permissions:
      contents: write
      id-token: write # OIDC for azure/login; job-scoped, so this job's actions are SHA-pinned
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - name: Wait for the GitHub release to exist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            gh release view "$TAG" --json tagName >/dev/null 2>&1 && exit 0
            echo "release $TAG not visible yet (attempt $i/30)"; sleep 20
          done
          echo "::error::release $TAG does not exist — goreleaser failed before creating it; re-run goreleaser first"
          exit 1
      - name: Azure login (OIDC, signing identity)
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ vars.AZURE_SIGNER_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - name: Prepare Windows code signing
        run: packaging/windows/setup-signing.sh
      - name: Build, sign & attach Windows installer (NSIS)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          sudo apt-get install -y nsis
          SIGN="$PWD/packaging/windows/sign-exe.sh"

          gh release download "${TAG}" --pattern "unitill-pos_${VERSION}_windows_amd64.zip" --dir dist
          STAGE="$(mktemp -d)"
          unzip -q "dist/unitill-pos_${VERSION}_windows_amd64.zip" -d "$STAGE"
          # The zip's binaries were signed by the goreleaser job; refuse to
          # package anything that isn't.
          mapfile -t INNER < <(find "$STAGE" -iname '*.exe')
          test "${#INNER[@]}" -gt 0
          for f in "${INNER[@]}"; do "$SIGN" --verify-only "$f"; done

          # UNINST_SIGN_CMD: makensis signs + verifies uninstall.exe before
          # embedding it, and aborts on failure.
          makensis -DVERSION="${VERSION}" -DSRCDIR="$STAGE" -DUNINST_SIGN_CMD="$SIGN" packaging/windows/installer.nsi
          # NSIS writes OutFile relative to the script dir, so locate it rather
          # than assume the repo root.
          EXE="$(find "$PWD" -name "unitill-pos-setup-${VERSION}.exe" -print -quit)"
          echo "built installer: $EXE"
          test -n "$EXE" && test -f "$EXE"
          "$SIGN" "$EXE"
          gh release upload "${TAG}" "$EXE" --clobber
      # Limits the on-disk copy only; `az` itself stays logged in until
      # azure/login's post step at job end.
      - name: Drop the signing token
        if: always()
        run: rm -f "$RUNNER_TEMP/win-signing/token"

  # A real macOS .app (embedded WebView, no Terminal) packaged as a .dmg. Needs
  # a macOS runner for CGO/WKWebView + codesign/iconutil, so it's a separate
  # job; goreleaser already published the core release, so a failure here never
  # blocks it. It Developer-ID signs + notarizes when the signing secrets are
  # configured, otherwise ad-hoc signs (Apple Silicon requires a signature to
  # run; ad-hoc downloads need right-click → Open). See docs/arch/desktop-app.md.
  macos-app:
    # Runs after goreleaser but does NOT require it to have SUCCEEDED — only
    # the release must exist (the wait step checks). A goreleaser job failure
    # after publishing (e.g. 422 double-uploads during a GitHub API outage)
    # must not cost the .dmg, as it did for v0.2.9/v0.2.10.
    needs: [prepare, goreleaser]
    if: ${{ !cancelled() && needs.prepare.result == 'success' }}
    runs-on: macos-14 # Apple Silicon
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # Gate before the (slow) build: the .dmg needs a release to attach to.
      - name: Wait for the GitHub release to exist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            gh release view "$TAG" --json tagName >/dev/null 2>&1 && exit 0
            echo "release $TAG not visible yet (attempt $i/30)"; sleep 20
          done
          echo "::error::release $TAG does not exist — goreleaser failed before creating it; re-run goreleaser first"
          exit 1
      # Import the Developer ID cert into a throwaway keychain when configured.
      # MACOS_CERT_P12 = base64 of the exported .p12; MACOS_CERT_PASSWORD its
      # export password. No-ops (→ ad-hoc build) when the secret is absent.
      # NB: the `secrets` context isn't allowed in `if:`, so the guard lives in
      # the script, not a step condition.
      - name: Import signing certificate
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${MACOS_CERT_P12:-}" ]; then
            echo "No signing certificate configured — ad-hoc build."
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KP="$(openssl rand -base64 24)"
          security create-keychain -p "$KP" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KP" "$KEYCHAIN"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$MACOS_CERT_PASSWORD" \
            -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/cert.p12"
          # Apple's Developer ID G2 intermediate, so the identity chains to a
          # trusted root even on a runner image that lacks it (ut-docs#2870).
          # Public certificate, pinned by SHA-256 — a changed download fails.
          curl -fsSL https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer -o "$RUNNER_TEMP/g2.cer"
          echo "f16cd3c54c7f83cea4bf1a3e6a0819c8aaa8e4a1528fd144715f350643d2df3a  $RUNNER_TEMP/g2.cer" | shasum -a 256 -c -
          # Any failure here is caught by the find-identity check below.
          security import "$RUNNER_TEMP/g2.cer" -k "$KEYCHAIN" || echo "::warning::G2 intermediate import failed"
          rm -f "$RUNNER_TEMP/g2.cer"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KP" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          # Fail here, not at codesign, if the identity doesn't chain/validate.
          # Must run after list-keychains: trust evaluation only finds the
          # G2 intermediate in a keychain on the search list.
          security find-identity -v -p codesigning "$KEYCHAIN" | grep -q "Developer ID Application" \
            || { echo "::error::no valid Developer ID Application identity after import"; exit 1; }
      - name: Build .app and .dmg
        env:
          # Empty when the secrets aren't set → build scripts ad-hoc sign / skip notarize.
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          # App Store Connect API key, role Developer (ut-docs#2870) — preferred
          # by packaging/macos/notary-args.sh; the Apple ID trio is a fallback.
          MACOS_NOTARY_KEY_P8: ${{ secrets.MACOS_NOTARY_KEY_P8 }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
          MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          MACOS_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
          MACOS_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          packaging/macos/build-app.sh "$VERSION" dist/macos
          packaging/macos/make-dmg.sh "$VERSION" dist/macos
      - name: Attach the .dmg to the release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: gh release upload "${TAG}" "dist/macos/unitill-pos-${VERSION}-macOS-arm64.dmg" --clobber
      # goreleaser's checksums.txt only ever covers goreleaser's own
      # artifacts, so the .dmg built above is never in it. The till's in-app
      # updater (internal/selfupdate/macapp_darwin.go) verifies the .dmg's
      # SHA-256 against checksums.txt before mounting it and fails CLOSED if
      # the entry is missing — so without this step every in-app mac update
      # would be refused. Wait for goreleaser's checksums.txt to actually be
      # on the release (same race as the .dmg itself: this job only needs
      # the RELEASE to exist, not that every goreleaser asset finished
      # uploading), then fold the dmg's line in and re-upload.
      - name: Wait for checksums.txt and append the .dmg's SHA-256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          rm -f "$RUNNER_TEMP/checksums.txt"
          ok=""
          for i in $(seq 1 30); do
            if gh release download "${TAG}" --pattern checksums.txt --dir "$RUNNER_TEMP" --clobber 2>/dev/null; then
              ok=1
              break
            fi
            echo "checksums.txt not published yet (attempt $i/30)"
            sleep 20
          done
          if [ -z "$ok" ]; then
            echo "::error::checksums.txt never appeared on release ${TAG} — goreleaser may have failed or not finished uploading"
            exit 1
          fi
          packaging/macos/update-checksums.sh \
            "$RUNNER_TEMP/checksums.txt" \
            "dist/macos/unitill-pos-${VERSION}-macOS-arm64.dmg"
          gh release upload "${TAG}" "$RUNNER_TEMP/checksums.txt" --clobber

  # Android app (ADR-0023; android/README.md): the same embedded Go server
  # (internal/app.Run via ./mobile, gomobile-bound) as every other platform,
  # wrapped in a real Kotlin app (android/) with a foreground TillService +
  # WebView, verified working on an emulator 2026-07-25/26. Self-signed APK,
  # sideload distribution — no Google Play involvement, matching this app's
  # "no Google contact" posture everywhere else. Own job like macos-app: only
  # needs the release to exist, never blocks or is blocked by goreleaser.
  android-app:
    needs: [prepare, goreleaser]
    if: ${{ !cancelled() && needs.prepare.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # Installs cmdline-tools and sets ANDROID_HOME/ANDROID_SDK_ROOT.
      # `packages` must be overridden: the action's own default is
      # "tools platform-tools", and Google has removed the legacy `tools`
      # package from the SDK repository, so the action's built-in
      # `sdkmanager tools platform-tools` call now fails outright before
      # any step of ours runs (ut-docs#2257). We only ever needed
      # platform-tools here anyway — the NDK/platform/build-tools versions
      # this app actually depends on are installed explicitly by the next
      # step. https://github.com/android-actions/setup-android/blob/v3/action.yml
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"
      - name: Install NDK + platform + build-tools
        # Versions match what this app was built/verified against locally
        # (ut-docs/adr/0023-android-ios-till-strategy.md) — gomobile bind
        # needs a concrete NDK, not "whatever's newest."
        run: |
          set -euo pipefail
          sdkmanager --install "ndk;28.2.13676358" "platforms;android-36" "build-tools;36.1.0"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/28.2.13676358" >> "$GITHUB_ENV"
      - name: Install gomobile/gobind
        run: |
          set -euo pipefail
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Wait for the GitHub release to exist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            gh release view "$TAG" --json tagName >/dev/null 2>&1 && exit 0
            echo "release $TAG not visible yet (attempt $i/30)"; sleep 20
          done
          echo "::error::release $TAG does not exist — goreleaser failed before creating it; re-run goreleaser first"
          exit 1
      # Decode the signing keystore into the runner's temp dir (never the
      # workspace — nothing here should end up in a build artifact or
      # cache). No-op build-wise if these secrets are ever unset: the
      # Gradle signing config (android/app/build.gradle.kts) leaves the
      # release build type unsigned rather than silently falling back to
      # anything, so an unsigned APK failing to upload/verify below would
      # be the loud, correct failure mode, not a silent bad release.
      - name: Decode signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set — cannot produce a signed release APK"
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/unitill-release.keystore"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/unitill-release.keystore" >> "$GITHUB_ENV"
      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          # versionCode must strictly increase across releases for Android's
          # package manager to treat a new APK as an upgrade over an older
          # one (sideloading included, not just Play) — derived
          # deterministically from the semver tag rather than an
          # incrementing counter, so it never depends on build history.
          # Wide per-component headroom (patch/minor up to 999) rather than
          # 100/10: this project's own tag history was already 20+ patch
          # releases deep on a single minor line by the time this was
          # written (v0.2.20…v0.2.39) — a narrower formula would have
          # collided with the next minor bump the first time patch hit 100
          # (independent review caught this in the first draft: 0.2.100 and
          # 0.3.0 both hashed to the same code under MA*10000+MI*100+PA).
          IFS=. read -r MA MI PA <<< "$VERSION"
          VERSION_CODE=$((MA * 1000000 + MI * 1000 + PA))
          cd android
          ./gradlew assembleRelease -PversionName="$VERSION" -PversionCode="$VERSION_CODE"
      - name: Verify the APK is actually signed with our key
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          BUILD_TOOLS="${ANDROID_HOME}/build-tools/36.1.0"
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          "${BUILD_TOOLS}/apksigner" verify "$APK"
          FINGERPRINT="$("${BUILD_TOOLS}/apksigner" verify --print-certs "$APK" | grep 'SHA-256 digest' | awk '{print $NF}')"
          echo "signed with SHA-256: ${FINGERPRINT}"
          mv "$APK" "unitill-pos_${VERSION}_android.apk"
      - name: Attach the APK to the release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: gh release upload "${TAG}" "unitill-pos_${VERSION}_android.apk" --clobber
      - name: Also attach a fixed-name copy for the website's stable download link
        # ut-docs (download-page-apk-dead-end, 2026-08-30): the versioned
        # filename above means the website's Android button has no static
        # URL it can point at directly -- it depends on a client-side fetch
        # to the GitHub Releases API (unauthenticated, 60 req/hr per IP) to
        # discover this release's real asset URL, and silently falls back to
        # a bare releases-page link (not a direct download) whenever that
        # fetch fails or is rate-limited. A SECOND copy under a fixed name
        # (no version) lets the site link straight to
        # .../releases/latest/download/unitill-pos-android-latest.apk --
        # GitHub's own stable redirect to whatever the latest release's
        # matching-named asset is, needing no JavaScript and no API call at
        # all. The versioned asset above is kept too, for parity with every
        # other platform's naming and for anyone linking a specific version.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          cp "unitill-pos_${VERSION}_android.apk" unitill-pos-android-latest.apk
          gh release upload "${TAG}" unitill-pos-android-latest.apk --clobber

  # Regression gate for a real bug found 2026-07-28: the Windows and Linux
  # desktop-shell (WebView) builds had no buildinfo.Version ldflag at all
  # (linux-shells / .goreleaser.yaml's desktop-windows build both copied the
  # CGO/-tags=desktop build command but dropped the -X version injection the
  # plain server build next to them already had) — so unitill-desktop
  # silently shipped as "Universal Till vdev" on those two platforms, every
  # release, unnoticed because the status bar still renders *something*
  # rather than erroring. Traced from a real user report that looked
  # identical to this bug (turned out to be an unrelated stray local
  # process that session, not this) — this job makes sure that if it ever
  # IS the real bug, the release fails loudly instead of shipping quietly.
  verify-versions:
    # android-app added (ut-docs#1260) alongside the new Android check below —
    # without it this job could race android-app's own APK upload and either
    # download nothing (gh release download finding no matching asset yet) or
    # a stale one left over from a previous run's --clobber.
    needs: [prepare, goreleaser, macos-app, android-app]
    if: ${{ !cancelled() && needs.prepare.result == 'success' }}
    runs-on: macos-14 # hdiutil for the .dmg, plus tar/unzip for the rest — one runner covers every format
    # contents: write, not the read-only this job actually needs (ut-docs#1376
    # follow-up): since .goreleaser.yaml's release.draft became true, this
    # job's own "wait for the release to exist" step (gh release view "$TAG")
    # fails every single time under contents: read — reproduced twice in a
    # row on the real v0.8.4 release, 10-minute timeout both times, even
    # though the draft release demonstrably existed with all assets the whole
    # time (confirmed manually, and confirmed by every SIBLING job here —
    # windows-installer/macos-app/android-app, which inherit the workflow's
    # top-level contents: write and hit the identical step successfully).
    # GitHub's "get release by tag" endpoint apparently needs write-level
    # repo access to resolve a DRAFT release by tag; read-only can't see it
    # at all, not even eventually. Widened rather than left broken because a
    # job that can never complete is strictly worse than one with slightly
    # more access than its own work requires — this is read-only in
    # practice, it just needs the wider token to be allowed to read a draft.
    permissions:
      contents: write
    steps:
      # Every sibling job with this same "wait" step has this first — gh
      # infers which repo to talk to from the checked-out git remote; without
      # it, `gh release view` fails for an unrelated reason (no repo
      # context) that the `>/dev/null 2>&1` redirect below silently
      # swallows, looking exactly like "release not visible yet" for the
      # full 30-attempt/10-minute timeout. Found by this job failing that
      # way on its first real run — see docs/code-reviews/2026-07-28-verify-
      # release-versions.md's follow-up note.
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      # Only needed for the Android check below (`go version -m` reads a Go
      # binary's embedded build-info section — works against any target
      # GOOS/GOARCH from any host, no cross-compiler needed, just a `go`
      # binary on PATH). Every other check in this job is a prebuilt-artifact
      # inspection that doesn't touch Go tooling at all.
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Wait for the GitHub release to exist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            gh release view "$TAG" --json tagName >/dev/null 2>&1 && exit 0
            echo "release $TAG not visible yet (attempt $i/30)"; sleep 20
          done
          echo "::error::release $TAG does not exist"
          exit 1
      - name: Download the artifacts that embed buildinfo.Version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir dist-check && cd dist-check
          gh release download "$TAG" -R universaltill/universal-till \
            --pattern "unitill-pos_*_linux_amd64.tar.gz" \
            --pattern "unitill-pos_*_windows_amd64.zip" \
            --pattern "unitill-pos_*_darwin_arm64.tar.gz" \
            --pattern "unitill-pos-*-macOS-arm64.dmg" \
            --pattern "unitill-pos_*_android.apk" \
            --pattern "checksums.txt"
      # Regression gate for the macos-app job's "append the .dmg's SHA-256"
      # step (packaging/macos/update-checksums.sh): internal/selfupdate's mac
      # update path (macapp_darwin.go) fails closed if the dmg's
      # checksums.txt entry is missing or wrong, so a silent failure there
      # would only surface as every in-app mac update being refused, not as a
      # release-time error. Assert it here instead of waiting to find out.
      - name: The .dmg's checksums.txt entry must match the published artifact
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          cd dist-check
          dmg="unitill-pos-${VERSION}-macOS-arm64.dmg"
          want="$(awk -v f="$dmg" '$2 == f { print $1 }' checksums.txt)"
          if [ -z "$want" ]; then
            echo "::error::checksums.txt has no entry for $dmg — the macos-app job's checksum-append step may have failed silently"
            exit 1
          fi
          got="$(shasum -a 256 "$dmg" | awk '{print $1}')"
          if [ "$want" != "$got" ]; then
            echo "::error::checksums.txt entry for $dmg ($want) does not match the actual published artifact ($got)"
            exit 1
          fi
          echo "ok: checksums.txt entry for $dmg matches the published artifact"
      - name: Every binary must report the real version, never "dev"
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          fail=0
          check() {
            local file="$1" label="$2"
            if [ ! -f "$file" ]; then
              echo "::error::missing $label ($file)"
              fail=1
              return
            fi
            # Capture first, then grep the captured text — NOT `strings | grep
            # -q`: macOS's strings errors ("failed to flush output") when grep
            # -q closes the pipe early on its first match, and set -o pipefail
            # then reports that as the WHOLE pipeline failing even though grep
            # found what it was looking for — every check failed this way on
            # this job's first real run despite the versions being correct.
            local out
            out="$(strings -a "$file" 2>/dev/null || true)"
            if grep -qx "dev" <<< "$out"; then
              echo "::error::$label embeds buildinfo.Version=dev — the ldflags -X version injection is broken for this build"
              fail=1
              return
            fi
            if grep -qxE "v?${VERSION//./\\.}" <<< "$out"; then
              echo "ok: $label carries version $VERSION"
            else
              echo "::error::$label does not contain the expected version string $VERSION anywhere"
              fail=1
            fi
          }

          cd dist-check
          mkdir extracted

          tar xzf "unitill-pos_${VERSION}_linux_amd64.tar.gz" -C extracted
          check extracted/unitill-pos "linux unitill-pos"
          check extracted/unitill-desktop "linux unitill-desktop (the omission that caused the real bug)"
          rm -rf extracted && mkdir extracted

          unzip -qo "unitill-pos_${VERSION}_windows_amd64.zip" -d extracted
          check extracted/unitill-pos.exe "windows unitill-pos.exe"
          check extracted/unitill-desktop.exe "windows unitill-desktop.exe (the omission that caused the real bug)"
          rm -rf extracted && mkdir extracted

          tar xzf "unitill-pos_${VERSION}_darwin_arm64.tar.gz" -C extracted
          check extracted/unitill-pos "macOS portable unitill-pos"
          rm -rf extracted && mkdir extracted

          hdiutil attach -nobrowse -quiet -mountpoint extracted "unitill-pos-${VERSION}-macOS-arm64.dmg"
          check "extracted/Universal Till.app/Contents/MacOS/unitill-pos" "macOS .app unitill-pos"
          check "extracted/Universal Till.app/Contents/MacOS/unitill-desktop" "macOS .app unitill-desktop"
          hdiutil detach -quiet -force extracted || true

          exit $fail
      # ut-docs#1260: the Android APK never had a version check at all, so
      # gomobile bind shipping with no -ldflags (buildinfo.Version stuck on
      # its hardcoded "dev" default) went unnoticed on every release to date
      # — same bug class as the check() step above, just never gated for
      # this platform.
      #
      # Deliberately NOT the same strings-based `check()` helper used above:
      # verified empirically against the real, currently-shipping (buggy)
      # v0.6.15 APK that a plain `strings -a`+exact-whole-line-match (the
      # approach `check()` uses) does not reliably isolate a short embedded
      # string in this .so's densely-packed rodata — Go doesn't null-
      # terminate string literals, and gomobile's cgo/JNI shared library has
      # thousands of them packed back-to-back with no separators, unlike the
      # statically-linked desktop binaries `check()` was written for, where
      # it happens to work. `go version -m` instead reads the binary's
      # structured build-info section directly (one directive per line,
      # e.g. `build	-ldflags="-X pkg.Version=1.2.3"`) — confirmed working
      # cross-platform (this step's own host is linux/amd64 reading an
      # android/arm64 ELF .so) and confirmed to correctly flag the real,
      # currently-shipping unfixed artifact (no -ldflags recorded at all).
      - name: Android APK's embedded .so libraries must be built with buildinfo.Version stamped, never left as "dev"
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          fail=0
          checkAndroidLib() {
            local file="$1" label="$2"
            if [ ! -f "$file" ]; then
              echo "::error::missing $label ($file)"
              fail=1
              return
            fi
            local ldflags
            ldflags="$(go version -m "$file" 2>/dev/null | grep -- '-ldflags=' || true)"
            if [ -z "$ldflags" ]; then
              echo "::error::$label was built with no -ldflags at all — gomobile bind's ldflags injection is missing/broken for this build (the ut-docs#1260 regression)"
              fail=1
              return
            fi
            # Pull the stamped value out and compare it EXACTLY, rather than
            # asking whether "...Version=$VERSION" appears as a substring:
            # a substring test also accepts any LONGER version that merely
            # starts with the expected one (a lib stamped 0.6.160 satisfies
            # a check for 0.6.16 — verified against a synthetic build during
            # review), which is precisely the silent mis-stamp this gate
            # exists to catch. Exact comparison also keeps $VERSION out of
            # any regex, so a tag containing regex metacharacters can't
            # quietly change what is being matched. The value ends at the
            # closing quote `go version -m` prints around a multi-token
            # -ldflags, or at end-of-line if it was a single bare token.
            local got
            got="$(sed -n 's|.*-X github\.com/universaltill/universal-till/internal/buildinfo\.Version=\([^" ]*\).*|\1|p' <<< "$ldflags")"
            if [ "$got" != "$VERSION" ]; then
              echo "::error::$label stamps buildinfo.Version='$got', expected '$VERSION': $ldflags"
              fail=1
              return
            fi
            echo "ok: $label carries version $VERSION"
          }

          cd dist-check
          rm -rf extracted && mkdir extracted
          # ut-docs#1277: unzip prompts interactively (and fails non-zero
          # under set -euo pipefail, with no test ever running) when the APK
          # has two zip entries that collide once extracted onto this
          # runner's case-insensitive macOS filesystem — a v0.6.17 run hit
          # this for a 9-patch PNG resource. `-o` force-overwrites instead of
          # prompting; the directory was just freshly rm -rf'd/mkdir'd above,
          # so there's nothing here worth an interactive confirmation either
          # way.
          unzip -qo "unitill-pos_${VERSION}_android.apk" -d extracted
          checkAndroidLib extracted/lib/arm64-v8a/libgojni.so "android arm64-v8a libgojni.so (the omission that caused the real bug)"
          checkAndroidLib extracted/lib/armeabi-v7a/libgojni.so "android armeabi-v7a libgojni.so (the omission that caused the real bug)"

          exit $fail

  # Flips the release goreleaser created (draft: true, .goreleaser.yaml) to
  # published/"Latest" — the ONLY point in this whole workflow that does.
  # Needs every platform job AND verify-versions: goreleaser's own job only
  # covers the desktop archives it builds itself and returns long before
  # windows-installer/macos-app/android-app (each a `needs: [prepare,
  # goreleaser]` job that uploads its OWN asset to that same release,
  # independently and in parallel with each other) are anywhere near done.
  # Publishing there — the pre-existing behavior, `draft: false` — made the
  # release "Latest" (and releases/latest/download/* start resolving,
  # including the website's direct Android download link) the instant
  # goreleaser finished, with zero regard for whether the slower jobs had
  # even started yet, let alone succeeded. v0.8.3 (2026-08-31) shipped
  # exactly that gap: android-app hit a transient go.sum verification
  # error, goreleaser had already published, and the website's Android
  # button 404'd against a "Latest" release with no APK in it at all.
  # `if: ${{ !cancelled() && ... == 'success' }}` (not the default implicit
  # success() on `needs`) so a genuine failure anywhere leaves the release
  # sitting as a draft — visible to anyone with repo write access for
  # inspection/manual fix-up, invisible to the public and to
  # releases/latest — rather than silently skipping this job and leaving
  # no signal beyond "the release never went public."
  publish-release:
    needs:
      [
        prepare,
        goreleaser,
        windows-installer,
        macos-app,
        android-app,
        verify-versions,
      ]
    if: ${{ !cancelled() && needs.goreleaser.result == 'success' && needs.windows-installer.result == 'success' && needs.macos-app.result == 'success' && needs.android-app.result == 'success' && needs.verify-versions.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Publish the release (undraft) now that every platform succeeded
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: gh release edit "$TAG" --draft=false --latest

  # ut-docs#2274: on the workflow_dispatch path, `prepare` creates and
  # pushes the tag before any build job runs (so every downstream job can
  # `checkout` it) — meaning a build failure or a manually cancelled run
  # after that point permanently burns the version number: the tag is real,
  # but nothing was ever published under it, and the next auto-bump reads
  # this dead tag as "latest" and skips past a version nobody ever
  # shipped. Happened for real three times (v0.14.21, v0.15.0, v0.17.0),
  # each noticed and cleaned up by hand days later. Rather than restructure
  # every job's `ref: needs.prepare.outputs.tag` checkout (and goreleaser's
  # own tag-based versioning) to defer tagging until after the build — a
  # much larger, harder-to-verify change to a pipeline that ships real
  # builds — this job removes the tag (and any draft release goreleaser
  # already created) the moment it's clear the run did NOT reach
  # `publish-release`, so a dead run never leaves debris for a human (or a
  # future cycle) to notice and clean up later.
  #
  # Known tradeoff (independent review, ut-docs#2274): if every platform
  # build already succeeded and the run is cancelled during
  # `publish-release`'s own undraft step, this deletes a fully-built draft
  # release (all assets already uploaded, signed/notarized where
  # applicable) rather than leaving it for a retry to just flip live.
  # Accepted deliberately — that window is a single `gh release edit`
  # call wide, versus the three real incidents this job exists to prevent,
  # all of which failed well before any release was buildable at all.
  cleanup-orphaned-tag:
    needs:
      [
        prepare,
        linux-shells,
        goreleaser,
        windows-installer,
        macos-app,
        android-app,
        verify-versions,
        publish-release,
      ]
    # Only for a tag `prepare` itself created (the workflow_dispatch path —
    # see prepare's own `if [ event_name = push ]` branch above). A tag
    # pushed by a human (`git tag && git push`, or scripts/release.sh) is
    # explicit intent and must never be deleted out from under them by CI —
    # `push`-triggered runs skip this job entirely.
    # `always()` (not the default implicit success() on `needs`) so this
    # still runs when a build job failed OR the whole run was cancelled —
    # exactly the two cases that orphan a tag.
    if: ${{ always() && github.event_name == 'workflow_dispatch' && needs.prepare.result == 'success' && needs.publish-release.result != 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Delete the orphaned tag and any draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          echo "::warning::Release ${TAG} did not complete (publish-release: ${{ needs.publish-release.result }}) — deleting the tag so it doesn't burn this version number for the next attempt."
          # `--cleanup-tag` removes both the release object and the tag in
          # one call when a (draft) release exists; if goreleaser never got
          # far enough to create one, that call finds nothing and the
          # explicit tag delete below is what actually cleans up. Both are
          # best-effort: this is a cleanup step for an already-failed run,
          # so it must never itself fail the job over a tag that's already
          # gone (e.g. `--cleanup-tag` already removed it).
          gh release delete "${TAG}" --yes --cleanup-tag 2>/dev/null || true
          git push origin ":refs/tags/${TAG}" 2>/dev/null || true
