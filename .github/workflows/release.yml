# Release pipeline (docs repo: architecture/packaging.md): push a v* tag →
# cross-platform archives + .deb packages land on the GitHub release.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Run tests before releasing
        run: go test ./...
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Windows installer (NSIS): a guided Setup.exe wizard is friendlier than
      # unzip-and-run for shop owners. goreleaser already built + published the
      # archives above, so a hiccup here never blocks the core release.
      - name: Build & attach Windows installer (NSIS)
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          sudo apt-get update
          sudo apt-get install -y nsis
          STAGE="$(mktemp -d)"
          unzip -q "dist/unitill-pos_${VERSION}_windows_amd64.zip" -d "$STAGE"
          makensis -DVERSION="${VERSION}" -DSRCDIR="$STAGE" packaging/windows/installer.nsi
          # NSIS writes OutFile relative to the script dir, so locate it rather
          # than assume the repo root.
          EXE="$(find "$PWD" -name "unitill-pos-setup-${VERSION}.exe" -print -quit)"
          echo "built installer: $EXE"
          test -n "$EXE" && test -f "$EXE"
          gh release upload "${GITHUB_REF_NAME}" "$EXE" --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # No website notification needed: universaltill.com/download reads the
      # public Releases API (/releases/latest) at page load, so it picks up
      # this release automatically. The site's staged mirror is only a
      # fallback for when the API is unreachable.

  # A real macOS .app (embedded WebView, no Terminal) packaged as a .dmg. Needs
  # a macOS runner for CGO/WKWebView + codesign/iconutil, so it's a separate
  # job; goreleaser already published the core release, so a failure here never
  # blocks it. It Developer-ID signs + notarizes when the signing secrets are
  # configured, otherwise ad-hoc signs (Apple Silicon requires a signature to
  # run; ad-hoc downloads need right-click → Open). See docs/arch/desktop-app.md.
  macos-app:
    runs-on: macos-14 # Apple Silicon
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # Import the Developer ID cert into a throwaway keychain when configured.
      # MACOS_CERT_P12 = base64 of the exported .p12; MACOS_CERT_PASSWORD its
      # export password. No-ops (→ ad-hoc build) when the secret is absent.
      # NB: the `secrets` context isn't allowed in `if:`, so the guard lives in
      # the script, not a step condition.
      - name: Import signing certificate
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${MACOS_CERT_P12:-}" ]; then
            echo "No signing certificate configured — ad-hoc build."
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KP="$(openssl rand -base64 24)"
          security create-keychain -p "$KP" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KP" "$KEYCHAIN"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$MACOS_CERT_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KP" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"
      - name: Build .app and .dmg
        env:
          # Empty when the secrets aren't set → build scripts ad-hoc sign / skip notarize.
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          MACOS_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
          MACOS_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          packaging/macos/build-app.sh "$VERSION" dist/macos
          packaging/macos/make-dmg.sh "$VERSION" dist/macos
      - name: Attach the .dmg to the release
        run: gh release upload "${GITHUB_REF_NAME}" "dist/macos/unitill-pos-${GITHUB_REF_NAME#v}-macOS-arm64.dmg" --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
