name: ci
on:
  push: { branches: [ main ] }
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.25' }
      - name: Prep Go cache dirs
        run: |
          mkdir -p "${RUNNER_TEMP}/gobuildcache"
          mkdir -p "${RUNNER_TEMP}/gomodcache"
      - name: Restore Go cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/gobuildcache
            ${{ runner.temp }}/gomodcache
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-
      - name: Data-access policy guard
        run: bash scripts/ci/guard-data-access.sh
      - name: Data-access policy guard regression test
        run: bash scripts/ci/guard-data-access_test.sh
      - name: Kiosk-engine isolation guard
        run: bash scripts/ci/guard-kiosk-engine.sh
      - name: Kiosk-engine isolation guard regression test
        run: bash scripts/ci/guard-kiosk-engine_test.sh
      - name: Plugin-menu locked-read guard
        run: bash scripts/ci/guard-plugin-menu-read.sh
      - name: Plugin-menu locked-read guard regression test
        run: bash scripts/ci/guard-plugin-menu-read_test.sh
      - name: i18n coverage guard
        run: bash scripts/ci/guard-i18n.sh
      - name: i18n coverage guard regression test
        run: bash scripts/ci/guard-i18n_test.sh
      - name: Compliance-claims wording guard
        run: bash scripts/ci/guard-compliance-claims.sh
      - name: Compliance-claims wording guard regression test
        run: bash scripts/ci/guard-compliance-claims_test.sh
      - name: Manual screenshot freshness guard
        run: bash scripts/ci/guard-docs-shots.sh
      - name: Manual screenshot freshness guard regression test
        run: bash scripts/ci/guard-docs-shots_test.sh
      - name: Help-topic registry guard
        env:
          GOMODCACHE: ${{ runner.temp }}/gomodcache
          GOCACHE: ${{ runner.temp }}/gobuildcache
        run: bash scripts/ci/guard-help-topics.sh
      - name: Linux desktop webkit2gtk version guard
        run: bash scripts/ci/guard-webkit-version.sh
      - name: Kiosk launch flags guard
        run: bash scripts/ci/guard-kiosk-launch-flags.sh
      - name: Android status/notification address guard
        run: bash scripts/ci/guard-android-status-address.sh
      - name: Android string resource i18n guard
        run: bash scripts/ci/guard-android-i18n.sh
      - name: Emoji font guard
        run: bash scripts/ci/guard-emoji-font.sh
      - name: htmx-loaded guard
        run: bash scripts/ci/guard-htmx-loaded.sh
      - name: Autofill-suppression guard
        run: bash scripts/ci/guard-autofill-suppression.sh
      - name: Autofill-suppression guard regression test
        run: bash scripts/ci/guard-autofill-suppression_test.sh
      - name: Brand asset guard
        run: bash scripts/ci/check-brand-assets.sh
      - name: Makefile version-stamp guard
        env:
          GOMODCACHE: ${{ runner.temp }}/gomodcache
          GOCACHE: ${{ runner.temp }}/gobuildcache
        run: bash scripts/ci/guard-makefile-version.sh
      - name: Build
        env:
          GOMODCACHE: ${{ runner.temp }}/gomodcache
          GOCACHE: ${{ runner.temp }}/gobuildcache
        run: go build ./...
      - name: Test
        env:
          GOMODCACHE: ${{ runner.temp }}/gomodcache
          GOCACHE: ${{ runner.temp }}/gobuildcache
        run: go test ./...
      - name: Test (with OS locale set — ut-docs#662)
        # This runner's own container has no LANG, which is exactly what let
        # ut-docs#662's OS-locale-detection redirect (ut-docs#590) hide 4
        # failing tests from CI while they failed on every real developer
        # machine. Re-running with a locale set catches this class of "only
        # breaks off this specific runner" bug in the one package it can
        # actually occur in today (internal/pages owns every OS-locale
        # touchpoint in this repo — see setup_detect.go).
        #
        # Deliberately scoped to internal/pages/..., NOT the full `go test
        # ./...` a second time (ut-docs#674, found same-day): running the
        # entire suite twice in one job triggered a real CI failure in the
        # unrelated internal/plugins package — a 600s test-binary timeout
        # with goroutines blocked on internal/logging's mutex and
        # database/sql's connection opener. Investigating ut-docs#674 found
        # and fixed a genuine unbounded resource amplifier in
        # internal/plugins (EventBus.publish's "channel full" path could
        # perform ~16,700 unthrottled synchronous DB+stdout writes in one
        # test) — so "no actual bug in internal/plugins" turned out to be
        # wrong, there was one, now throttled. What independent review could
        # NOT do is reproduce the double-run hang itself (several run
        # patterns, pre- and post-fix) to confirm that bug was the cause of
        # THIS incident specifically, so treat it as fixed-along-the-way
        # hardening, not a confirmed root cause. main had 15 consecutive
        # green runs before this step was widened to the whole tree, and
        # failed on the very next merge after. If a locale-dependent bug
        # ever surfaces outside internal/pages, that's the point to widen
        # this scope again -- deliberately, with the same resource-
        # contention risk in mind, not by reflex.
        env:
          GOMODCACHE: ${{ runner.temp }}/gomodcache
          GOCACHE: ${{ runner.temp }}/gobuildcache
          LANG: en_GB.UTF-8
          LC_ALL: en_GB.UTF-8
        run: go test ./internal/pages/...

  e2e:
    runs-on: ubuntu-latest
    needs: build
    env:
      # ut-docs went private (2026-07-31), so the default GITHUB_TOKEN can no
      # longer read it — a PAT with read access to universaltill/ut-docs must
      # be provided as the DOCS_READ_TOKEN secret. Without it the docs-hub
      # specs skip (loudly), rather than failing the whole e2e job.
      DOCS_READ_TOKEN: ${{ secrets.DOCS_READ_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Checkout docs repo for docs-hub tests
        if: env.DOCS_READ_TOKEN != ''
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/docs
          # NOT ./docs — that is universal-till's OWN docs directory, which
          # made the specs' "is the docs repo present?" skip-check always
          # true (and previously let the checkout silently clobber it).
          path: ./.docs-hub
          token: ${{ env.DOCS_READ_TOKEN }}
      - name: Warn that docs-hub specs will skip
        if: env.DOCS_READ_TOKEN == ''
        run: echo "::warning::DOCS_READ_TOKEN secret not set — ut-docs is private, docs-hub e2e specs will be skipped"
      - uses: actions/setup-go@v5
        with: { go-version: '1.25' }
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Seed E2E database
        run: UT_DB_PATH=./data/e2e.db go run ./scripts/e2e_seed/main.go
      - name: Start app
        run: |
          # UT_AUTH=off is the documented CI escape hatch — the e2e suite
          # exercises the till flows, not the PIN login.
          UT_AUTH=off UT_STORE=sqlite UT_DB_PATH=./data/e2e.db UT_LISTEN_ADDR=:8080 UT_DEV_MODE=true go run . &
          for i in {1..30}; do
            if curl -sf http://127.0.0.1:8080/ >/dev/null; then
              echo "App is up"
              exit 0
            fi
            sleep 1
          done
          echo "App did not start in time" >&2
          exit 1
      - name: Install E2E dependencies
        working-directory: tests/e2e
        run: |
          npm install
          npx playwright install --with-deps chromium
      - name: Run Playwright tests
        working-directory: tests/e2e
        env:
          BASE_URL: http://127.0.0.1:8080
          DOCS_ROOT: ${{ github.workspace }}/.docs-hub
        run: npm run test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/e2e/playwright-report/

  contract:
    runs-on: ubuntu-latest
    needs: build
    env:
      PACT_BROKER_BASE_URL: ${{ secrets.PACT_BROKER_BASE_URL }}
      PACT_BROKER_TOKEN: ${{ secrets.PACT_BROKER_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.25' }
      - name: Download Pact FFI
        run: |
          curl -L -o /tmp/libpact_ffi.so.gz \
            https://github.com/pact-foundation/pact-reference/releases/download/libpact_ffi-v0.4.23/libpact_ffi-linux-x86_64.so.gz
          gunzip /tmp/libpact_ffi.so.gz
          sudo mkdir -p /usr/local/lib
          sudo mv /tmp/libpact_ffi.so /usr/local/lib/libpact_ffi.so
      - name: Run contract tests
        env:
          LIBRARY_PATH: /usr/local/lib
          LD_LIBRARY_PATH: /usr/local/lib
        run: go test -tags=contract ./tests/contract
      - name: Publish Pact contracts
        if: ${{ env.PACT_BROKER_BASE_URL != '' && env.PACT_BROKER_TOKEN != '' }}
        env:
          PACT_CONSUMER_VERSION: ${{ github.sha }}
          PACT_CONSUMER_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          docker run --rm \
            -e PACT_BROKER_BASE_URL \
            -e PACT_BROKER_TOKEN \
            -e PACT_CONSUMER_VERSION \
            -e PACT_CONSUMER_BRANCH \
            -v "$PWD/tests/contract/pacts:/pacts" \
            pactfoundation/pact-cli:latest \
            publish /pacts \
            --consumer-app-version "$PACT_CONSUMER_VERSION" \
            --branch "$PACT_CONSUMER_BRANCH"
      - name: Upload Pact artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pact-artifacts
          path: |
            tests/contract/pacts/
            tests/contract/logs/
