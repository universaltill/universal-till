name: ci
on:
  push: { branches: [ main ] }
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.27' }
      - uses: actions/setup-node@v4
        # Needed only by the docs-shots cross-check below (ut-docs#370),
        # which shells out to the real e2e/tests-docs/lib.js rather than
        # duplicating its algorithm. Set up here, early, so that check runs
        # with the other fast guards and actually fails fast — not after
        # `needs: build` gates it behind the whole e2e job.
        with:
          node-version: '26'
      - name: Prep Go cache dirs
        run: |
          mkdir -p "${RUNNER_TEMP}/gobuildcache"
          mkdir -p "${RUNNER_TEMP}/gomodcache"
      - name: Restore Go cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/gobuildcache
            ${{ runner.temp }}/gomodcache
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-
      - name: gofmt check
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt'd:"
            echo "$unformatted"
            echo "Run: gofmt -w <file>"
            exit 1
          fi
      - name: Lint (golangci-lint, unused)
        # ut-docs#1565: there was no lint gate at all before this — see
        # .golangci.yml's own header comment for scope (unused only for
        # now; cmd/unitill-desktop excluded here, tracked as a follow-up
        # that needs GTK/WebKit dev headers, same as the desktop-shell
        # job below, to lint it under the `desktop` tag it actually ships
        # with rather than produce false positives on per-platform stubs).
        # v6 only supports golangci-lint v1; the v2.x pinned below (and
        # .golangci.yml's own `version: "2"` config schema) needs v8+; v2.14.0 + v9 for Go 1.27 (ut-docs#3595)
        # (independent review, ut-docs#1565: v6 would have made this gate
        # unable to run at all, caught before it ever reached real CI).
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
      - name: macOS minimum vs Go toolchain guard
        run: bash scripts/ci/guard-macos-min-version.sh && bash scripts/ci/guard-macos-min-version_test.sh
      - name: Shellcheck version guard
        run: bash scripts/ci/guard-shellcheck-version.sh
      - name: Shellcheck version guard regression test
        run: bash scripts/ci/guard-shellcheck-version_test.sh
      - name: Shellcheck (scripts/ci/*.sh)
        # ut-docs#1943: no shell linting existed anywhere in this pipeline
        # despite the build job running 55+ shell scripts (the guard-*.sh
        # CI guards and their own _test.sh regression suites) — shellcheck
        # would have caught a real bug for free during ut-docs#1357's own
        # review (a `while read ... done < <(find ...)` that failed open
        # when `find` errored, since `set -e` doesn't cover a failure
        # inside process substitution) and did catch one for real rolling
        # this step out (check-brand-assets.sh's negated `! grep` checks
        # silently skipped errexit on the exact violation they existed to
        # catch, SC2251). ubuntu-latest ships shellcheck preinstalled, so
        # no separate install step — its version is pinned/guarded by the
        # "Shellcheck version guard" step above (ut-docs#1955), not here.
        run: shellcheck scripts/ci/*.sh
      - name: Release-notes guard regression test (ut-docs#3091)
        run: bash scripts/ci/guard-release-notes_test.sh
      - name: Release checksums completeness check regression test (ut-docs#2863)
        run: bash scripts/ci/check-release-checksums_test.sh
      - name: macOS notarization never holds a release — wiring test (ut-docs#2917)
        run: bash scripts/ci/release-macos-nonblocking_test.sh
      - name: iOS TestFlight workflow never reaches its signing key from a PR — wiring test (ut-docs#3069)
        run: bash scripts/ci/ios-testflight-workflow_test.sh
      - name: App stores stay private until launch — no public release path (ut-docs#3052)
        run: bash scripts/ci/guard-store-private.sh
      - name: Store-private guard regression test (ut-docs#3052)
        run: bash scripts/ci/guard-store-private_test.sh
      - name: iOS app shell locks page zoom — wiring test (ut-docs#3350)
        run: bash scripts/ci/ios-webview-zoom_test.sh
      - name: iOS bug-report screenshot bridge — wiring test (ut-docs#3355)
        run: bash scripts/ci/ios-screenshot-bridge_test.sh
      - name: e2e launchers never open a browser (ut-docs#2704)
        run: bash scripts/ci/guard-e2e-no-browser.sh
      - name: e2e no-browser guard regression test
        run: bash scripts/ci/guard-e2e-no-browser_test.sh
      - name: CI scripts never pipe into grep -q under pipefail (ut-docs#2946)
        run: bash scripts/ci/guard-pipefail-grep-q.sh
      - name: pipefail grep -q guard regression test
        run: bash scripts/ci/guard-pipefail-grep-q_test.sh
      - name: Data-access policy guard
        run: bash scripts/ci/guard-data-access.sh
      - name: Data-access policy guard regression test
        run: bash scripts/ci/guard-data-access_test.sh
      # ADR-0113 §1.6 (ut-docs#2795): every outbound HTTP client and raw dial
      # is built by internal/netaccess, so the demo till can deny them all.
      - name: Outbound-network (netaccess) guard
        run: bash scripts/ci/guard-netaccess.sh
      - name: Outbound-network (netaccess) guard regression test
        run: bash scripts/ci/guard-netaccess_test.sh
      - name: price_history sync-classification guard
        run: bash scripts/ci/guard-price-history-sync.sh
      - name: price_history sync-classification guard regression test
        run: bash scripts/ci/guard-price-history-sync_test.sh
      - name: Migration-version-collision guard
        run: bash scripts/ci/guard-migration-version-collision.sh
      - name: Migration-version-collision guard regression test
        run: bash scripts/ci/guard-migration-version-collision_test.sh
      # ADR-0127 §7c (ut-docs#3372): no migration names a card number,
      # BIN/IIN, CVV/CVC, track data or PIN block -- card data is PSP-vault only.
      - name: Card-data schema guard
        run: bash scripts/ci/guard-card-data-schema.sh
      - name: Card-data schema guard regression test
        run: bash scripts/ci/guard-card-data-schema_test.sh
      - name: Kiosk-engine isolation guard
        run: bash scripts/ci/guard-kiosk-engine.sh
      - name: Kiosk-engine isolation guard regression test
        run: bash scripts/ci/guard-kiosk-engine_test.sh
      # ut-docs#2097: no till dialog opens with showModal() -- it makes the
      # status bar and Lock inert (self-order kiosk's #selforder-modal exempt).
      - name: No-showModal guard
        run: bash scripts/ci/guard-no-showmodal.sh
      - name: No-showModal guard regression test
        run: bash scripts/ci/guard-no-showmodal_test.sh
      - name: Demo-mode env read guard (ADR-0113)
        run: bash scripts/ci/guard-demo-env.sh
      - name: Demo-mode env read guard regression test
        run: bash scripts/ci/guard-demo-env_test.sh
      - name: Plugin-menu locked-read guard
        run: bash scripts/ci/guard-plugin-menu-read.sh
      - name: Page-route bare-http.Error guard
        run: bash scripts/ci/guard-page-http-error.sh
      - name: Page-route bare-http.Error guard regression test
        run: bash scripts/ci/guard-page-http-error_test.sh
      - name: Plugin-menu locked-read guard regression test
        run: bash scripts/ci/guard-plugin-menu-read_test.sh
      - name: Plugin-settings BumpGeneration guard
        run: bash scripts/ci/guard-plugin-settings-bump.sh
      - name: Plugin-settings BumpGeneration guard regression test
        run: bash scripts/ci/guard-plugin-settings-bump_test.sh
      # ADR-0121 F4 (ut-docs#3951): every "ut" host function has a guest SDK
      # binding and vice versa. The reference-doc half runs in the
      # adr-taxonomy-guard job, which has the ut-docs checkout.
      - name: Guest SDK host-function guard
        run: bash scripts/ci/guard-sdk-hostfns.sh
      - name: Guest SDK host-function guard regression test
        run: bash scripts/ci/guard-sdk-hostfns_test.sh
      # sdk/plugin is a nested module: the root `go test ./...` never reaches it.
      - name: Guest SDK tests (native fake host) and wasip1 vet
        working-directory: sdk/plugin
        run: |
          go test -count=1 ./...
          GOOS=wasip1 GOARCH=wasm go vet ./...
      - name: i18n coverage guard
        run: bash scripts/ci/guard-i18n.sh
      - name: i18n coverage guard regression test
        run: bash scripts/ci/guard-i18n_test.sh
      - name: i18n coverage guard ToastMessage regression test
        run: bash scripts/ci/guard-i18n_toast_test.sh
      - name: i18n coverage guard Go-side key-call regression test
        run: bash scripts/ci/guard-i18n_keycall_test.sh
      - name: i18n coverage guard format/template verb-parity regression test
        run: bash scripts/ci/guard-i18n_verbcheck_test.sh
      - name: i18n coverage guard duplicate-key regression test
        run: bash scripts/ci/guard-i18n_dupkey_test.sh
      - name: i18n coverage guard page-title regression test
        run: bash scripts/ci/guard-i18n_title_test.sh
      - name: Compliance-claims wording guard
        run: bash scripts/ci/guard-compliance-claims.sh
      - name: Compliance-claims wording guard regression test
        run: bash scripts/ci/guard-compliance-claims_test.sh
      - name: Competitor-naming guard (ADR-0106)
        run: bash scripts/ci/guard-competitor-naming.sh
      - name: Competitor-naming guard regression test
        run: bash scripts/ci/guard-competitor-naming_test.sh
      - name: Core-neutral guard (owner rule 2026-09-25, #2848)
        # checkout is depth 1 with no other refs: fetch main so the guard
        # can enforce its shrink-only allow-list against origin/main (#2888).
        run: |
          git fetch --no-tags --depth=1 origin +refs/heads/main:refs/remotes/origin/main
          bash scripts/ci/guard-core-neutral.sh
      - name: Core-neutral guard regression test
        run: bash scripts/ci/guard-core-neutral_test.sh
      - name: Manual screenshot freshness guard
        run: bash scripts/ci/run-docs-shots-guard.sh
      - name: Manual screenshot freshness guard wrapper regression test
        run: bash scripts/ci/run-docs-shots-guard_test.sh
      - name: Manual screenshot freshness guard regression test
        run: bash scripts/ci/guard-docs-shots_test.sh
      - name: "Manual screenshot freshness guard: Python/JS cross-check (ut-docs#370)"
        run: bash scripts/ci/guard-docs-shots-cross-check_test.sh
      - name: "Manual screenshot freshness guard: surface-hash-only escape hatch (ut-docs#2102)"
        run: bash scripts/ci/update-docs-shots-surface-hash_test.sh
      - name: Help-topic registry guard
        env:
          GOMODCACHE: ${{ runner.temp }}/gomodcache
          GOCACHE: ${{ runner.temp }}/gobuildcache
        run: bash scripts/ci/guard-help-topics.sh
      - name: Help-topic translation-drift guard
        env:
          GOMODCACHE: ${{ runner.temp }}/gomodcache
          GOCACHE: ${{ runner.temp }}/gobuildcache
        run: bash scripts/ci/guard-help-drift.sh
      - name: Linux desktop webkit2gtk version guard
        run: bash scripts/ci/guard-webkit-version.sh
      - name: Linux desktop webkit2gtk version guard regression test
        run: bash scripts/ci/guard-webkit-version_test.sh
      - name: Kiosk launch flags guard
        run: bash scripts/ci/guard-kiosk-launch-flags.sh
      - name: Android status/notification address guard
        run: bash scripts/ci/guard-android-status-address.sh
      - name: Android string resource i18n guard
        run: bash scripts/ci/guard-android-i18n.sh
      - name: Android external-link hand-off guard
        run: bash scripts/ci/guard-android-external-links.sh
      - name: Android external-link hand-off guard regression test
        run: bash scripts/ci/guard-android-external-links_test.sh
      - name: README local link/image guard
        run: bash scripts/ci/guard-readme-local-links.sh
      - name: README local link/image guard regression test
        run: bash scripts/ci/guard-readme-local-links_test.sh
      - name: Android manifest implied-feature guard
        run: bash scripts/ci/guard-android-manifest-features.sh
      - name: Android manifest implied-feature guard regression test
        run: bash scripts/ci/guard-android-manifest-features_test.sh
      - name: iOS usage-description guard (ut-docs#3354)
        run: bash scripts/ci/guard-ios-usage-descriptions.sh
      - name: iOS usage-description guard regression test
        run: bash scripts/ci/guard-ios-usage-descriptions_test.sh
      - name: Android WebView network-state guard (ut-docs#3088)
        run: bash scripts/ci/guard-android-network-state.sh
      - name: Android WebView network-state guard regression test
        run: bash scripts/ci/guard-android-network-state_test.sh
      - name: Android MainActivity configChanges guard (ut-docs#2788)
        run: bash scripts/ci/guard-android-config-changes.sh
      - name: Android MainActivity configChanges guard regression test
        run: bash scripts/ci/guard-android-config-changes_test.sh
      # guard-gobind-skip.sh's real-CI mode runs in android-ci.yml (it needs
      # gobind on PATH, and only makes sense when android/**/mobile/**
      # changed) — but its regression test is pure bash against throwaway
      # fixtures, needs no toolchain, and must not be gated behind that path
      # filter (ut-docs#1735 review): every other guard's own _test.sh runs
      # unconditionally here, and a PR touching only the guard script itself
      # would otherwise ship it completely unverified.
      - name: gobind-skip guard regression test
        run: bash scripts/ci/guard-gobind-skip_test.sh
      - name: Emoji font guard
        run: bash scripts/ci/guard-emoji-font.sh
      - name: htmx-loaded guard
        run: bash scripts/ci/guard-htmx-loaded.sh
      - name: docs-hub checkout repo guard
        run: bash scripts/ci/guard-docs-hub-checkout-repo.sh
      - name: docs-hub checkout repo guard regression test
        run: bash scripts/ci/guard-docs-hub-checkout-repo_test.sh
      - name: Autofill-suppression guard
        run: bash scripts/ci/guard-autofill-suppression.sh
      - name: Autofill-suppression guard regression test
        run: bash scripts/ci/guard-autofill-suppression_test.sh
      # ut-docs#3325 (CSP slice 2 of #2913): no onclick=/onerror=/hx-on in
      # web/ui -- they live in web/public/inline-actions.js as delegated
      # data-action / data-after-request / ... listeners (never data-on-*:
      # html/template would JS-escape those), ahead of the enforced CSP (#3327).
      - name: No-inline-handlers guard
        run: bash scripts/ci/guard-no-inline-handlers.sh
      - name: No-inline-handlers guard regression test
        run: bash scripts/ci/guard-no-inline-handlers_test.sh
      - name: On-screen keyboard guard
        run: bash scripts/ci/guard-osk-loaded.sh
      - name: On-screen keyboard guard regression test
        run: bash scripts/ci/guard-osk-loaded_test.sh
      - name: E2e cross-spec fixtures-import guard
        run: bash scripts/ci/guard-e2e-fixtures-import.sh
      - name: E2e cross-spec fixtures-import guard regression test
        run: bash scripts/ci/guard-e2e-fixtures-import_test.sh
      - name: Brand asset guard
        run: bash scripts/ci/check-brand-assets.sh
      - name: Brand asset guard regression test
        run: bash scripts/ci/check-brand-assets_test.sh
      - name: Stale-worktree prune script regression test
        # scripts/prune-stale-worktrees.sh itself is a manual maintenance
        # tool (run via `make prune-worktrees`, not part of this build),
        # but its test is fully hermetic (own mktemp -d scratch git repo,
        # no network writes, no shared state) so nothing stops it running
        # here — without this, a regression in its safety checks (e.g.
        # ut-docs#1567's locked-worktree finding) would go undetected
        # indefinitely.
        run: bash scripts/prune-stale-worktrees_test.sh
      - name: Retry-with-backoff script regression test
        # scripts/ci/retry-with-backoff.sh itself is invoked directly by the
        # desktop-shell and e2e jobs below (ut-docs#1933), not by this build
        # job — but its test is fully hermetic (own mktemp -d scratch dir,
        # fake commands, no real apt/network/sudo) so nothing stops it
        # running here, same reasoning as the stale-worktree test just
        # above. Without this, a regression in the retry/backoff logic
        # would go undetected until the next real apt-repo outage.
        run: bash scripts/ci/retry-with-backoff_test.sh
      - name: Nightly asset-prune script regression test
        # scripts/ci/prune-nightly-assets.sh itself is invoked by
        # nightly.yml's own publish step, not this job — but its test is
        # fully hermetic (list_assets/delete_asset are redefined to fake
        # in-memory stand-ins, no gh/network call at all) so nothing stops
        # it running here, same reasoning as the two tests just above.
        # ut-docs#2360: without this, the exact `set -e` + trailing `&&`
        # regression that made every nightly report false failure after a
        # successful publish could resurface unnoticed.
        run: bash scripts/ci/prune-nightly-assets_test.sh
      - name: Windows code-signing regression test
        # ut-docs#2610: the release's signing wiring (goreleaser hooks, the
        # signing job, the NSIS uninstaller hook) and
        # packaging/windows/sign-exe.sh's fail-closed checks, against a
        # throwaway test CA — no signing identity involved. osslsigncode
        # comes from install-osslsigncode.sh, as in the release
        # (ut-docs#3867).
        env:
          UT_REQUIRE_SIGNING_TOOLS: "1"
        run: |
          bash scripts/ci/retry-with-backoff.sh 3 5 --clear-apt-lists -- sudo apt-get update
          sudo apt-get install -y nsis
          bash packaging/windows/install-osslsigncode.sh
          bash scripts/ci/windows-signing_test.sh
      - name: Makefile version-stamp guard
        env:
          GOMODCACHE: ${{ runner.temp }}/gomodcache
          GOCACHE: ${{ runner.temp }}/gobuildcache
        run: bash scripts/ci/guard-makefile-version.sh
      - name: Build
        env:
          GOMODCACHE: ${{ runner.temp }}/gomodcache
          GOCACHE: ${{ runner.temp }}/gobuildcache
        run: go build ./...
      - name: Vet Windows-only code (GOOS=windows, ut-docs#2760)
        # Nothing else on a PR compiles windows-tagged Go: the Windows shell
        # is a mingw cgo build that only release.yml runs. internal/procjob
        # (the kill-on-close job that stops unitill-pos when the shell dies)
        # and the data-dir lock are pure Go, so cross-vet them — tests
        # included — to catch a wrong x/sys signature before a release.
        env:
          GOMODCACHE: ${{ runner.temp }}/gomodcache
          GOCACHE: ${{ runner.temp }}/gobuildcache
          GOOS: windows
        run: go vet ./internal/procjob/ ./internal/db/ ./cmd/unitill-desktop/
      - name: Windows exe carries the app icon + VERSIONINFO (ut-docs#2786)
        # The release's goreleaser pre-build hook, end to end: winres.sh
        # writes the .syso, a cross-compiled unitill-pos.exe links it, and
        # checkpeicon reads it back. CGO off, so no mingw needed here;
        # release.yml runs the same check on both signed release exes.
        env:
          GOMODCACHE: ${{ runner.temp }}/gomodcache
          GOCACHE: ${{ runner.temp }}/gobuildcache
        run: |
          set -euo pipefail
          trap 'rm -f rsrc_windows_amd64.syso' EXIT
          packaging/windows/winres.sh server 0.0.0-ci
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -o "$RUNNER_TEMP/unitill-pos.exe" .
          go run ./scripts/ci/checkpeicon "$RUNNER_TEMP/unitill-pos.exe"
      - name: Test
        env:
          GOMODCACHE: ${{ runner.temp }}/gomodcache
          GOCACHE: ${{ runner.temp }}/gobuildcache
        # Excludes internal/plugins itself (own step below, ut-docs#643) and
        # its oauth/marketplace subpackages (own step below, ut-docs#1630) —
        # both run with -v there so a t.Skip is visible; this step stays
        # plain, so don't run either a second time here. Also excludes
        # internal/pages itself (own step below, ut-docs#1992) for the same
        # margin reason as internal/plugins — see that step's comment — and
        # internal/enroll, internal/logging, internal/netreach, internal/app
        # and internal/server (own -race step below, ut-docs#3021,
        # ut-docs#3410, ut-docs#3014).
        run: go test $(go list ./... | grep -vE '/internal/plugins$|/internal/plugins/(oauth|marketplace)$|/internal/pages$|/internal/(enroll|logging|netreach|app|server)$')
      - name: Test internal/enroll, internal/logging, internal/netreach, internal/app, internal/server under -race (ut-docs#3021, ut-docs#3410, ut-docs#3014)
        # internal/app and internal/server join this step (ut-docs#3014): the
        # boot path starts background goroutines (the cloud link copies *cfg
        # via enroll.Effective) before server.Start binds, so a write to any
        # *cfg field in Start is a data race on every boot that plain
        # `go test` never sees — it sat unseen until a chance local -race run
        # (ut-docs#2990, TestStart_DoesNotWriteSharedConfigWhileOthersReadIt).
        # Measured locally under -race: internal/app ~150s, internal/server
        # ~45s, both under the default 600s per-package timeout; with the
        # cold race-instrumented compile of internal/app's dependency tree
        # expect the step to take ~3-6 min (the plain Test step sheds ~150s).
        # internal/logging and internal/netreach join this step (ut-docs#3410):
        # the recover path reaches the global logger from every background
        # goroutine, and an unsynchronised L() init race only shows under -race.
        # internal/enroll keeps its identity state (storeIDExplicit,
        # tokenExplicit, cur) in package globals shared with background
        # goroutines (the registration retry loop, the replica vouch loop) —
        # exactly the shape that hid a real data race (Init writing a global
        # without mu while a loop a previous test left running read it under
        # mu.RLock) from the plain `go test` step above. Scoped to this one
        # package rather than adding -race to the whole suite: internal/pages,
        # internal/plugins and internal/data stay out because their -race
        # runtimes don't fit (ut-docs#1034, ut-docs#2156, ut-docs#1366).
        env:
          GOMODCACHE: ${{ runner.temp }}/gomodcache
          GOCACHE: ${{ runner.temp }}/gobuildcache
        run: go test -race -count=1 ./internal/enroll/ ./internal/logging/ ./internal/netreach/ ./internal/app/ ./internal/server/
      - name: Test (internal/plugins/oauth and /marketplace — ut-docs#1630)
        # Same gap #1626 fixed for internal/plugins itself: the main Test
        # step above runs plain (no -v), so a t.Skip in these subpackages
        # (both have a real one, gated on os.Hostname() being empty —
        # internal/plugins/oauth/token_client_test.go and
        # internal/plugins/marketplace/client_more_test.go) prints no
        # `--- SKIP` line and CI just reports `ok` whether the test actually
        # ran or silently skipped. Scoped to exactly these two packages (no
        # trailing /...) so they don't also run inside the main Test step's
        # `go test ./...` above — see that step's own exclude and ut-docs#662
        # on why re-running things twice in one job is worth avoiding.
        env:
          GOMODCACHE: ${{ runner.temp }}/gomodcache
          GOCACHE: ${{ runner.temp }}/gobuildcache
        run: go test -v ./internal/plugins/oauth ./internal/plugins/marketplace
      - name: Test (internal/plugins — wider timeout, ut-docs#643/#753/#776)
        # internal/plugins hit the plain (this workflow uses -race only for the boot-path packages above)
        # default 600s per-package `go test` timeout for real in CI (PR
        # #316, "FAIL ... internal/plugins 600.015s") — not a deadlock: this
        # session measured the package's own plain runtime at 83-93s and
        # ut-docs#648 recorded the identical shape for internal/pages
        # ("goroutine dump showed [a test] still runnable inside a DB
        # query, not deadlocked, not a real hang" at 599.802s) — a `go
        # test` timeout dumps every live goroutine at the deadline instant,
        # and whichever one is transiently waiting on a shared resource
        # (here internal/logging's package-global mutex) at that exact
        # moment reads as "blocked" out of context. The git history since
        # ut-docs#509 (draining Supervisor's monitorProcess goroutines)
        # shows no reintroduced leak of that shape, and every
        # WasmRuntime.Sync call in this package's tests that can actually
        # register a subscriber already drains it (defer
        # bus.ResetSubscribers()) — the rest never reach subscription at
        # all (load failure short-circuits first) — so this is margin, not
        # a bug. Run separately with a longer timeout rather than raising
        # it for the whole suite, so a genuine hang anywhere else still
        # fails fast (within the default 10m) instead of taking up to 20m
        # to report. Scoped to the exact package (no trailing /...) so
        # internal/plugins/marketplace and /oauth — covered by their own
        # dedicated step above (ut-docs#1630), not the main Test step
        # anymore — don't run a second time in this same job; see
        # ut-docs#662's own comment on why re-running things twice in one
        # job is exactly the kind of contention this package doesn't need
        # more of.
        # -v (ut-docs#1626): plain `go test` prints no `--- SKIP` line, so a
        # test skipping here (e.g. TestReload_SurvivesRealisticPublisherContention's
        # publisher-floor precondition, ut-docs#1198) was invisible — CI just
        # reported `ok` whether the test actually ran or silently skipped.
        env:
          GOMODCACHE: ${{ runner.temp }}/gomodcache
          GOCACHE: ${{ runner.temp }}/gobuildcache
        run: go test -timeout 20m -v ./internal/plugins
      - name: Test (internal/pages — wider timeout, ut-docs#1992)
        # internal/pages hit the same plain (no -race) default 600s
        # per-package `go test` timeout as internal/plugins did (ut-docs#643/
        # #753/#776, comment above) — this time for real in CI on
        # universal-till PR #1018, "FAIL ... internal/pages 600.022s"
        # (goroutine dump caught inside InstallStatusRepo.Upsert's WAL
        # commit-unlock path, an ordinary in-flight fcntl syscall, not a
        # wait). Independently re-investigated for ut-docs#1992: this
        # package's own plain local runtime is ~210-237s against the 600s
        # budget, and sibling packages in the SAME incident's CI job
        # measured 7.7-8.8x slower than their own local baseline under
        # runner contention (internal/pos 8.8x, internal/settings 8.1x,
        # internal/pages/common 7.7x) — that alone is enough to cross 600s
        # without any hang, exactly ut-docs#648's already-documented
        # "goroutine dump ≠ real hang" shape for this same package.
        # Confirmed no actual deadlock/leak candidate in the path:
        # `internal/db.Open`'s DSN already sets `busy_timeout(5000)` (rules
        # out a SQLite lock explaining a 600s block) and an unbounded
        # connection pool (rules out a `database/sql` pool-exhaustion
        # wait); the specific test named in the incident
        # (TestResolveAndInstallBasePlugin_PicksHighestSemverVersion) passed
        # 40/40 local reruns with -race across two independent runs, ~1.9s/
        # iteration. The real cost driver is fixture cost (~2200 tests each
        # opening a fresh on-disk SQLite file and replaying all
        # migrations), not a specific slow test, so shrinking one test's
        # workload (ut-docs#648's own fix, applicable when one outlier test
        # owns the margin) doesn't apply here. **The bigger effect is
        # isolation, not the timeout itself**: run alone (as the two
        # locale-specific reruns below already do) the package lands at
        # ~204-214s — it's competing with ~70 sibling test binaries inside
        # the blanket step that pushes it over 600s. This step's own
        # `-timeout 20m` is belt-and-braces on top of that isolation, same
        # as internal/plugins already does. Scoped to the exact package (no
        # trailing /...) so the two OS-locale-specific internal/pages/...
        # reruns below — already their own steps — don't run a third time
        # here; they get their own `-timeout` below instead, for the same
        # margin reason under whatever locale-specific contention they hit.
        env:
          GOMODCACHE: ${{ runner.temp }}/gomodcache
          GOCACHE: ${{ runner.temp }}/gobuildcache
        run: go test -timeout 20m ./internal/pages
      - name: Test (with OS locale set — ut-docs#662)
        # This runner's own container has no LANG, which is exactly what let
        # ut-docs#662's OS-locale-detection redirect (ut-docs#590) hide 4
        # failing tests from CI while they failed on every real developer
        # machine. Re-running with a locale set catches this class of "only
        # breaks off this specific runner" bug in the one package it can
        # actually occur in today (internal/pages owns every OS-locale
        # touchpoint in this repo — see setup_detect.go).
        #
        # Deliberately scoped to internal/pages/..., NOT the full `go test
        # ./...` a second time (ut-docs#674, found same-day): running the
        # entire suite twice in one job triggered a real CI failure in the
        # unrelated internal/plugins package — a 600s test-binary timeout
        # with goroutines blocked on internal/logging's mutex and
        # database/sql's connection opener. Investigating ut-docs#674 found
        # and fixed a genuine unbounded resource amplifier in
        # internal/plugins (EventBus.publish's "channel full" path could
        # perform ~16,700 unthrottled synchronous DB+stdout writes in one
        # test) — so "no actual bug in internal/plugins" turned out to be
        # wrong, there was one, now throttled. What independent review could
        # NOT do is reproduce the double-run hang itself (several run
        # patterns, pre- and post-fix) to confirm that bug was the cause of
        # THIS incident specifically, so treat it as fixed-along-the-way
        # hardening, not a confirmed root cause. main had 15 consecutive
        # green runs before this step was widened to the whole tree, and
        # failed on the very next merge after. If a locale-dependent bug
        # ever surfaces outside internal/pages, that's the point to widen
        # this scope again -- deliberately, with the same resource-
        # contention risk in mind, not by reflex.
        env:
          GOMODCACHE: ${{ runner.temp }}/gomodcache
          GOCACHE: ${{ runner.temp }}/gobuildcache
          LANG: en_GB.UTF-8
          LC_ALL: en_GB.UTF-8
        # -timeout 20m (ut-docs#1992): same margin fix as the plain
        # internal/pages step above — this rerun carries the identical
        # fixture cost under whatever locale-specific contention it hits.
        run: go test -timeout 20m ./internal/pages/...
      - name: Test (with unavailable-language OS locale set — ut-docs#672)
        # The en_GB run above only ever detects an AVAILABLE language ("en"
        # is always in httpx.AvailableLocales()), so /setup's other
        # detection outcome — language detected but not shipped
        # (setup_page.go's "setup.detected_lang_unavailable" branch) — has
        # never actually run against a real OS-locale env var in CI, only
        # against tests that mock detection via withOSLocale. de_DE.UTF-8
        # exercises that branch for real: German isn't one of web/locales'
        # shipped locales (ar/en/fa/tr) today. Same scoping rationale as the
        # en_GB step above (internal/pages/... only, not the whole tree —
        # see ut-docs#674's comment there).
        env:
          GOMODCACHE: ${{ runner.temp }}/gomodcache
          GOCACHE: ${{ runner.temp }}/gobuildcache
          LANG: de_DE.UTF-8
          LC_ALL: de_DE.UTF-8
        # -timeout 20m (ut-docs#1992): same margin fix as the plain
        # internal/pages step above.
        run: go test -timeout 20m ./internal/pages/...

  desktop-shell:
    # ut-docs#1071: cmd/unitill-desktop's `desktop && linux` build tag (cgo +
    # GTK/WebKit) was previously compiled nowhere except release.yml, at tag
    # time — a syntax error, a wrong cgo signature or a renamed symbol there
    # passed every PR check and surfaced only when cutting a release. This
    # job closes that gap for Linux (the platform that actually ships to
    # shops); Windows/macOS have the same shape of gap, tracked separately.
    # Build + vet, no tests and no window — release.yml remains the source
    # of truth for the actual release recipe; keep this in sync with its
    # "Install GTK/WebKit dev headers" / "Build unitill-desktop" steps.
    # ut-docs#1581 (split from ut-docs#1565) added the last three steps: a
    # `desktop`-tagged golangci-lint pass, a whole-program deadcode baseline
    # check, and that guard's own regression test — all three need this
    # job's GTK/WebKit headers to type-check cmd/unitill-desktop's real cgo
    # files at all. See .golangci-desktop.yml and
    # scripts/ci/guard-deadcode-baseline.sh for why each is a separate
    # config/script from the root `build` job's untagged equivalents rather
    # than a shared one.
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.27' }
      - name: Install GTK/WebKit dev headers
        # ut-docs#1933: apt-get update against this runner image's
        # pre-configured Google Chrome repo intermittently fails with a
        # "Hash Sum mismatch" -- a known, recurring, external CDN-edge
        # issue on GitHub-hosted Ubuntu runners, not anything in this
        # repo. Retry with backoff, clearing the local apt index cache
        # between attempts so a retry can't just re-serve the same stale
        # index (scripts/ci/retry-with-backoff.sh).
        run: |
          bash scripts/ci/retry-with-backoff.sh 3 5 --clear-apt-lists -- sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Build unitill-desktop (desktop build tag)
        env:
          GOMODCACHE: ${{ runner.temp }}/gomodcache
          GOCACHE: ${{ runner.temp }}/gobuildcache
          CGO_ENABLED: 1
        run: go build -tags desktop ./cmd/unitill-desktop
      - name: Vet unitill-desktop (desktop build tag)
        env:
          GOMODCACHE: ${{ runner.temp }}/gomodcache
          GOCACHE: ${{ runner.temp }}/gobuildcache
          CGO_ENABLED: 1
        run: go vet -tags desktop ./cmd/unitill-desktop
      - name: Lint unitill-desktop (golangci-lint, unused, desktop build tag)
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          args: --config=.golangci-desktop.yml --build-tags=desktop ./cmd/unitill-desktop/...
        env:
          GOMODCACHE: ${{ runner.temp }}/gomodcache
          GOCACHE: ${{ runner.temp }}/gobuildcache
          CGO_ENABLED: 1
      - name: Deadcode baseline (whole-program, desktop build tag)
        env:
          GOMODCACHE: ${{ runner.temp }}/gomodcache
          GOCACHE: ${{ runner.temp }}/gobuildcache
          CGO_ENABLED: 1
        run: bash scripts/ci/guard-deadcode-baseline.sh
      - name: Deadcode baseline guard regression test
        env:
          GOMODCACHE: ${{ runner.temp }}/gomodcache
          GOCACHE: ${{ runner.temp }}/gobuildcache
          CGO_ENABLED: 1
        run: bash scripts/ci/guard-deadcode-baseline_test.sh
      - name: Install mingw-w64 (Windows desktop shell cross-build)
        # ut-docs#610: the `desktop && windows` files (window_mode_windows.go,
        # autostart_windows.go, webview2_windows.go) were compiled only by
        # release.yml. Same toolchain and EventToken.h fix as release.yml's
        # "Install mingw-w64 (Windows desktop shell)" step — keep them in sync.
        run: |
          bash scripts/ci/retry-with-backoff.sh 3 5 --clear-apt-lists -- sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64
          INC=/usr/x86_64-w64-mingw32/include
          test -f "$INC/eventtoken.h" || { echo "::error::mingw eventtoken.h missing"; exit 1; }
          sudo ln -sf "$INC/eventtoken.h" "$INC/EventToken.h"
      - name: Build unitill-desktop.exe (desktop build tag, mingw cross)
        env:
          GOMODCACHE: ${{ runner.temp }}/gomodcache
          GOCACHE: ${{ runner.temp }}/gobuildcache
          CGO_ENABLED: 1
          GOOS: windows
          GOARCH: amd64
          CC: x86_64-w64-mingw32-gcc
          CXX: x86_64-w64-mingw32-g++
        run: go build -tags desktop -o "$RUNNER_TEMP/unitill-desktop.exe" ./cmd/unitill-desktop

  windows-shell:
    # ut-docs#610: the Windows window modes and Startup-folder autostart are
    # pure-Go user32/COM code (win32window_windows.go, shelllink_windows.go),
    # tagged `windows` but not `desktop`, so they run here on a real Windows
    # desktop against a plain CreateWindowEx window and a real .lnk — no
    # WebView2 build needed. Public repo: GitHub-hosted runner only.
    runs-on: windows-latest
    needs: build
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.27' }
      - name: Vet unitill-desktop (windows)
        run: go vet ./cmd/unitill-desktop/
      - name: Win32 window modes + startup shortcut
        run: go test -v -count=1 -run "Win32|StartupShortcut" ./cmd/unitill-desktop/

  e2e:
    runs-on: ubuntu-latest
    needs: build
    env:
      # ut-docs went private (2026-07-31), so the default GITHUB_TOKEN can no
      # longer read it — a PAT with read access to universaltill/ut-docs must
      # be provided as the DOCS_READ_TOKEN secret. Without it the docs-hub
      # specs skip (loudly), rather than failing the whole e2e job.
      DOCS_READ_TOKEN: ${{ secrets.DOCS_READ_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Checkout docs repo for docs-hub tests
        if: env.DOCS_READ_TOKEN != ''
        uses: actions/checkout@v4
        with:
          repository: universaltill/ut-docs
          # NOT ./docs — that is universal-till's OWN docs directory, which
          # made the specs' "is the docs repo present?" skip-check always
          # true (and previously let the checkout silently clobber it).
          path: ./.docs-hub
          token: ${{ env.DOCS_READ_TOKEN }}
      - name: Warn that docs-hub specs will skip
        if: env.DOCS_READ_TOKEN == ''
        run: echo "::warning::DOCS_READ_TOKEN secret not set — ut-docs is private, docs-hub e2e specs will be skipped"
      - uses: actions/setup-go@v5
        with: { go-version: '1.27' }
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - name: Seed E2E database
        run: UT_DB_PATH=./data/e2e.db go run ./scripts/e2e_seed/main.go
      - name: Start app
        run: |
          # UT_AUTH=off is the documented CI escape hatch — the e2e suite
          # exercises the till flows, not the PIN login.
          # UT_LISTEN_ADDR is 127.0.0.1:8080, not the ambiguous ":8080" —
          # ut-docs#2252: an unspecified/wildcard host can resolve to an
          # IPv6-only bind on some runner images, which the curl health-check
          # below (and Playwright's BASE_URL) can never reach over IPv4
          # loopback. Every e2e/run-till*.sh script already binds an
          # explicit 127.0.0.1:<port> for the same reason — this is the one
          # place that didn't.
          #
          # ut-docs#2255: build once, THEN run the binary — not `go run .`
          # backgrounded straight away. `go run .` ties the health-check
          # loop's clock to compile time as well as actual startup time; on
          # this runner that compile alone has been observed taking ~31s,
          # one second past the old 30x1s budget, failing the step before
          # the binary had even started listening. Same pattern
          # e2e/run-till.sh already uses (see its own comment) for a
          # different reason (CWD); here it also means the retry loop only
          # ever waits on real process startup, not a variable compile time.
          go build -o /tmp/ut-e2e-app .
          UT_AUTH=off UT_STORE=sqlite UT_DB_PATH=./data/e2e.db UT_LISTEN_ADDR=127.0.0.1:8080 UT_DEV_MODE=true /tmp/ut-e2e-app &
          for i in {1..30}; do
            if curl -sf http://127.0.0.1:8080/ >/dev/null; then
              echo "App is up"
              exit 0
            fi
            sleep 1
          done
          echo "App did not start in time" >&2
          exit 1
      - name: Install E2E dependencies
        working-directory: tests/e2e
        # Playwright < 1.61 hangs after the browser download on Node 26
        # (ut-docs#3595); cap it so a hang fails fast, not at the 6h limit.
        timeout-minutes: 15
        # ut-docs#1933: `playwright install --with-deps` shells out to
        # apt-get, which hits the same intermittent "Hash Sum mismatch"
        # against this runner image's pre-configured Google Chrome repo as
        # the desktop-shell job's own apt-get update above -- see that
        # step's comment. Retry the whole install with backoff, clearing
        # the local apt index cache between attempts.
        run: |
          npm install
          bash ../../scripts/ci/retry-with-backoff.sh 3 5 --clear-apt-lists -- npx playwright install --with-deps chromium
      - name: Run Playwright tests
        working-directory: tests/e2e
        env:
          BASE_URL: http://127.0.0.1:8080
          DOCS_ROOT: ${{ github.workspace }}/.docs-hub
        run: npm run test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/e2e/playwright-report/

  contract:
    runs-on: ubuntu-latest
    needs: build
    env:
      PACT_BROKER_BASE_URL: ${{ secrets.PACT_BROKER_BASE_URL }}
      PACT_BROKER_TOKEN: ${{ secrets.PACT_BROKER_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.27' }
      - name: Download Pact FFI
        run: |
          curl -L -o /tmp/libpact_ffi.so.gz \
            https://github.com/pact-foundation/pact-reference/releases/download/libpact_ffi-v0.4.23/libpact_ffi-linux-x86_64.so.gz
          gunzip /tmp/libpact_ffi.so.gz
          sudo mkdir -p /usr/local/lib
          sudo mv /tmp/libpact_ffi.so /usr/local/lib/libpact_ffi.so
      - name: Run contract tests
        env:
          LIBRARY_PATH: /usr/local/lib
          LD_LIBRARY_PATH: /usr/local/lib
        run: go test -tags=contract ./tests/contract
      - name: Publish Pact contracts
        if: ${{ env.PACT_BROKER_BASE_URL != '' && env.PACT_BROKER_TOKEN != '' }}
        env:
          PACT_CONSUMER_VERSION: ${{ github.sha }}
          PACT_CONSUMER_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          docker run --rm \
            -e PACT_BROKER_BASE_URL \
            -e PACT_BROKER_TOKEN \
            -e PACT_CONSUMER_VERSION \
            -e PACT_CONSUMER_BRANCH \
            -v "$PWD/tests/contract/pacts:/pacts" \
            pactfoundation/pact-cli:latest \
            publish /pacts \
            --consumer-app-version "$PACT_CONSUMER_VERSION" \
            --branch "$PACT_CONSUMER_BRANCH"
      - name: Upload Pact artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pact-artifacts
          path: |
            tests/contract/pacts/
            tests/contract/logs/

  # ADR-0002's taxonomy line and internal/plugins.CanonicalTypes must agree
  # for real (ut-docs#2134) — the old same-repo test that claimed to pin
  # this compared CanonicalTypes to a second hardcoded copy of itself and
  # never actually read the ADR. Pure bash/grep, no Go build needed, so this
  # runs standalone rather than gated behind `build` — same shape as
  # ut-cloud's manifest-contract-guard job, which solves the identical
  # cross-repo mirroring problem in the other direction.
  adr-taxonomy-guard:
    runs-on: ubuntu-latest
    env:
      # ut-docs went private (2026-07-31) — the default GITHUB_TOKEN cannot
      # read it, and (independent review, ut-docs#2134) ut-cloud's
      # manifest-contract-guard is NOT the same shape here: it checks out
      # universal-till, which is PUBLIC, so its tokenless checkout works in
      # that direction and does not in this one. A PAT with read access to
      # universaltill/ut-docs must be provided as the DOCS_READ_TOKEN
      # secret. Same fallback convention as this file's own `e2e` job
      # (its docs-hub checkout, above): when the secret isn't available —
      # a fork PR never receives repo secrets — this job skips loudly
      # rather than either failing (blocking every external contribution
      # on a secret they can't have) or silently passing (the exact
      # failure class this guard exists to prevent).
      DOCS_READ_TOKEN: ${{ secrets.DOCS_READ_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      # Self-test runs first and unconditionally (no ut-docs checkout
      # needed), mirroring lang-pack-drift.yml's own "self-tests run first,
      # even if a later step would fail" convention and this file's other
      # guards' `_test.sh`-then-guard ordering — so a red run always tells
      # you whether the guard mechanism itself is sound, not just whether
      # the taxonomy agrees.
      - name: ADR-0002 plugin taxonomy drift guard regression test
        run: bash scripts/ci/guard-adr-plugin-taxonomy_test.sh
      # ut-docs#2159: ADR-0002's own text isn't the only place the taxonomy
      # count can drift — any OTHER ADR that separately restates the count
      # in prose can go stale independently (two real instances already:
      # ADR-0002 itself in ut-docs#2134, ADR-0050 in ut-docs#2150). Same
      # self-test-first ordering as the ADR-0002 guard just above, and
      # deliberately a separate script/job step (not merged into the
      # ADR-0002 guard) so each guard's own failure output stays about one
      # thing.
      - name: Cross-ADR taxonomy drift guard regression test
        run: bash scripts/ci/guard-adr-taxonomy-drift_test.sh
      - name: Checkout ut-docs for the taxonomy guards
        if: env.DOCS_READ_TOKEN != ''
        uses: actions/checkout@v4
        with:
          repository: universaltill/ut-docs
          path: ut-docs
          token: ${{ env.DOCS_READ_TOKEN }}
      - name: ADR-0002 plugin taxonomy drift guard
        if: env.DOCS_READ_TOKEN != ''
        env:
          DOCS_DIR: ut-docs
        run: bash scripts/ci/guard-adr-plugin-taxonomy.sh
      - name: Cross-ADR taxonomy drift guard
        if: env.DOCS_READ_TOKEN != ''
        env:
          DOCS_DIR: ut-docs
        run: bash scripts/ci/guard-adr-taxonomy-drift.sh
      # ut-docs#3951: every host function has a reference entry in ut-docs.
      - name: Guest SDK host-function reference guard
        if: env.DOCS_READ_TOKEN != ''
        env:
          DOCS_DIR: ut-docs
        run: bash scripts/ci/guard-sdk-hostfns.sh
      - name: Warn that the taxonomy guards will skip
        if: env.DOCS_READ_TOKEN == ''
        run: echo "::warning::DOCS_READ_TOKEN secret not set — ut-docs is private, the ADR-0002, cross-ADR taxonomy and SDK reference guards will be skipped"
