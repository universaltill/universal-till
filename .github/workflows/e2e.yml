name: UI E2E

# Real-browser Playwright suite: boots a throwaway till and drives Chromium
# through the operator flows (sale, settings/OSK, RTL, page smokes). Catches
# the JS/htmx layer Go tests can't see.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  playwright:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # ut-docs#2345: cache the Playwright browser download between runs.
      # `npx playwright install` below no-ops the ~150MB Chromium fetch on
      # a hit (its `--with-deps` apt step is idempotent and cheap either
      # way), so the command itself stays unchanged.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('e2e/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-
      - name: Install deps
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run UI suite
        working-directory: e2e
        run: npx playwright test
        env:
          CI: "1"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7
