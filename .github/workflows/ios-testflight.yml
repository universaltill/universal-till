name: ios-testflight
# ut-docs#3069: signs the iOS/iPadOS till app and uploads it to App Store
# Connect for TestFlight INTERNAL testing (owner + developers, ut-docs#3052:
# no public TestFlight or App Store release until v1.0). It never submits
# for App Store review.
#
# Security (public repo, holds the App Store Connect API key):
#   - Trigger: workflow_dispatch only -- by a maintainer, or by release.yml's
#     publish-release job (with the release's version). A `release:
#     published` trigger would never fire: release.yml publishes with
#     GITHUB_TOKEN, and GitHub starts no workflow from GITHUB_TOKEN events
#     except workflow_dispatch/repository_dispatch. NEVER push /
#     pull_request / pull_request_target: a fork PR must not reach these
#     secrets or run code next to them.
#   - Actions pinned to commit SHAs (this job holds a signing key).
#   - Signing (review of this card): the archive is built UNSIGNED and only
#     -exportArchive signs, with the team's Apple-managed (cloud)
#     Distribution certificate via the API key. A signed archive on a fresh
#     runner would mint a new Apple Development certificate every run (no
#     private key survives between runners) until the team's certificate
#     limit trips; cloud signing never puts a private key on the runner.
#   - The job only runs in universaltill/universal-till (forks skip it).
#   - GitHub-hosted macos-26 only (public repo: never a self-hosted runner).
#   - Secrets reach scripts through env: only, never `${{ secrets.X }}`
#     inside a run: block; the .p8 is written under $RUNNER_TEMP with
#     umask 077 + chmod 600 and removed in an always() step.
# scripts/ci/ios-testflight-workflow_test.sh pins all of the above.
#
# Secrets: ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8 (base64 of the .p8), and
# MACOS_NOTARY_TEAM_ID (the same Apple team as the macOS notarization).
#
# Versions:
#   MARKETING_VERSION (CFBundleShortVersionString) = the `version` input
#     (release.yml passes the release tag without its "v"), or else the
#     latest v* tag reachable from the dispatched ref.
#   CURRENT_PROJECT_VERSION (CFBundleVersion) = "<run_number>.<run_attempt>".
#     App Store Connect needs each build number unique and increasing within
#     a marketing version. run_number only ever grows for this workflow, and
#     run_attempt grows when a failed run is re-run (which keeps its
#     run_number) — so every upload, across versions and re-runs, carries a
#     higher build number than the one before it.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Marketing version, e.g. 0.27.0 (default: latest v* tag)"
        required: false
        default: ""
permissions:
  contents: read
concurrency:
  group: ios-testflight
  cancel-in-progress: false
jobs:
  testflight:
    if: github.repository == 'universaltill/universal-till'
    # macos-26 = Xcode 26 / iOS 26 SDK: App Store Connect refuses uploads
    # built with an older SDK (ut-docs#3069; the 18.5 SDK on macos-15 was).
    runs-on: macos-26
    # 60 for the build and upload + up to 40 waiting for App Store Connect
    # to process it (the tester check below, ut-docs#3217) + 20 slack.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Tags, for `git describe` on a dispatch.
          fetch-depth: 0
      - name: Refuse an iOS SDK App Store Connect would reject
        # First step: fails in seconds instead of after the 20-minute archive.
        run: |
          set -euo pipefail
          xcodebuild -version
          sdk="$(xcrun --sdk iphoneos --show-sdk-version)"
          # Empty or odd output would make `-lt` error inside the `if` and
          # pass silently under set -e, so the format is checked first.
          if ! [[ "$sdk" =~ ^[0-9]+(\.[0-9]+)*$ ]]; then
            echo "::error::unexpected iphoneos SDK version '$sdk'"
            exit 1
          fi
          if [ "${sdk%%.*}" -lt 26 ]; then
            echo "::error::iphoneos SDK $sdk is older than 26; App Store Connect refuses the upload"
            exit 1
          fi
          echo "iphoneos SDK $sdk"
      - name: Resolve marketing and build versions
        env:
          INPUT_VERSION: ${{ inputs.version }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          if [ -n "$INPUT_VERSION" ]; then
            version="$INPUT_VERSION"
          else
            version="$(git describe --tags --abbrev=0 --match 'v*')"
          fi
          version="${version#v}"
          # CFBundleShortVersionString: one to three dot-separated integers.
          # A pre-release tag (v1.2.0-rc1) is refused rather than guessed at.
          if ! printf '%s' "$version" | grep -qE '^[0-9]+(\.[0-9]+){0,2}$'; then
            echo "::error::'$version' is not a valid iOS marketing version (N, N.N or N.N.N)"
            exit 1
          fi
          build="${RUN_NUMBER}.${RUN_ATTEMPT}"
          echo "MARKETING_VERSION=$version" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$build" >> "$GITHUB_ENV"
          echo "### TestFlight upload: Universal Till $version ($build)" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: Install gomobile/gobind and XcodeGen
        run: |
          set -euo pipefail
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          brew install xcodegen
      - name: Bind the Go till server (gomobile bind -target=ios)
        run: |
          set -euo pipefail
          # Stamp the version the footer, the update check and support read; without
          # it buildinfo.Version stays "dev" (ut-docs#3221).
          gomobile bind -target=ios \
            -ldflags "-X github.com/universaltill/universal-till/internal/buildinfo.Version=${MARKETING_VERSION}" \
            -o ios/build/Mobile.xcframework ./mobile
      - name: Generate the app icon asset catalog
        run: bash ios/scripts/make-app-icon.sh
      - name: Generate the Xcode project
        run: |
          set -euo pipefail
          cd ios
          xcodegen generate
      - name: Write the App Store Connect API key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          set -euo pipefail
          if [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_KEY_P8" ]; then
            echo "::error::ASC_KEY_ID / ASC_KEY_P8 secrets are not set"
            exit 1
          fi
          umask 077
          mkdir -p "$RUNNER_TEMP/private_keys"
          printf '%s' "$ASC_KEY_P8" | base64 --decode > "$RUNNER_TEMP/private_keys/AuthKey_$ASC_KEY_ID.p8"
          chmod 600 "$RUNNER_TEMP/private_keys/AuthKey_$ASC_KEY_ID.p8"
      - name: Archive (unsigned; the export step signs)
        env:
          TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
        run: |
          set -euo pipefail
          cd ios
          xcodebuild archive \
            -project UniversalTill.xcodeproj -scheme UniversalTill \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/UniversalTill.xcarchive" \
            -derivedDataPath build/dd \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            MARKETING_VERSION="$MARKETING_VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER"
      - name: Export and upload to App Store Connect (TestFlight)
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
        run: |
          set -euo pipefail
          # destination=upload sends the signed build straight to App Store
          # Connect; it lands in TestFlight. Nothing here submits for review.
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>upload</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>teamID</key>
            <string>${TEAM_ID}</string>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/UniversalTill.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/private_keys/AuthKey_$ASC_KEY_ID.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          echo "Uploaded $MARKETING_VERSION ($BUILD_NUMBER); App Store Connect processes it before it shows in TestFlight." >> "$GITHUB_STEP_SUMMARY"
      - name: Check an internal tester can see the build
        # ut-docs#3217: an upload once went green and reached nobody for 6 h
        # (no beta group, no testers). Waits for App Store Connect to finish
        # processing (VALID), then fails unless an internal group with at
        # least one tester can see this build. Reads the key file written
        # above; logs nothing secret.
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          go run ./scripts/asc-testflight-check \
            -key-path "$RUNNER_TEMP/private_keys/AuthKey_$ASC_KEY_ID.p8" \
            -key-id "$ASC_KEY_ID" -issuer-id "$ASC_ISSUER_ID" \
            -bundle-id com.universaltill.pos \
            -version "$MARKETING_VERSION" -build "$BUILD_NUMBER" \
            -timeout 40m
          echo "An internal TestFlight group with testers can see $MARKETING_VERSION ($BUILD_NUMBER)." >> "$GITHUB_STEP_SUMMARY"
      - name: Remove the API key and export options
        if: always()
        run: rm -rf "$RUNNER_TEMP/private_keys" "$RUNNER_TEMP/ExportOptions.plist"
