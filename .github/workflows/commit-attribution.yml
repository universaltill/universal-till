# Every commit on a PR must be authored by the human who did the work.
#
# WHY THIS EXISTS: GitHub's contributor graph counts *commit authors on the
# default branch*, not PR authors. On 2026-08-14 an audit of this repo found
# 617 of ~1,242 commits on main authored `noreply@universaltill.com` — an
# address verified on no GitHub account, so credited to nobody — and 396
# authored `Claude <noreply@anthropic.com>`. The public contributors list
# read "claude 396 · farshid3003 207", i.e. it said an AI tool wrote more of
# this product than the person who built it. Separately a human contributor
# with two merged PRs had 0 contributions in every repo in the org, because
# every commit inside those PRs was authored as Claude.
#
# Root cause was local git config: per-repo `user.email` overrides pointing
# at AI tool identities. Nothing in CI noticed for over a thousand commits.
#
# See ut-docs#732. AI tools belong in a `Co-Authored-By:` trailer — never as
# the author.
#
# ut-docs#1373 extended this to also catch a well-formed
# users.noreply.github.com address whose numeric ID belongs to a DIFFERENT
# real GitHub account than the name next to it — that check now lives in
# scripts/ci/guard-commit-attribution.sh (testable, see the _test.sh
# alongside it), not inline here.
#
# ut-docs#5943 added a second, independent check: no commit in the PR may
# carry the reviewer skill's placeholder subject "WIP: pre-review snapshot"
# (it reached main in every repo because the squash step kept the message).
# Lives in guard-wip-commits.sh next to the attribution guard, with its own
# _test.sh; only the PR range is scanned, so old commits on main don't trip it.

name: commit-attribution

on:
  pull_request:

permissions:
  contents: read

jobs:
  authors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Need the PR's commits and the base, not just a shallow tip.
          fetch-depth: 0

      - name: Run guard-commit-attribution regression tests
        run: bash scripts/ci/guard-commit-attribution_test.sh

      - name: Reject AI-tool, unattributable, or wrong-ID noreply commit authors
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git log --format='%H|%ae|%an' "$BASE_SHA..$HEAD_SHA" | bash scripts/ci/guard-commit-attribution.sh

      - name: Run guard-wip-commits regression tests
        if: ${{ !cancelled() }}
        run: bash scripts/ci/guard-wip-commits_test.sh

      - name: 'Reject the reviewer skill''s "WIP: pre-review snapshot" placeholder commit'
        if: ${{ !cancelled() }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git log --format='%h %s' "$BASE_SHA..$HEAD_SHA" | bash scripts/ci/guard-wip-commits.sh
