# Compile the macOS desktop shell on a PR that changes it (ut-docs#5021).
#
# ci.yml's desktop job builds cmd/unitill-desktop with the desktop tag on
# Linux (and Windows), but webkit_darwin.go — the Cocoa/WKWebView shell and
# its Objective-C — was compiled only by release.yml's macos-app job, so a
# cgo/Objective-C mistake surfaced only when a release was already being
# cut. This builds and vets the darwin shell on a GitHub-hosted macOS runner
# (public repo: never self-hosted) whenever the shell or the embedded
# locales it reads change.
#
# ut-docs#5279: the same job also runs the go tests of every package that has
# darwin-specific files. ci.yml runs on Linux only, so e.g.
# internal/selfupdate/macapp_darwin_test.go never executed anywhere.
#
# Path-scoped, so most PRs get no run: never make it a required check.
name: desktop-darwin
on:
  pull_request:
    paths:
      - "cmd/unitill-desktop/**"
      - "web/locales/**"
      - "internal/selfupdate/**"
      - "internal/lantls/**"
      - "**/*_darwin.go"
      - "**/*_darwin_test.go"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/desktop-darwin.yml"
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15 # Apple Silicon; macos-14 is retired 2026-11-02 (ut-docs#5214)
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version-file: go.mod }
      - name: Build unitill-desktop (desktop build tag, darwin)
        env:
          CGO_ENABLED: 1
        run: go build -tags desktop -o "$RUNNER_TEMP/unitill-desktop" ./cmd/unitill-desktop
      - name: Vet unitill-desktop (desktop build tag, darwin)
        env:
          CGO_ENABLED: 1
        run: go vet -tags desktop ./cmd/unitill-desktop
      # Packages are discovered, not listed, so a new darwin file is covered
      # without touching this workflow. git ls-files keeps untracked files and
      # .claude/worktrees/ out. A darwin-specific file is one named
      # *_darwin.go / *_darwin_test.go or with a //go:build line naming darwin
      # un-negated (!darwin only marks the fallback twin). cmd/unitill-desktop
      # is skipped: it needs the desktop tag + cgo and is built and vetted above.
      - name: Test packages with darwin-only files
        shell: bash
        run: |
          set -euo pipefail
          pkgs=$(
            {
              git ls-files '*_darwin.go' '*_darwin_test.go'
              git grep -lE '^//go:build.*[^!]darwin' -- '*.go' || true
            } | xargs -n1 dirname | sort -u | grep -vx 'cmd/unitill-desktop' | sed 's|^|./|' || true
          )
          if [ -z "$pkgs" ]; then
            echo "::error::no packages with darwin-specific files found; discovery is broken"
            exit 1
          fi
          echo "Testing: $pkgs"
          # shellcheck disable=SC2086
          go test -count=1 $pkgs
