# Universal Till POS releases (docs: architecture/packaging.md).
# Local test: goreleaser release --snapshot --clean
# Real release: push a v* tag — .github/workflows/release.yml runs this.
version: 2

project_name: unitill-pos

# One build per OS so each archive can carry that OS's launcher (a mac
# download must not ship a Windows .bat — and vice-versa). Pure-Go SQLite
# (CGO off) cross-compiles all three from the Linux release runner.
builds:
  - id: linux
    binary: unitill-pos
    main: .
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags: ["-s -w -X github.com/universaltill/universal-till/internal/buildinfo.Version={{.Version}}"]
    goos: [linux]
    goarch: [amd64, arm64]
  - id: windows
    binary: unitill-pos
    main: .
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags: ["-s -w -X github.com/universaltill/universal-till/internal/buildinfo.Version={{.Version}}"]
    goos: [windows]
    goarch: [amd64]
  # Windows desktop shell (Edge WebView2 window, like the mac app): needs CGO
  # + mingw-w64 (release.yml installs it); -H windowsgui = no console window.
  - id: desktop-windows
    binary: unitill-desktop
    main: ./cmd/unitill-desktop
    env:
      - CGO_ENABLED=1
      - CC=x86_64-w64-mingw32-gcc
      - CXX=x86_64-w64-mingw32-g++
    flags: [-trimpath, -tags=desktop]
    ldflags: ["-s -w -H windowsgui -X github.com/universaltill/universal-till/internal/buildinfo.Version={{.Version}}"]
    goos: [windows]
    goarch: [amd64]
  - id: darwin
    binary: unitill-pos
    main: .
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags: ["-s -w -X github.com/universaltill/universal-till/internal/buildinfo.Version={{.Version}}"]
    goos: [darwin]
    goarch: [arm64]
  # Friendly .deb uninstaller (ut-docs#1083): backs the shop's database up
  # (verified) before delegating removal to apt-get. .deb-only, so it goes
  # into nfpms (via a staged contents: entry, see below) but deliberately
  # NOT into the tar.gz archives — portable installs keep
  # uninstall-unitill.sh.
  #
  # Deliberately NOT in nfpms' `ids:` (which auto-places a build's binary
  # in bindir, /opt/unitill/bin): this must run as root (stops the
  # service, calls apt-get), and postinstall.sh does `chown -R pos:pos
  # /opt/unitill` for self-update (ut-docs#151) — a root-run binary
  # sitting in a pos-writable directory is a pos→root privilege
  # escalation (the exact class ut-docs#255 already fixed by moving the
  # kiosk scripts to /usr/lib/unitill, which is never pos-writable). This
  # one needs the same treatment, but as a per-arch Go binary (not a
  # static script), it can't just be an nfpm contents `src:` pointing at
  # a repo path — the hook below stages each arch's build output at a
  # fixed, non-version-suffixed path (goreleaser's own dist layout embeds
  # an unpredictable GOAMD64/GOARM64 suffix, e.g.
  # dist/uninstall_linux_amd64_v1/..., that isn't safe to hardcode) so
  # the nfpm contents entry can reference it with the same
  # `{{ .Arch }}`-templated pattern already used for the desktop shell
  # below.
  - id: uninstall
    binary: unitill-uninstall
    main: ./cmd/unitill-uninstall
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags: ["-s -w -X github.com/universaltill/universal-till/internal/buildinfo.Version={{.Version}}"]
    goos: [linux]
    goarch: [amd64, arm64]
    hooks:
      post:
        - cmd: sh -c 'mkdir -p "dist/uninstall-stage/{{ .Arch }}" && cp "{{ .Path }}" "dist/uninstall-stage/{{ .Arch }}/unitill-uninstall"'

# The binary reads web/ (templates, locales, assets) from disk at runtime —
# every artifact must carry it, plus the right double-click launcher.
archives:
  - id: linux
    ids: [linux]
    formats: [tar.gz]
    files:
      - web/**
      - src: packaging/pos.env.example
        dst: pos.env.example
      - src: packaging/pos.env.example
        dst: pos.env
      - src: packaging/linux/run-unitill.sh
        dst: run-unitill.sh
        info: { mode: 0o755 }
      - src: packaging/linux/uninstall-unitill.sh
        dst: uninstall-unitill.sh
        info: { mode: 0o755 }
      # Desktop shell (GTK/WebKit app window) — prebuilt per-arch by the
      # linux-shells job in release.yml (CGO needs native GTK dev headers).
      - src: "dist-shells/linux-{{ .Arch }}/unitill-desktop"
        dst: unitill-desktop
        info: { mode: 0o755 }
      # Kiosk mode for Pi OS Lite / headless Debian (no desktop needed).
      - src: packaging/linux/unitill-kiosk-setup.sh
        dst: unitill-kiosk-setup.sh
        info: { mode: 0o755 }
      - src: packaging/linux/unitill-kiosk-launch.sh
        dst: unitill-kiosk-launch.sh
        info: { mode: 0o755 }
      - README.md
      - LICENSE*
  - id: macos
    ids: [darwin]
    formats: [tar.gz]
    files:
      - web/**
      - src: packaging/pos.env.example
        dst: pos.env.example
      - src: packaging/pos.env.example
        dst: pos.env
      - src: packaging/macos/run-unitill.command
        dst: run-unitill.command
        info: { mode: 0o755 }
      - src: packaging/macos/uninstall-unitill.command
        dst: uninstall-unitill.command
        info: { mode: 0o755 }
      - README.md
      - LICENSE*
  - id: windows
    ids: [windows, desktop-windows]
    formats: [zip]
    files:
      - web/**
      - src: packaging/pos.env.example
        dst: pos.env.example
      - src: packaging/pos.env.example
        dst: pos.env
      - src: packaging/windows/run-unitill.bat
        dst: run-unitill.bat
      - src: packaging/windows/uninstall-unitill.bat
        dst: uninstall-unitill.bat
      - README.md
      - LICENSE*

nfpms:
  - id: deb
    ids: [linux]
    package_name: unitill-pos
    formats: [deb]
    # arm64 = Raspberry Pi OS 64-bit; amd64 = any Debian/Ubuntu box.
    maintainer: Task Runner Technology LTD <support@universaltill.com>
    description: |-
      Universal Till — offline-first point of sale.
      Free, open POS with a plugin marketplace. Runs fully offline;
      first-boot wizard at http://localhost:8080.
    homepage: https://universaltill.com
    license: MIT
    bindir: /opt/unitill/bin
    # The desktop shell cgo-links directly against GTK3/WebKitGTK (ADR-0028:
    # our patched fork of webview_go targets webkit2gtk-4.1, not upstream's
    # abandoned 4.0, which current Raspberry Pi OS / Debian 13 trixie
    # dropped entirely -- no installable candidate at all on that distro).
    # `recommends` (not `suggests`, and not `depends`): plain `apt install`
    # pulls these in by default so the double-click app actually works out
    # of the box on any Linux desktop -- `suggests` is NEVER auto-installed
    # by apt, so on a fresh install that didn't already have these libs, the
    # dynamic linker refuses to even exec unitill-desktop at all (no window,
    # no visible error to a user just double-clicking an icon) -- it never
    # reaches Go code, so this isn't the same as webview.New returning nil
    # (that's the separate no-display-available case, which DOES fall back
    # to opening a browser -- see cmd/unitill-desktop/webview_fallback.go).
    # libgtk-3-0 (not libgtk-3-0t64): trixie's libgtk-3-0t64 package
    # `Provides: libgtk-3-0`, so this virtual-package name resolves on
    # every currently-built target (bookworm, jammy, trixie) without
    # needing a distro-conditional entry -- verified via apt-cache show.
    # Still skippable with `--no-install-recommends` for headless/kiosk-only
    # Pi installs that don't want the desktop stack at all (see
    # packaging/linux/unitill-kiosk-setup.sh, updated to use this flag).
    # fonts-noto-color-emoji: the POS UI's icons (menu tiles, status
    # glyphs, plugin buttons) are plain Unicode emoji text, and a base
    # Raspberry Pi OS image ships NO color-emoji font at all -- confirmed
    # on a real field device (2026-07-29): every menu icon rendered as a
    # blank/tofu box until the font was installed. Arch: all; same package
    # name on every currently-built target (bookworm, jammy, trixie).
    # NOTE: the kiosk flow documents `--no-install-recommends`, so
    # packaging/linux/unitill-kiosk-setup.sh ALSO installs this explicitly
    # (both spots CI-guarded by scripts/ci/guard-emoji-font.sh).
    recommends:
      - libwebkit2gtk-4.1-0
      - libgtk-3-0
      - fonts-noto-color-emoji
    contents:
      - src: web
        dst: /opt/unitill/web
      - src: packaging/systemd/unitill-pos.service
        dst: /etc/systemd/system/unitill-pos.service
      - src: packaging/pos.env.example
        dst: /opt/unitill/pos.env
        type: config|noreplace
      # Desktop app shell (per-arch, prebuilt by the linux-shells CI job) +
      # its applications-menu entry and icon.
      - src: "dist-shells/linux-{{ .Arch }}/unitill-desktop"
        dst: /opt/unitill/bin/unitill-desktop
        file_info: { mode: 0o755 }
      - src: packaging/linux/universal-till.desktop
        dst: /usr/share/applications/universal-till.desktop
      - src: packaging/linux/universal-till.png
        dst: /usr/share/icons/hicolor/512x512/apps/universal-till.png
      # Kiosk mode (Pi OS Lite): run unitill-kiosk-setup once, reboot. Root-
      # owned, outside /opt/unitill (postinstall.sh chowns that whole tree to
      # pos for self-update, ut-docs#151) — both scripts are root-executed
      # (unitill-kiosk-firstboot.service has no User=, and the manual `sudo`
      # flow is root too), so they must not sit somewhere pos can rewrite
      # (ut-docs#255).
      - src: packaging/linux/unitill-kiosk-setup.sh
        dst: /usr/lib/unitill/unitill-kiosk-setup
        file_info: { mode: 0o755 }
      - src: packaging/linux/unitill-kiosk-launch.sh
        dst: /usr/lib/unitill/unitill-kiosk-launch.sh
        file_info: { mode: 0o755 }
      # Friendly uninstaller (ut-docs#1083, per-arch build's `hooks.post`
      # above): same reasoning as the kiosk scripts just above — must run
      # as root, so it lives outside /opt/unitill (never pos-writable),
      # dpkg-owned here so a purge removes it automatically (no manual rm
      # needed, unlike the kiosk units which are heredoc-written and thus
      # NOT package-owned). postinstall.sh symlinks it onto PATH at
      # /usr/bin/unitill-uninstall (not /usr/local/bin — Debian Policy
      # §9.1.2 reserves that for the local admin, not packages).
      - src: "dist/uninstall-stage/{{ .Arch }}/unitill-uninstall"
        dst: /usr/lib/unitill/unitill-uninstall
        file_info: { mode: 0o755 }
    scripts:
      postinstall: packaging/scripts/postinstall.sh
      preremove: packaging/scripts/preremove.sh
      postremove: packaging/scripts/postremove.sh

checksum:
  name_template: checksums.txt

release:
  # Draft, not published: windows-installer/macos-app/android-app/
  # verify-versions all run AFTER this job (release.yml's needs: graph) and
  # upload their own assets to the release goreleaser creates here — in
  # PARALLEL with each other, not gated on one another. A public non-draft
  # release becomes "Latest" (and releases/latest/download/* starts
  # resolving) the instant this job finishes, regardless of whether those
  # slower jobs — Android above all, SDK+Gradle+gomobile is consistently
  # the long pole — have even started. v0.8.3 (2026-08-31) shipped exactly
  # that way: android-app hit a transient go.sum verification error,
  # goreleaser had already published, and the website's Android download
  # button 404'd against a "Latest" release with no APK in it at all.
  # release.yml's new publish-release job flips this to non-draft (making
  # it "Latest") only after every platform job succeeds — see that job's
  # own comment before changing this back to `false`.
  draft: true
  footer: |
    **Raspberry Pi / Debian:** `sudo apt install ./unitill-pos_*_arm64.deb`
    then open http://localhost:8080 — the first-boot wizard does the rest.
    To remove it later, `sudo unitill-uninstall` is the recommended way — it
    offers a verified backup of your shop data first, then asks whether to
    keep or delete the data (plain `apt remove unitill-pos` / `apt remove
    --purge unitill-pos` still work exactly as before).

    **Windows (recommended):** run **`unitill-pos-setup-*.exe`** — a guided
    installer; Universal Till then opens in **its own app window** (no
    terminal, no browser) from the Start-menu/desktop shortcut. Portable
    copy: unzip and double-click `unitill-desktop.exe` (or `run-unitill.bat`
    for the browser flavour).

    **macOS:** unzip, then double-click `run-unitill.command`. The first time,
    macOS may say the developer is unidentified — right-click the file, choose
    **Open**, then **Open** again (a one-time step until we ship a signed build).

    **Linux desktop app:** after installing the `.deb`, "Universal Till" is in
    the applications menu (its own window, like the mac/windows app). From the
    `tar.gz`: `./unitill-desktop`. Server-style still works: `./run-unitill.sh`.

    **Raspberry Pi kiosk (Pi OS Lite, no desktop):** install the `.deb` and
    reboot — a fresh install sets the fullscreen kiosk up automatically on
    first boot (opt out first with `sudo touch /etc/unitill/no-kiosk` if you
    don't want that).

    **Raspberry Pi with a desktop (Pi OS "with Desktop"):** a fresh `.deb`
    install instead brings the till up fullscreen *on top of* the desktop at
    login, with Settings → Display → "Exit to OS window" (admin PIN) as the
    way back (opt out first with `sudo mkdir -p /etc/unitill && sudo touch
    /etc/unitill/no-desktop-kiosk-overlay`). On upgrades, or on a non-Pi
    Debian box, run `sudo /usr/lib/unitill/unitill-kiosk-setup` once and
    reboot for the dedicated no-desktop kiosk.

    Every download opens the setup wizard at http://localhost:8080.
